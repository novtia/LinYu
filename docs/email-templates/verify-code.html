<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮箱验证码</title>
</head>
<body style="margin:0;padding:0;background:#e4efe9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#e4efe9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#f3f8f6;border-radius:16px;overflow:hidden;border:1px solid #c9ddd4;">
          <tr>
            <td style="background:#0f6e5c;padding:22px 28px;">
              <div style="color:#ffffff;font-size:20px;font-weight:700;">{{site_name}}</div>
              <div style="color:rgba(255,255,255,0.85);font-size:13px;margin-top:6px;">{{scene}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;text-align:center;background:#f3f8f6;">
              <p style="margin:0 0 8px;color:#14201c;font-size:15px;line-height:1.6;">
                {{message}}
              </p>
              <p style="margin:0 0 20px;color:#5a6b64;font-size:13px;">你的验证码是：</p>
              <div style="display:inline-block;background:#e8f1ec;border:1px solid #c9ddd4;border-radius:12px;padding:16px 28px;font-size:32px;font-weight:800;letter-spacing:8px;color:#0f6e5c;">
                {{code}}
              </div>
              <p style="margin:24px 0 0;color:#8a9a93;font-size:12px;line-height:1.6;">
                验证码 {{expire_minutes}} 分钟内有效。请勿泄露给他人。如非本人操作，请忽略本邮件。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
