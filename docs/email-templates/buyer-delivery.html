<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发货通知</title>
</head>
<body style="margin:0;padding:0;background:#e4efe9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#e4efe9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#f3f8f6;border-radius:16px;overflow:hidden;border:1px solid #c9ddd4;">
          <tr>
            <td style="background:#0f6e5c;padding:22px 28px;">
              <div style="color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.02em;">{{site_name}}</div>
              <div style="color:rgba(255,255,255,0.85);font-size:13px;margin-top:6px;">付款成功，商品已发放</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;background:#f3f8f6;">
              <p style="margin:0 0 16px;color:#14201c;font-size:15px;line-height:1.6;">
                你好，{{username}}：<br />
                你的订单已完成发货，请妥善保存以下内容。
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#e8f1ec;border-radius:12px;margin:0 0 20px;">
                <tr>
                  <td style="padding:14px 16px;color:#5a6b64;font-size:13px;line-height:1.8;">
                    <div>订单号：<strong style="color:#14201c;">{{order_id}}</strong></div>
                    <div>商品：<strong style="color:#14201c;">{{products}}</strong></div>
                    <div>金额：<strong style="color:#0f6e5c;">¥{{total}}</strong></div>
                  </td>
                </tr>
              </table>
              <div style="color:#5a6b64;font-size:13px;font-weight:600;margin-bottom:8px;">发货内容</div>
              <div style="background:#eef5f1;border:1px solid #c9ddd4;border-radius:12px;padding:16px;color:#14201c;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;">{{delivery_content}}</div>
              <p style="margin:20px 0 0;color:#8a9a93;font-size:12px;line-height:1.6;">
                也可登录网站，在「我的订单」中随时查看。本邮件由系统自动发送，请勿直接回复。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
