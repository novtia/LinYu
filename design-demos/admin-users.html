<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 用户管理</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="admin.css" />
  <style>
    .desk-inner { width: min(1280px, 100%); }

    /* 1. 顶部双区：左读者分层胶囊漏斗 + 右新增首购图表 */
    .user-hero {
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, 1.15fr);
      gap: 24px; padding-bottom: 22px; border-bottom: 2px solid var(--ink);
      align-items: stretch;
    }
    .user-hero > * { min-width: 0; }
    .u-kicker {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: .72rem; color: var(--ink-mute);
    }
    .u-kicker .badge {
      padding: 2px 8px; border-radius: 99px; background: var(--ink); color: #eef8f4;
      font-weight: 700; font-size: .66rem; letter-spacing: .06em;
    }
    .user-hero h1 {
      margin: 8px 0 0; font-family: var(--font-display);
      font-size: clamp(1.7rem, 2.4vw, 2.2rem); letter-spacing: -.04em; line-height: 1.05;
    }
    .user-hero .lead { margin: 8px 0 0; color: var(--ink-mute); font-size: .85rem; line-height: 1.55; }
    .user-hero .lead b { color: var(--teal); font-weight: 700; font-family: var(--font-mono); }

    .cohort-stack { display: grid; gap: 8px; margin-top: 14px; }
    .cohort-btn {
      width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; padding: 9px 13px; transition: .16s var(--ease);
      display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    }
    .cohort-btn:hover { border-color: var(--teal); }
    .cohort-btn.on { border-color: var(--ink); background: var(--paper); box-shadow: inset 3px 0 0 var(--teal); }
    .cohort-btn .clbl { font-size: .78rem; font-weight: 700; }
    .cohort-btn .clbl small { display: block; font-weight: 500; font-size: .68rem; color: var(--ink-mute); }
    .cohort-btn .ctrack { height: 7px; border-radius: 99px; background: rgba(20,32,28,.06); overflow: hidden; }
    .cohort-btn .ctrack i { display: block; height: 100%; border-radius: 99px; }
    .cohort-btn .cval { font-family: var(--font-mono); font-size: .78rem; font-weight: 700; white-space: nowrap; }

    .reg-card {
      background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 4px 4px 0 rgba(20, 32, 28, .04);
    }
    .reg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .reg-head h2 { margin: 0; font-family: var(--font-display); font-size: 1rem; letter-spacing: -.02em; }
    .seg-pills {
      display: inline-flex; padding: 2px; border-radius: 8px;
      background: var(--fog); border: 1px solid var(--line);
    }
    .seg-pills button {
      height: 26px; padding: 0 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--ink-mute); font-size: .74rem; font-weight: 700;
    }
    .seg-pills button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(20,32,28,.08); }
    .reg-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px;
      padding: 10px 12px; border-radius: 8px; background: var(--fog); border: 1px solid var(--line);
      font-size: .72rem; color: var(--ink-mute);
    }
    .reg-stats b {
      display: block; margin-top: 2px; color: var(--ink); font-family: var(--font-mono);
      font-size: .95rem; font-weight: 700;
    }

    /* 2. 主体：左名册 + 右读者档案夹 */
    .user-stage {
      display: grid; grid-template-columns: minmax(0, 1fr) 316px;
      gap: 22px; margin-top: 22px; align-items: start;
    }
    .user-stage > * { min-width: 0; }
    .u-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      flex-wrap: wrap; padding: 10px 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    }
    .u-toolbar .search { min-width: 190px; max-width: 280px; padding-bottom: 4px; }
    .u-sheet-card {
      margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    }
    .u-sheet-card .sheet { margin-top: 0; }
    .u-sheet-card .sheet th { padding: 11px 12px; background: #f8fbfa; border-bottom: 1px solid var(--line-strong); }
    .u-sheet-card .sheet td { padding: 11px 12px; }
    .u-ident { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .u-ava {
      width: 32px; height: 32px; border-radius: 99px; flex-shrink: 0; display: grid; place-items: center;
      font-size: .78rem; font-weight: 800; background: var(--paper); color: var(--teal-deep);
    }
    .u-ava.vip { background: var(--ink); color: var(--mint); }
    .u-ava.off { background: rgba(180,35,24,.1); color: var(--danger); }
    .u-ops { display: flex; gap: 8px; justify-content: flex-end; }
    .u-ops button { border: 0; background: none; padding: 0; color: var(--teal); font-weight: 700; font-size: .74rem; }
    .u-ops button:disabled { opacity: .35; cursor: default; color: var(--ink-mute); }

    /* 右侧读者档案夹 */
    .dossier {
      position: sticky; top: 14px;
      background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 18px 20px; box-shadow: 4px 4px 0 rgba(20,32,28,.05);
    }
    .dossier-kicker {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .7rem; font-weight: 700; letter-spacing: .06em; color: var(--ink-mute);
    }
    .dossier-head { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .dossier-ava {
      width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center;
      background: var(--ink); color: #fff; font-weight: 800; font-size: 1rem; flex-shrink: 0;
    }
    .dossier-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -.03em; }
    .dossier-head .meta { margin-top: 3px; font-size: .76rem; color: var(--ink-mute); word-break: break-all; }
    .dossier-metrics {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px;
    }
    .dm-box {
      padding: 10px 12px; border-radius: 8px; background: var(--fog); border: 1px solid var(--line);
    }
    .dm-box small { display: block; font-size: .68rem; color: var(--ink-mute); }
    .dm-box b { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: .96rem; }
    .dossier-acts {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .dossier-acts .full { grid-column: 1 / -1; justify-content: center; }
    .dossier-acts .line-btn, .dossier-acts .teal-btn { justify-content: center; }

    @media (max-width: 1120px) {
      .user-hero, .user-stage { grid-template-columns: 1fr; }
      .dossier { position: static; }
    }
    @media (max-width: 560px) {
      .reg-stats { grid-template-columns: 1fr; }
      .cohort-btn { grid-template-columns: 92px minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <strong>领匣后台设计稿</strong>
    <nav class="demo-links">
      <a href="admin-dashboard.html">概览</a>

  <div class="admin">
    <aside class="aside">
      <div class="aside-brand"><span class="brand-mark"></span>领匣控制台</div>
      <nav>
        <div class="nav-cap">工作台</div>
        <a href="admin-dashboard.html"><i data-lucide="layout-dashboard"></i>概览</a>
        <div class="nav-cap">运营管理</div>
        <a href="admin-products.html"><i data-lucide="package"></i>商品与分类</a>
        <a class="active" href="admin-users.html"><i data-lucide="users"></i>用户管理</a>
        <div class="nav-cap">交易履约</div>
        <a href="admin-revenue.html"><i data-lucide="wallet"></i>营收<span class="n">5</span></a>
        <a href="admin-conversations.html"><i data-lucide="message-square"></i>约稿对话<span class="n">4</span></a>
        <div class="nav-cap">站点配置</div>
        <a href="admin-settings.html"><i data-lucide="credit-card"></i>支付接入</a>
        <a href="admin-settings.html#system"><i data-lucide="settings-2"></i>系统设置</a>
        <a href="admin-settings.html#website"><i data-lucide="globe"></i>网站设置</a>
      </nav>
      <div class="aside-foot">设计稿 · 不接真实数据<br />xinx.shop</div>

    <div class="main">
      <div class="topbar">
        <span class="crumb">控制台 / 运营管理 / <b>用户管理</b></span>
        <div class="topbar-right"><span class="date" id="today"></span><div class="avatar">店</div></div>
      </div>

      <main class="desk">
        <div class="desk-inner">
          <section class="user-hero">
            <div>
              <div class="u-kicker">
                <span class="badge">READER ROSTER</span>
                <span>点左侧分层可直接筛选下方花名册</span>
              </div>
              <h1>读者与买家名册</h1>
              <p class="lead" id="lead"></p>
              <div class="cohort-stack" id="cohorts"></div>
            </div>

            <div class="reg-card">
              <div>
                <div class="reg-head">
                  <h2>新增与首购转化 <small id="chart-cap" style="font-family:var(--font-body);font-size:.73rem;color:var(--ink-mute);font-weight:500"></small></h2>
                  <div class="seg-pills" id="periods">
                    <button type="button" data-p="7">近 7 日</button>
                    <button type="button" class="on" data-p="30">近 30 日</button>
                  </div>
                </div>
                <div class="reg-stats" id="reg-stats"></div>
              </div>
              <div class="legend" style="margin-top:12px"><span><i class="cat" style="opacity:.25"></i>新注册</span><span><i class="cat"></i>其中完成首购</span></div>
              <div class="chart-wrap"><svg id="chart" viewBox="0 0 720 164" preserveAspectRatio="none" style="height:164px"></svg></div>
            </div>
          </section>

          <div class="user-stage">
            <div>
              <div class="u-toolbar">
                <label class="search">
                  <i data-lucide="search" style="width:15px;height:15px;color:var(--ink-mute)"></i>
                  <input id="q" placeholder="搜索用户名或邮箱…" />
                </label>
                <div class="chips" id="chips">
                  <button type="button" class="on" data-f="all">全部</button>
                  <button type="button" data-f="pay">付费</button>
                  <button type="button" data-f="repeat">复购</button>
                  <button type="button" data-f="new">只注册</button>
                  <button type="button" data-f="off">禁用</button>
                </div>
              </div>

              <div class="u-sheet-card">
                <table class="sheet">
                  <thead><tr><th>读者</th><th>订单</th><th>累计消费</th><th>最近活跃</th><th>身份标签</th><th style="text-align:right">操作</th></tr></thead>
                  <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden style="padding:28px 16px">没有匹配的用户</p>
              </div>
            </div>

            <aside class="dossier" id="detail" aria-label="读者档案夹"></aside>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
  <script>
    const $ = (id) => document.getElementById(id)
    lxDate()

    const users = [
      { name: "林晚", email: "linwan@mail.com", role: "买家", orders: 4, spend: 3120, last: "今天 12:40", disabled: false },
      { name: "孟凡", email: "mf@mail.com", role: "买家", orders: 3, spend: 4860, last: "4 天前", disabled: false },
      { name: "白鹿", email: "bailu@mail.com", role: "买家", orders: 2, spend: 1920, last: "3 天前", disabled: false },
      { name: "老周", email: "laoz@mail.com", role: "买家", orders: 2, spend: 2160, last: "昨天", disabled: false },
      { name: "小乔", email: "xq@mail.com", role: "买家", orders: 5, spend: 246, last: "今天 08:17", disabled: false },
      { name: "顾里", email: "guli@mail.com", role: "买家", orders: 2, spend: 768, last: "今天 09:52", disabled: false },
      { name: "苏澄", email: "sucheng@mail.com", role: "买家", orders: 1, spend: 0, last: "今天 11:05", disabled: false },
      { name: "阿北", email: "abei@mail.com", role: "买家", orders: 1, spend: 1280, last: "昨天", disabled: false },
      { name: "陈默", email: "chenmo@mail.com", role: "买家", orders: 1, spend: 28, last: "2 天前", disabled: false },
      { name: "何夕", email: "hexi@mail.com", role: "买家", orders: 1, spend: 38, last: "3 天前", disabled: false },
      { name: "匿名访客", email: "—", role: "买家", orders: 0, spend: 0, last: "今天", disabled: false, guest: true },
      { name: "测试号", email: "test@xinx.shop", role: "买家", orders: 0, spend: 0, last: "12 天前", disabled: true },
      { name: "店主", email: "admin@xinx.shop", role: "管理员", orders: 0, spend: 0, last: "今天", disabled: false, admin: true },
    ]
    let filter = "all", query = "", active = "林晚", range = "30"

    function match(u) {
      if (filter === "pay" && u.spend <= 0) return false
      if (filter === "repeat" && u.orders < 2) return false
      if (filter === "new" && (u.orders > 0 || u.admin)) return false
      if (filter === "off" && !u.disabled) return false
      if (query) {
        const q = query.toLowerCase()
        if (![u.name, u.email].some((s) => s.toLowerCase().includes(q))) return false
      }
      return true
    }

    function draw(reg, buy) {
      const w = 720, h = 164, padL = 28, padR = 8, padT = 10, padB = 22
      const n = reg.length
      const max = Math.max(...reg, 1) * 1.2
      const slot = (w - padL - padR) / n
      const x = (i) => padL + slot * (i + 0.5)
      const y = (v) => padT + (h - padT - padB) * (1 - v / max)
      const bw = Math.max(10, slot * 0.56)
      const bars = reg.map((v, i) => {
        const bh = (h - padT - padB) * (v / max)
        const bh2 = (h - padT - padB) * (buy[i] / max)
        return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="rgba(15,110,92,.2)" />
          <rect x="${(x(i) - bw / 2).toFixed(1)}" y="${y(buy[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh2.toFixed(1)}" rx="2" fill="#0f6e5c" />`
      }).join("")
      const step = n > 10 ? 2 : 1
      const axis = reg.map((_, i) => (i % step === 0 || i === n - 1) ? `<text x="${x(i)}" y="${h - 4}" text-anchor="middle" fill="#6b7c74" font-size="10" font-family="JetBrains Mono, sans-serif">D${i + 1}</text>` : "").join("")
      $("chart").innerHTML = bars + axis
    }

    function render() {
      const spend = users.reduce((a, u) => a + u.spend, 0)
      const disabledN = users.filter((u) => u.disabled).length
      const fresh = range === "7" ? 31 : 128
      const first = range === "7" ? 18 : 74
      const convRate = Math.round((first / fresh) * 100)

      $("lead").innerHTML = `全站注册 <b>312</b> 人，付过钱的 <b>186</b> 人，复购率 <b>38%</b>。当前名单消费合计 <b>${lxYuan(spend)}</b>。`

      const cohorts = [
        ["all", "全站注册", "含管理员 1 人", "312 人", 100, "var(--ink)"],
        ["pay", "付费买家", "至少付过一笔", "186 人 · 60%", 60, "var(--teal)"],
        ["repeat", "复购铁粉", "下单 ≥ 2 次", "71 人 · 38%", 38, "var(--gold)"],
        ["off", "已禁用账号", "限制登录", `${disabledN} 人`, Math.max(4, disabledN * 8), "var(--danger)"],
      ]
      $("cohorts").innerHTML = cohorts.map(([f, lbl, sub, val, pct, color]) => `
        <button type="button" class="cohort-btn ${filter === f ? "on" : ""}" data-f="${f}">
          <span class="clbl">${lbl}<small>${sub}</small></span>
          <span class="ctrack"><i style="width:${pct}%;background:${color}"></i></span>
          <span class="cval">${val}</span>
        </button>
      `).join("")

      $("reg-stats").innerHTML = `
        <div>本期新注册<b>${fresh} 人</b></div>
        <div>其中首购成交<b>${first} 人</b></div>
        <div>首购转化率<b style="color:var(--teal)">${convRate}%</b></div>
      `

      const n = range === "7" ? 7 : 14
      const reg = Array.from({ length: n }, (_, i) => Math.max(1, Math.round((fresh / n) * (0.7 + 0.6 * Math.sin(i)))))
      reg[reg.length - 1] += fresh - reg.reduce((a, b) => a + b, 0)
      const buy = reg.map((v) => Math.max(0, Math.round(v * (first / fresh))))
      draw(reg, buy)
      $("chart-cap").textContent = range === "7" ? "近 7 天每日表现" : "近 14 天走势"

      document.querySelectorAll("#chips button").forEach((x) => x.classList.toggle("on", x.dataset.f === filter))

      const list = users.filter(match)
      $("rows").innerHTML = list.map((u) => {
        const cls = u.disabled ? "off" : u.orders >= 2 ? "vip" : ""
        return `
          <tr data-name="${u.name}" class="${u.name === active ? "on" : ""}">
            <td>
              <div class="u-ident">
                <span class="u-ava ${cls}">${u.name.slice(0, 1)}</span>
                <div style="min-width:0">
                  <span class="name">${u.name}</span>
                  <span class="sub">${u.email}${u.admin ? " · 管理员" : ""}</span>
                </div>
              </div>
            </td>
            <td class="mono">${u.orders}</td>
            <td class="mono" style="font-weight:700">${lxYuan(u.spend)}</td>
            <td class="mono" style="color:var(--ink-mute)">${u.last}</td>
            <td>${u.disabled ? `<span class="tag danger">禁用</span>` : u.orders >= 2 ? `<span class="tag">复购</span>` : u.spend > 0 ? `<span class="tag gold">付费</span>` : `<span class="tag mute">${u.admin ? "管理员" : "未付"}</span>`}</td>
            <td class="u-ops"><button type="button" data-reset="${u.name}" ${u.admin ? "disabled" : ""}>重置密码</button></td>
          </tr>
        `
      }).join("")
      $("empty").hidden = !!list.length

      const u = users.find((x) => x.name === active) || list[0]
      if (!u) { $("detail").innerHTML = `<p class="empty">未选中用户</p>`; return }
      active = u.name
      const avg = u.orders ? Math.round(u.spend / u.orders) : 0
      const badge = u.disabled ? `<span class="tag danger">已禁用</span>` : u.orders >= 2 ? `<span class="tag">复购读者</span>` : u.spend > 0 ? `<span class="tag gold">已付费</span>` : `<span class="tag mute">${u.admin ? "管理员" : "暂未消费"}</span>`
      $("detail").innerHTML = `
        <div class="dossier-kicker"><span>读者档案夹</span>${badge}</div>
        <div class="dossier-head">
          <div class="dossier-ava">${u.name.slice(0, 1)}</div>
          <div style="min-width:0">
            <h3>${u.name}</h3>
            <div class="meta">${u.email} · ${u.role}</div>
          </div>
        </div>
        <div class="dossier-metrics">
          <div class="dm-box"><small>累计订单</small><b>${u.orders} 笔</b></div>
          <div class="dm-box"><small>累计消费</small><b>${lxYuan(u.spend)}</b></div>
          <div class="dm-box"><small>客单均价</small><b>${u.orders ? lxYuan(avg) : "—"}</b></div>
          <div class="dm-box"><small>最近活跃</small><b>${u.last}</b></div>
        </div>
        <div class="dossier-acts">
          <a class="teal-btn full" href="admin-revenue.html?q=${encodeURIComponent(u.name)}#orders">查看名下订单</a>
          ${u.orders ? `<a class="line-btn" href="admin-conversations.html">约稿对话</a>` : `<span class="line-btn" style="opacity:.45;cursor:default">暂无约稿</span>`}
          ${u.admin ? `<span class="line-btn" style="opacity:.45;cursor:default">管理员不可禁</span>` : `<button class="line-btn ${u.disabled ? "" : "danger"}" type="button" data-ban="${u.name}">${u.disabled ? "恢复启用" : "禁用账号"}</button>`}
        </div>
      `
      lxIcons()
    }

    $("periods").onclick = (e) => {
      const b = e.target.closest("[data-p]")
      if (!b) return
      range = b.dataset.p
      document.querySelectorAll("#periods button").forEach((x) => x.classList.toggle("on", x === b))
      render()
    }
    document.addEventListener("click", (e) => {
      const fbtn = e.target.closest("[data-f]")
      if (fbtn) {
        filter = fbtn.dataset.f
        render()
        return
      }
      const reset = e.target.closest("[data-reset]")
      if (reset) { lxToast("Demo：已为「" + reset.dataset.reset + "」生成一次性密码"); return }
      const ban = e.target.closest("[data-ban]")
      if (ban) {
        const u = users.find((x) => x.name === ban.dataset.ban)
        if (!u) return
        u.disabled = !u.disabled
        lxToast(u.disabled ? "已禁用「" + u.name + "」" : "已启用「" + u.name + "」")
        render()
        return
      }
      const tr = e.target.closest("tr[data-name]")
      if (tr && !e.target.closest("button")) { active = tr.dataset.name; render() }
    })
    $("q").oninput = (e) => { query = e.target.value.trim(); render() }

    render()
  </script>
</body>
</html>
