<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 商品与分类</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="admin.css" />
  <style>
    .desk-inner { width: min(1320px, 100%); }

    /* 1. 书目策展顶部刊头（Catalog Spine Header） */
    .catalog-head {
      display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, 1fr);
      gap: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--ink);
      align-items: end;
    }
    .catalog-head > * { min-width: 0; }
    .cat-kicker {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: .72rem; color: var(--ink-mute);
    }
    .cat-kicker .badge {
      padding: 2px 8px; border-radius: 99px; background: var(--teal); color: #fff;
      font-weight: 700; font-size: .66rem; letter-spacing: .06em;
    }
    .catalog-head h1 {
      margin: 8px 0 0; font-family: var(--font-display);
      font-size: clamp(1.7rem, 2.4vw, 2.25rem); letter-spacing: -.04em; line-height: 1.05;
    }
    .catalog-head .lead { margin: 8px 0 0; color: var(--ink-mute); font-size: .86rem; line-height: 1.55; }
    .catalog-head .lead b { color: var(--teal); font-weight: 700; font-family: var(--font-mono); }

    .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
    .pulse-strip {
      display: flex; gap: 0; width: 100%; background: #fff;
      border: 1px solid var(--line-strong); box-shadow: 3px 3px 0 rgba(20, 32, 28, .05);
    }
    .pulse-strip .ps {
      flex: 1; padding: 10px 14px; min-width: 0;
    }
    .pulse-strip .ps + .ps { border-left: 1px solid var(--line); }
    .pulse-strip small { display: block; font-size: .68rem; color: var(--ink-mute); white-space: nowrap; }
    .pulse-strip b {
      display: block; margin-top: 4px; font-family: var(--font-body); font-weight: 800;
      font-size: 1.15rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .pulse-strip b.warn { color: var(--danger); }

    /* 2. 三段式书架与目录工作台（左：分类书脊轨 | 中：商品陈列区 | 右：作品检验台） */
    .studio-grid {
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr) 288px;
      gap: 18px; margin-top: 22px; align-items: start;
    }
    .studio-grid > * { min-width: 0; }

    /* 左栏：分类目录轨 */
    .cat-rail {
      position: sticky; top: 14px;
      background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 14px; box-shadow: 3px 3px 0 rgba(20, 32, 28, .04);
    }
    .cat-rail.focus-ring {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 110, 92, .14), 3px 3px 0 rgba(20, 32, 28, .05);
    }
    .rail-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .rail-head h2 {
      margin: 0; font-family: var(--font-display); font-size: .96rem; letter-spacing: -.02em;
      display: flex; align-items: center; gap: 7px;
    }
    .mini-add {
      height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--line-strong);
      background: var(--fog); font-size: .72rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;
    }
    .mini-add:hover { border-color: var(--teal); color: var(--teal); background: #fff; }

    .cat-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
    .cat-item {
      border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px;
      background: var(--fog); cursor: pointer; transition: .15s var(--ease);
    }
    .cat-item:hover { border-color: var(--teal); background: #fff; }
    .cat-item.on {
      border-color: var(--ink); background: var(--paper);
      box-shadow: inset 3px 0 0 var(--teal);
    }
    .cat-item.off { opacity: .66; }
    .cat-top {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .cat-name {
      display: flex; align-items: center; gap: 6px; min-width: 0;
      font-size: .83rem; font-weight: 700;
    }
    .cat-name .dot-st {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--teal);
    }
    .cat-item.off .cat-name .dot-st { background: var(--ink-mute); }
    .cat-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-count {
      font-family: var(--font-mono); font-size: .72rem; font-weight: 700; color: var(--ink-mute);
      flex-shrink: 0;
    }
    .cat-bar {
      height: 3px; border-radius: 99px; background: rgba(20, 32, 28, .08);
      margin-top: 7px; overflow: hidden;
    }
    .cat-bar i { display: block; height: 100%; background: var(--teal); }
    .cat-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      margin-top: 6px; font-size: .69rem; color: var(--ink-mute); font-family: var(--font-mono);
    }
    .cat-ops { display: inline-flex; align-items: center; gap: 2px; }
    .cat-ops button {
      width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent;
      color: var(--ink-mute); display: grid; place-items: center; padding: 0;
    }
    .cat-ops button:hover { background: rgba(20, 32, 28, .08); color: var(--ink); }
    .cat-ops button:disabled { opacity: .28; cursor: default; }

    /* 左栏内联分类编辑器 */
    .cat-editor {
      margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong);
    }
    .cat-editor-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: .74rem; font-weight: 800; color: var(--ink-soft);
    }
    .cat-editor-head button {
      border: 0; background: none; padding: 0; color: var(--ink-mute); font-size: .72rem;
    }
    .cat-editor .fields { margin-top: 10px; gap: 10px; }
    .cat-editor .switch { padding: 7px 0; font-size: .8rem; }
    .cat-editor-acts {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px;
    }
    .cat-editor-acts .del-link {
      border: 0; background: none; padding: 0; color: var(--danger); font-size: .74rem; font-weight: 700;
    }

    /* 中栏：商品策展与陈列主区 */
    .shelf-stage { min-width: 0; }
    .stage-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 10px 14px; background: #fff; border: 1px solid var(--line); border-radius: 11px;
    }
    .stage-toolbar .search { min-width: 170px; max-width: 260px; padding-bottom: 4px; }
    .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .view-toggle {
      display: inline-flex; padding: 2px; border-radius: 8px;
      background: var(--fog); border: 1px solid var(--line);
    }
    .view-toggle button {
      width: 28px; height: 26px; border: 0; border-radius: 6px; background: transparent;
      color: var(--ink-mute); display: grid; place-items: center;
    }
    .view-toggle button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(20, 32, 28, .08); }

    .active-scope {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 12px; padding: 8px 12px; border-radius: 8px;
      background: rgba(232, 241, 238, .6); border: 1px solid var(--line);
      font-size: .76rem; color: var(--ink-soft);
    }
    .active-scope b { color: var(--ink); }
    .active-scope button {
      border: 0; background: none; color: var(--teal); font-weight: 700; font-size: .74rem; padding: 0;
    }

    /* 书架卡片视图（默认，突出图书/约稿出版物气质） */
    .shelf-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 12px; margin-top: 12px;
    }
    .book-card {
      background: #fff; border: 1px solid var(--line); border-radius: 11px;
      padding: 14px; cursor: pointer; transition: .16s var(--ease);
      display: flex; flex-direction: column; gap: 10px; min-width: 0;
    }
    .book-card:hover { border-color: var(--teal); transform: translateY(-1px); }
    .book-card.on {
      border-color: var(--ink); background: #f8fcfa;
      box-shadow: 3px 3px 0 rgba(20, 32, 28, .08);
    }
    .book-card.off { opacity: .68; }
    .book-top { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
    .book-cover {
      width: 44px; height: 58px; border-radius: 4px; flex-shrink: 0; position: relative; overflow: hidden;
      background: linear-gradient(155deg, rgba(255, 255, 255, .36), transparent 52%), hsl(var(--h), 34%, 32%);
      box-shadow: inset 3px 0 0 rgba(255, 255, 255, .22), 2px 2px 6px rgba(20, 32, 28, .12);
    }
    .book-cover::after {
      content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px;
      background: rgba(255, 255, 255, .28);
    }
    .book-meta { min-width: 0; flex: 1; }
    .book-tags { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .book-title {
      margin: 5px 0 0; font-size: .88rem; font-weight: 700; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .book-price {
      margin-top: 4px; font-family: var(--font-mono); font-size: .78rem; font-weight: 700; color: var(--ink-soft);
    }
    .book-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding-top: 9px; border-top: 1px dashed var(--line-strong);
      font-size: .72rem; color: var(--ink-mute);
    }
    .book-stats b { display: block; margin-top: 1px; font-family: var(--font-mono); font-size: .82rem; color: var(--ink); }
    .book-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-top: 8px; border-top: 1px solid var(--line);
    }
    .book-actions .ops { display: flex; gap: 10px; }
    .book-actions .ops button { border: 0; background: none; padding: 0; font-size: .73rem; font-weight: 700; color: var(--teal); }
    .book-actions .ops button.danger { color: var(--danger); }
    .book-actions .id-tag { font-family: var(--font-mono); font-size: .68rem; color: var(--ink-mute); }

    /* 表格视图 */
    .sheet-card {
      margin-top: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    }
    .sheet-card .sheet { margin-top: 0; }
    .sheet-card .sheet th { padding: 10px 12px; background: #f8fbfa; border-bottom: 1px solid var(--line-strong); }
    .sheet-card .sheet td { padding: 10px 12px; }

    /* 右栏：作品检验台（Inspector Dock） */
    .inspector {
      position: sticky; top: 14px;
      background: #fff; border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 18px; box-shadow: 4px 4px 0 rgba(20, 32, 28, .05);
    }
    .insp-hero { display: flex; gap: 14px; align-items: flex-start; }
    .insp-cover {
      width: 60px; height: 80px; border-radius: 5px; flex-shrink: 0;
      background: linear-gradient(155deg, rgba(255, 255, 255, .36), transparent 52%), hsl(var(--h), 34%, 32%);
      box-shadow: inset 4px 0 0 rgba(255, 255, 255, .22), 3px 4px 10px rgba(20, 32, 28, .16);
    }
    .insp-hero h3 { margin: 4px 0 0; font-family: var(--font-display); font-size: 1.15rem; letter-spacing: -.02em; line-height: 1.25; }
    .insp-hero .meta { margin-top: 5px; font-size: .74rem; color: var(--ink-mute); }
    .insp-kpis {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px;
    }
    .ik-box {
      padding: 9px 11px; border-radius: 8px; background: var(--fog); border: 1px solid var(--line);
    }
    .ik-box small { display: block; font-size: .68rem; color: var(--ink-mute); }
    .ik-box b { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: .92rem; }
    .insp-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .insp-block .lbl { font-size: .72rem; font-weight: 700; color: var(--ink-soft); display: flex; justify-content: space-between; }
    .insp-cat-select {
      width: 100%; margin-top: 6px; height: 34px; padding: 0 10px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--fog); font-size: .82rem; font-weight: 650;
    }
    .insp-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .insp-acts .full { grid-column: 1 / -1; }

    @media (max-width: 1240px) {
      .studio-grid { grid-template-columns: 248px minmax(0, 1fr); }
      .inspector { grid-column: 1 / -1; position: static; }
    }
    @media (max-width: 960px) {
      .catalog-head, .studio-grid { grid-template-columns: 1fr; }
      .head-right { align-items: stretch; }
      .cat-rail { position: static; }
    }
    @media (max-width: 560px) {
      .pulse-strip { flex-wrap: wrap; }
      .pulse-strip .ps { flex: 1 1 50%; }
    }
  </style>
</head>

        <div class="nav-cap">工作台</div>

    <div class="main">

          <div class="avatar">店</div>

      </div>

      <main class="desk">
        <div class="desk-inner">
          <header class="catalog-head">
            <div>
              <div class="cat-kicker">
                <span class="badge">CATALOG &amp; SHELF</span>
                <span>把前台书目分类与商品经营放到同一个工作台</span>

          <div class="studio-grid">

              <ul class="cat-list" id="cat-list"></ul>

              <div class="cat-editor" id="cat-editor" hidden>

                </label>

            <aside class="inspector" id="detail" aria-label="选中商品详情"></aside>
          </div>
        </div>
      </main>

    const $ = (id) => document.getElementById(id)
    lxDate()

    let categories = [
      { id: 1, name: "约稿", sort: 1, enabled: true },
      { id: 2, name: "都市", sort: 2, enabled: true },
      { id: 3, name: "短篇", sort: 3, enabled: true },
      { id: 4, name: "校园", sort: 4, enabled: true },
      { id: 5, name: "古风", sort: 5, enabled: false },
    ]

    let products = [
      { id: 8, name: "定制约稿 · 你来点梗我来写", catId: 1, mode: "commission", priceNum: 64, orders: 28, rev: 18240, on: true, h: 164 },
      { id: 21, name: "修仙长篇约稿", catId: 1, mode: "commission", priceNum: 64, orders: 4, rev: 9680, on: true, h: 28 },
      { id: 17, name: "都市职场 3 万字", catId: 1, mode: "commission", priceNum: 64, orders: 3, rev: 5760, on: true, h: 200 },
      { id: 3, name: "《深夜维修工》全文 + 番外", catId: 2, mode: "normal", priceNum: 38, orders: 86, rev: 3268, on: true, h: 188 },
      { id: 11, name: "人妻长篇 2.5 万字", catId: 1, mode: "commission", priceNum: 64, orders: 3, rev: 3200, on: true, h: 340 },
      { id: 4, name: "《雨夜租客》", catId: 2, mode: "normal", priceNum: 28, orders: 54, rev: 1512, on: true, h: 210 },
      { id: 6, name: "《玻璃海岸》全文精校版", catId: 3, mode: "normal", priceNum: 50, orders: 19, rev: 950, on: true, h: 196 },
      { id: 2, name: "《补课日记》番外", catId: 4, mode: "normal", priceNum: 32, orders: 22, rev: 704, on: true, h: 152 },
      { id: 9, name: "《午夜便利店》", catId: 2, mode: "normal", priceNum: 26, orders: 17, rev: 442, on: true, h: 222 },
      { id: 5, name: "《纸船》短篇合集", catId: 3, mode: "normal", priceNum: 18, orders: 11, rev: 198, on: true, h: 86 },
      { id: 14, name: "「都市人妻」合集包", catId: 2, mode: "normal", priceNum: 68, orders: 0, rev: 0, on: true, h: 12 },
      { id: 15, name: "西幻试读删减版", catId: 3, mode: "normal", priceNum: 12, orders: 0, rev: 0, on: false, h: 250 },
      { id: 16, name: "古风师徒约稿", catId: 5, mode: "commission", priceNum: 64, orders: 2, rev: 1536, on: false, h: 40 },
    ]

    let catScope = "all" // "all" | "uncat" | number
    let filter = "all"
    let query = ""
    let viewMode = "grid" // "grid" | "table"
    let activeProdId = products[0].id
    let editingCat = null // null | { mode: 'edit'|'new', id?: number, name: string, sort: number, enabled: boolean }

    function catName(catId) {
      return categories.find((c) => c.id === catId)?.name || "未分类"
    }
    function priceText(p) {
      return p.mode === "commission" ? `¥${p.priceNum} / 千字` : `¥${p.priceNum}`
    }
    function priceShort(p) {
      return p.mode === "commission" ? `¥${p.priceNum}/k` : `¥${p.priceNum}`
    }
    function series(seed, n) {
      const raw = []
      for (let i = 0; i < 14; i++) raw.push(Math.max(0, Math.round(4 + 6 * Math.sin(i * 0.7 + seed) + (i % 5))))
      if (!n) return raw.map(() => 0)
      const s = raw.reduce((a, b) => a + b, 0) || 1
      return raw.map((v) => Math.round((v / s) * n))
    }

    function matchProd(p) {
      if (catScope === "uncat" && p.catId) return false
      if (typeof catScope === "number" && p.catId !== catScope) return false
      if (filter === "on" && !p.on) return false
      if (filter === "off" && p.on) return false
      if (filter === "commission" && p.mode !== "commission") return false
      if (filter === "cold" && (p.orders > 0 || !p.on)) return false
      if (query) {
        const q = query.toLowerCase()
        if (![p.name, catName(p.catId), String(p.id)].some((s) => s.toLowerCase().includes(q))) return false
      }
      return true
    }

    function renderPulse() {
      const onList = products.filter((p) => p.on)
      const comN = onList.filter((p) => p.mode === "commission").length
      const coldN = onList.filter((p) => p.orders === 0).length
      const revAll = products.reduce((a, p) => a + p.rev, 0)
      const activeCats = categories.filter((c) => c.enabled).length
      $("lead").innerHTML = `在售 <b>${onList.length}</b> 件（约稿 <b>${comN}</b> · 成品 <b>${onList.length - comN}</b>），共归入 <b>${activeCats}</b> 个前台分类。近 30 日全店商品累计实收 <b>${lxYuan(revAll)}</b>。`
      $("pulse").innerHTML = `
        <div class="ps"><small>在售书目</small><b>${onList.length} / ${products.length}</b></div>
        <div class="ps"><small>启用分类</small><b>${activeCats} / ${categories.length}</b></div>
        <div class="ps"><small>30 日实收</small><b>${lxYuan(revAll)}</b></div>
        <div class="ps"><small>30 日滞销</small><b class="${coldN ? "warn" : ""}">${coldN} 件</b></div>
      `
    }

    function renderCategories() {
      const sorted = [...categories].sort((a, b) => a.sort - b.sort || a.id - b.id)
      const revAll = Math.max(1, products.reduce((a, p) => a + p.rev, 0))
      const uncatCount = products.filter((p) => !p.catId).length

      const allHtml = `
        <li class="cat-item ${catScope === "all" ? "on" : ""}" data-cat="all">
          <div class="cat-top">
            <span class="cat-name"><i class="dot-st"></i><span>全部商品</span></span>
            <span class="cat-count">${products.length}</span>
          </div>
          <div class="cat-bar"><i style="width:100%"></i></div>
          <div class="cat-foot"><span>全站汇总</span><span>${lxYuan(revAll)}</span></div>
        </li>`

      const rowsHtml = sorted.map((c, idx) => {
        const mine = products.filter((p) => p.catId === c.id)
        const onN = mine.filter((p) => p.on).length
        const rev = mine.reduce((a, p) => a + p.rev, 0)
        const pct = Math.round((rev / revAll) * 100)
        return `
          <li class="cat-item ${catScope === c.id ? "on" : ""} ${c.enabled ? "" : "off"}" data-cat="${c.id}">
            <div class="cat-top">
              <span class="cat-name"><i class="dot-st"></i><span>${c.name}</span></span>
              <span class="cat-count">${onN}/${mine.length}</span>
            </div>
            <div class="cat-bar"><i style="width:${pct}%"></i></div>
            <div class="cat-foot">
              <span>${c.enabled ? `占 ${pct}% · ${lxYuan(rev)}` : "已停用"}</span>
              <span class="cat-ops">
                <button type="button" data-cat-op="up" data-id="${c.id}" ${idx === 0 ? "disabled" : ""} title="上移"><i data-lucide="chevron-up" style="width:13px;height:13px"></i></button>
                <button type="button" data-cat-op="down" data-id="${c.id}" ${idx === sorted.length - 1 ? "disabled" : ""} title="下移"><i data-lucide="chevron-down" style="width:13px;height:13px"></i></button>
                <button type="button" data-cat-op="edit" data-id="${c.id}" title="编辑分类"><i data-lucide="pencil" style="width:12px;height:12px"></i></button>
              </span>
            </div>
          </li>`
      }).join("")

      const uncatHtml = uncatCount ? `
        <li class="cat-item ${catScope === "uncat" ? "on" : ""}" data-cat="uncat">
          <div class="cat-top">
            <span class="cat-name"><i class="dot-st" style="background:var(--gold)"></i><span>未分类</span></span>
            <span class="cat-count">${uncatCount}</span>
          </div>
          <div class="cat-foot"><span>暂未归类作品</span><span>待整理</span></div>
        </li>` : ""

      $("cat-list").innerHTML = allHtml + rowsHtml + uncatHtml

      const ed = $("cat-editor")
      if (!editingCat) {
        ed.hidden = true
      } else {
        ed.hidden = false
        $("ed-title").textContent = editingCat.mode === "new" ? "新建前台分类" : `编辑 · ${editingCat.origName}`
        $("ed-name").value = editingCat.name
        $("ed-sort").value = String(editingCat.sort)
        $("ed-on").classList.toggle("on", editingCat.enabled)
        $("ed-del").hidden = editingCat.mode === "new"
      }
    }

    function renderProducts() {
      const list = products.filter(matchProd)
      const revAll = Math.max(1, products.reduce((a, p) => a + p.rev, 0))
      if (!list.some((p) => p.id === activeProdId) && list[0]) activeProdId = list[0].id

      const scopeBar = $("scope-bar")
      if (catScope === "all") {
        scopeBar.hidden = true
      } else {
        const label = catScope === "uncat" ? "未分类" : catName(catScope)
        const rev = list.reduce((a, p) => a + p.rev, 0)
        scopeBar.hidden = false
        scopeBar.innerHTML = `<span>当前目录：<b>${label}</b>（${list.length} 件 · 30 日实收 ${lxYuan(rev)}）</span><button type="button" id="clear-scope">查看全站商品</button>`
      }

      $("empty").hidden = list.length > 0
      $("shelf-grid").hidden = viewMode !== "grid" || !list.length
      $("sheet-card").hidden = viewMode !== "table" || !list.length

      if (viewMode === "grid") {
        $("shelf-grid").innerHTML = list.map((p) => {
          const share = Math.round((p.rev / revAll) * 100)
          const cName = catName(p.catId)
          const badge = !p.on ? `<span class="tag mute">下架</span>`
            : p.mode === "commission" ? `<span class="tag gold">约稿</span>`
            : `<span class="tag">在售</span>`
          const catTag = (p.mode === "commission" && cName === "约稿") ? "" : `<span class="tag mute">${cName}</span>`
          return `
            <article class="book-card ${activeProdId === p.id ? "on" : ""} ${p.on ? "" : "off"}" data-id="${p.id}">
              <div class="book-top">
                <div class="book-cover" style="--h:${p.h}"></div>
                <div class="book-meta">
                  <div class="book-tags">${badge}${catTag}</div>
                  <h3 class="book-title">${p.name}</h3>
                  <div class="book-price">${priceText(p)}</div>
                </div>
              </div>
              <div class="book-stats">
                <div>30 日订单<b>${p.orders} 笔</b></div>
                <div>30 日实收<b>${lxYuan(p.rev)} · ${share}%</b></div>
              </div>
              <div class="book-actions">
                <span class="id-tag">#${p.id}</span>
                <div class="ops">
                  <button type="button" data-op="edit" data-id="${p.id}">编辑</button>
                  <button type="button" data-op="toggle" data-id="${p.id}">${p.on ? "下架" : "上架"}</button>
                  <button type="button" class="danger" data-op="del" data-id="${p.id}">删除</button>
                </div>
              </div>
            </article>`
        }).join("")
      } else {
        $("rows").innerHTML = list.map((p) => {
          const share = Math.round((p.rev / revAll) * 100)
          const status = !p.on ? `<span class="tag mute">下架</span>`
            : p.mode === "commission" ? `<span class="tag gold">约稿</span>`
            : `<span class="tag">在售</span>`
          return `
            <tr data-id="${p.id}" class="${activeProdId === p.id ? "on" : ""}">
              <td><div class="cover" style="--h:${p.h}"></div></td>
              <td><span class="name">${p.name}</span><span class="sub">#${p.id} · ${catName(p.catId)}</span></td>
              <td class="mono">${priceShort(p)}</td>
              <td class="mono">${p.orders}</td>
              <td class="mono">${lxYuan(p.rev)}</td>
              <td style="min-width:78px"><div class="share ${p.mode === "commission" ? "gold" : ""}"><i style="width:${share}%"></i></div></td>
              <td>${status}</td>
              <td class="ops">
                <button type="button" data-op="edit" data-id="${p.id}">编辑</button>
                <button type="button" data-op="toggle" data-id="${p.id}">${p.on ? "下架" : "上架"}</button>
                <button type="button" class="danger" data-op="del" data-id="${p.id}">删除</button>
              </td>
            </tr>`
        }).join("")
      }
    }

    function renderInspector() {
      const p = products.find((x) => x.id === activeProdId) || products[0]
      if (!p) {
        $("detail").innerHTML = `<p class="empty">暂无商品</p>`
        return
      }
      const revAll = Math.max(1, products.reduce((a, x) => a + x.rev, 0))
      const share = Math.round((p.rev / revAll) * 100)
      const bars = series(p.id, p.orders)
      const max = Math.max(...bars, 1)
      const sortedCats = [...categories].sort((a, b) => a.sort - b.sort || a.id - b.id)

      $("detail").innerHTML = `
        <div class="insp-hero">
          <div class="insp-cover" style="--h:${p.h}"></div>
          <div style="min-width:0;flex:1">
            <span class="tag ${!p.on ? "mute" : p.mode === "commission" ? "gold" : ""}">${!p.on ? "已下架" : p.mode === "commission" ? "约稿" : "成品"}</span>
            <h3>${p.name}</h3>
            <div class="meta">#${p.id} · ${priceText(p)}</div>
          </div>
        </div>

        <div class="insp-kpis">
          <div class="ik-box"><small>30 日订单</small><b>${p.orders} 笔</b></div>
          <div class="ik-box"><small>30 日实收</small><b>${lxYuan(p.rev)}</b></div>
          <div class="ik-box"><small>全店营收占比</small><b>${share}%</b></div>
          <div class="ik-box"><small>当前状态</small><b>${p.on ? "前台上架" : "已下架"}</b></div>
        </div>

        <div class="insp-block">
          <div class="lbl"><span>归属分类（实时调换）</span><span>${catName(p.catId)}</span></div>
          <select class="insp-cat-select" id="insp-cat">
            <option value="0" ${!p.catId ? "selected" : ""}>未分类</option>
            ${sortedCats.map((c) => `<option value="${c.id}" ${p.catId === c.id ? "selected" : ""}>${c.name}${c.enabled ? "" : "（停用）"}</option>`).join("")}
          </select>
        </div>

        <div class="insp-block">
          <div class="lbl"><span>近 14 日出单节奏</span><span>${p.orders ? "有动销" : "暂无成交"}</span></div>
          <div class="mini-bars">
            ${bars.map((v) => `<i style="height:${Math.max(4, Math.round((v / max) * 100))}%;background:${p.mode === "commission" ? "var(--gold)" : "var(--teal)"}"></i>`).join("")}
          </div>
        </div>

        <div class="insp-acts">
          <button type="button" class="teal-btn full" data-op="edit" data-id="${p.id}"><i data-lucide="pencil"></i>编辑作品详情</button>
          <button type="button" class="ghost-btn" data-op="toggle" data-id="${p.id}">${p.on ? "下架作品" : "恢复上架"}</button>
          <a class="ghost-btn" href="admin-revenue.html?q=${encodeURIComponent(p.name.replace(/[《》]/g, ""))}#orders">看相关订单</a>
        </div>
      `
    }

    function renderAll() {
      renderPulse()
      renderCategories()
      renderProducts()
      renderInspector()
      lxIcons()
    }

    function openProdPage(prod) {
      if (prod) {
        location.href = `admin-product-form.html?id=${prod.id}`
      } else {
        const qs = typeof catScope === "number" ? `?cat=${encodeURIComponent(catName(catScope))}` : ""
        location.href = `admin-product-form.html${qs}`
      }
    }

    /* 事件绑定 */
    $("cat-list").addEventListener("click", (e) => {
      const opBtn = e.target.closest("[data-cat-op]")
      if (opBtn) {
        e.stopPropagation()
        const op = opBtn.dataset.catOp
        const id = Number(opBtn.dataset.id)
        const sorted = [...categories].sort((a, b) => a.sort - b.sort || a.id - b.id)
        const idx = sorted.findIndex((c) => c.id === id)
        if (idx < 0) return
        if (op === "up" || op === "down") {
          const target = op === "up" ? idx - 1 : idx + 1
          if (target < 0 || target >= sorted.length) return
          const [moved] = sorted.splice(idx, 1)
          sorted.splice(target, 0, moved)
          sorted.forEach((c, i) => { c.sort = i + 1 })
          renderAll()
          lxToast("已调整分类前台顺序")
        } else if (op === "edit") {
          const c = sorted[idx]
          editingCat = { mode: "edit", id: c.id, origName: c.name, name: c.name, sort: c.sort, enabled: c.enabled }
          renderCategories()
          lxIcons()
        }
        return
      }
      const li = e.target.closest("[data-cat]")
      if (!li) return
      const v = li.dataset.cat
      catScope = v === "all" || v === "uncat" ? v : Number(v)
      renderAll()
    })

    function startNewCategory() {
      editingCat = { mode: "new", origName: "", name: "", sort: categories.length + 1, enabled: true }
      renderCategories()
      $("cat-rail").scrollIntoView({ behavior: "smooth", block: "nearest" })
      $("ed-name").focus()
      lxIcons()
    }

    $("btn-new-cat").addEventListener("click", startNewCategory)
    $("rail-add-cat").addEventListener("click", startNewCategory)
    $("ed-close").addEventListener("click", () => { editingCat = null; renderCategories() })
    $("ed-on").addEventListener("click", () => {
      if (!editingCat) return
      editingCat.enabled = !editingCat.enabled
      $("ed-on").classList.toggle("on", editingCat.enabled)
    })
    $("ed-save").addEventListener("click", () => {
      if (!editingCat) return
      const name = $("ed-name").value.trim()
      const sort = Number($("ed-sort").value)
      if (!name) { lxToast("请填写分类名称"); return }
      if (Number.isNaN(sort)) { lxToast("排序须为数字"); return }
      if (editingCat.mode === "new") {
        const nextId = Math.max(0, ...categories.map((c) => c.id)) + 1
        categories.push({ id: nextId, name, sort, enabled: editingCat.enabled })
        catScope = nextId
        lxToast("已新建分类「" + name + "」")
      } else {
        const c = categories.find((x) => x.id === editingCat.id)
        if (c) {
          c.name = name
          c.sort = sort
          c.enabled = editingCat.enabled
          lxToast("分类已保存")
        }
      }
      editingCat = null
      renderAll()
    })
    $("ed-del").addEventListener("click", () => {
      if (!editingCat || editingCat.mode !== "edit") return
      const c = categories.find((x) => x.id === editingCat.id)
      if (!c) return
      if (!confirm(`确定删除分类「${c.name}」？里面的商品将归入「未分类」。`)) return
      products.forEach((p) => { if (p.catId === c.id) p.catId = 0 })
      categories = categories.filter((x) => x.id !== c.id)
      if (catScope === c.id) catScope = "all"
      editingCat = null
      lxToast("已删除分类")
      renderAll()
    })

    $("q").addEventListener("input", (e) => { query = e.target.value.trim(); renderProducts(); renderInspector(); lxIcons() })
    $("chips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-f]")
      if (!btn) return
      filter = btn.dataset.f
      document.querySelectorAll("#chips button").forEach((b) => b.classList.toggle("on", b === btn))
      renderProducts()
      renderInspector()
      lxIcons()
    })
    document.querySelector(".view-toggle").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-view]")
      if (!btn) return
      viewMode = btn.dataset.view
      document.querySelectorAll(".view-toggle button").forEach((b) => b.classList.toggle("on", b === btn))
      renderProducts()
      lxIcons()
    })

    document.addEventListener("click", (e) => {
      if (e.target.id === "clear-scope") {
        catScope = "all"
        renderAll()
        return
      }
      const opBtn = e.target.closest("[data-op]")
      if (opBtn) {
        e.stopPropagation()
        const id = Number(opBtn.dataset.id)
        const p = products.find((x) => x.id === id)
        if (!p) return
        const op = opBtn.dataset.op
        if (op === "toggle") {
          p.on = !p.on
          lxToast(p.on ? "已上架「" + p.name + "」" : "已下架「" + p.name + "」")
          renderAll()
        } else if (op === "del") {
          if (!confirm(`确定删除商品「${p.name}」？`)) return
          products = products.filter((x) => x.id !== id)
          if (activeProdId === id) activeProdId = products[0]?.id || 0
          lxToast("商品已删除")
          renderAll()
        } else if (op === "edit") {
          openProdPage(p)
        }
        return
      }
      const card = e.target.closest("[data-id]")
      if (card && (card.classList.contains("book-card") || card.tagName === "TR")) {
        activeProdId = Number(card.dataset.id)
        renderProducts()
        renderInspector()
        lxIcons()
      }
    })

    document.addEventListener("change", (e) => {
      if (e.target.id === "insp-cat") {
        const p = products.find((x) => x.id === activeProdId)
        if (!p) return
        p.catId = Number(e.target.value)
        lxToast(`已调至「${catName(p.catId)}」`)
        renderAll()
      }
    })

    $("btn-new-prod").addEventListener("click", () => openProdPage(null))

    $("export").addEventListener("click", () => lxToast(`已导出 ${products.filter(matchProd).length} 件商品销量`))

    const params = new URLSearchParams(location.search)
    if (params.get("focus") === "categories" || location.hash === "#categories") {
      $("cat-rail").classList.add("focus-ring")
    }

    renderAll()
  </script>
</body>
</html>
