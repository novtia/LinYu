<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 小说阅读器（PC）设计稿 · 参考起点</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ed424b'/></svg>" />
  <style>
    :root { --red: #ed424b; --red-soft: rgba(237, 66, 75, .1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    .hidden { display: none !important; }

    /* ============ 主题：与起点 PC 阅读页一致的 5 套底色 ============ */
    body {
      --page: #e6dfcb; --paper: #f5f1e6; --fg: #262626; --sub: #8c8c8c; --line: #e2dcc8;
      --card: #fff; --cardfg: #666; --cardline: #eee; --btn: #fff; --btnline: #ddd; --hover: #f6f6f6;
      --ff: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      --w: 800px; --fs: 18px; --lh: 1.75;
      margin: 0; min-height: 100vh; background: var(--page); color: var(--fg);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; -webkit-font-smoothing: antialiased;
      transition: background .25s, color .25s;
    }
    body[data-theme="white"] { --page: #f0f0f0; --paper: #fff; --line: #ececec; }
    body[data-theme="green"] { --page: #c8dbc3; --paper: #dfecd8; --line: #cbdcc3; }
    body[data-theme="pink"]  { --page: #ecd4d0; --paper: #f8e7e3; --line: #ecd2cd; }
    body[data-theme="night"] {
      --page: #151515; --paper: #232323; --fg: #8f8f8f; --sub: #5f5f5f; --line: #333;
      --card: #2c2c2c; --cardfg: #9a9a9a; --cardline: #3a3a3a; --btn: #2c2c2c; --btnline: #444; --hover: #333;
    }

    /* ============ 阅读主列（居中纸张） ============ */
    .wrap {
      position: relative; width: var(--w); max-width: 100%; min-height: 100vh; margin: 0 auto;
      padding: 22px 64px 90px; background: var(--paper);
      box-shadow: 0 0 0 1px rgba(0,0,0,.025), 0 0 26px rgba(0,0,0,.06);
      transition: width .25s, background .25s;
    }
    .crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--sub); padding-right: 60px; }
    .crumb svg { flex-shrink: 0; }
    .crumb a:hover { color: var(--red); }
    .crumb .sep { opacity: .6; }

    .ribbon { position: absolute; top: 0; right: 46px; width: 24px; height: 40px; }
    .ribbon svg { display: block; width: 100%; height: 100%; fill: #cfc9b6; transition: fill .2s; }
    body[data-theme="night"] .ribbon svg { fill: #3d3d3d; }
    .ribbon:hover svg { fill: #e58b90; }
    .ribbon.on svg, .ribbon.on:hover svg { fill: var(--red); }

    h1.title { margin: 28px 0 14px; font-size: 22px; line-height: 1.4; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title .tag { font-size: 12px; font-weight: 400; line-height: 16px; padding: 0 5px; border: 1px solid var(--red); border-radius: 3px; color: var(--red); background: var(--red-soft); cursor: pointer; }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--sub); }
    .meta span { display: inline-flex; align-items: center; gap: 4px; }
    .meta a:hover { color: var(--red); }

    .prose { margin-top: 30px; font-family: var(--ff); font-size: var(--fs); line-height: var(--lh); color: var(--fg); letter-spacing: .01em; }
    .prose p { margin: 0 0 .95em; text-indent: 2em; text-align: justify; word-break: break-all; }
    .prose ::selection { background: rgba(237, 66, 75, .22); }
    .end { margin-top: 56px; }
    .end .done { display: flex; align-items: center; gap: 14px; color: var(--sub); font-size: 13px; justify-content: center; margin-bottom: 22px; }
    .end .done::before, .end .done::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .nav3 { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .nav3 a { display: block; text-align: center; height: 48px; line-height: 48px; font-size: 15px; color: var(--cardfg); transition: .15s; }
    .nav3 a + a { border-left: 1px solid var(--line); }
    .nav3 a:hover { color: var(--red); background: var(--red-soft); }
    .nav3 a.dis { opacity: .35; pointer-events: none; }
    .tip { margin-top: 18px; text-align: center; font-size: 12px; color: var(--sub); line-height: 1.8; }
    .tip kbd { display: inline-block; min-width: 20px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; font: inherit; font-size: 11px; background: var(--paper); }

    /* ============ 右侧悬浮工具条（起点同款：白底圆角、图标 + 小字） ============ */
    .tb {
      position: fixed; z-index: 30; bottom: 13vh;
      left: min(calc(50% + var(--w) / 2 + 18px), calc(100vw - 74px));
      width: 56px; background: var(--card); border-radius: 6px; box-shadow: 0 2px 14px rgba(0,0,0,.12);
      transition: left .25s;
    }
    .tb > button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 100%; height: 58px; color: var(--cardfg); transition: color .15s; }
    .tb > button + button::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px; background: var(--cardline); }
    .tb > button span { font-size: 11px; line-height: 1; }
    .tb > button:hover, .tb > button.on { color: var(--red); }
    .tb > button .dot { position: absolute; top: 9px; right: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
    .tb > button:first-child { border-radius: 6px 6px 0 0; }
    .tb > button:nth-child(6) { border-radius: 0 0 6px 6px; }

    .pop {
      position: absolute; right: calc(100% + 14px); display: none; background: var(--card); color: var(--cardfg);
      border-radius: 6px; box-shadow: 0 4px 22px rgba(0,0,0,.18);
    }
    .pop.open { display: block; }
    .pop::after { content: ""; position: absolute; right: -6px; bottom: 22px; width: 12px; height: 12px; background: var(--card); transform: rotate(45deg); border-radius: 2px; }
    .pop-set { bottom: 58px; width: 560px; padding: 8px 28px; }
    .pop-qr { bottom: 0; width: 210px; padding: 18px 18px 16px; text-align: center; }
    .pop-qr::after { bottom: 20px; }

    .row { display: flex; align-items: center; gap: 16px; padding: 15px 0; }
    .row + .row { border-top: 1px solid var(--cardline); }
    .row > label { flex-shrink: 0; width: 64px; font-size: 14px; color: var(--sub); }
    .row .opts { display: flex; flex-wrap: wrap; gap: 10px; flex: 1; }
    .opt { min-width: 74px; height: 34px; padding: 0 12px; font-size: 14px; background: var(--btn); border: 1px solid var(--btnline); border-radius: 4px; color: var(--cardfg); transition: .15s; }
    .opt:hover { border-color: var(--red); color: var(--red); }
    .opt.on { border-color: var(--red); color: var(--red); background: var(--red-soft); }
    .swatches { display: flex; gap: 14px; flex: 1; }
    .sw { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); display: grid; place-items: center; color: transparent; transition: .15s; }
    .sw:hover { transform: scale(1.08); }
    .sw.on { color: var(--red); border: 2px solid var(--red); }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--btnline); border-radius: 4px; overflow: hidden; background: var(--btn); }
    .stepper button { width: 44px; height: 34px; font-size: 20px; line-height: 1; color: var(--cardfg); }
    .stepper button:hover { color: var(--red); background: var(--hover); }
    .stepper b { width: 56px; text-align: center; font-weight: 400; font-size: 14px; border-left: 1px solid var(--btnline); border-right: 1px solid var(--btnline); line-height: 34px; color: var(--fg); background: var(--card); }

    .qr { width: 140px; height: 140px; margin: 0 auto 12px; padding: 6px; background: #fff; border: 1px solid #eee; border-radius: 4px; }
    .qr svg { display: block; width: 100%; height: 100%; }
    .pop-qr b { display: block; font-size: 13px; color: var(--fg); }
    .pop-qr small { display: block; margin-top: 6px; font-size: 12px; line-height: 1.7; color: var(--sub); }

    /* ============ 目录弹窗（起点 PC：居中白色大弹窗，两列章节） ============ */
    .mask { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
    .mask.open { display: flex; }
    .modal { width: min(920px, 94vw); height: min(660px, 86vh); display: flex; flex-direction: column; background: var(--card); color: var(--fg); border-radius: 6px; box-shadow: 0 10px 50px rgba(0,0,0,.3); overflow: hidden; }
    .md-head { display: flex; align-items: center; gap: 16px; padding: 22px 30px 0; }
    .md-head .cover { width: 46px; height: 62px; border-radius: 3px; flex-shrink: 0; display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; background: linear-gradient(150deg, #3d3b52, #7c4f4a); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .md-head h3 { margin: 0; font-size: 20px; line-height: 1.3; }
    .md-head p { margin: 6px 0 0; font-size: 12px; color: var(--sub); }
    .md-head .grow { flex: 1; }
    .x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--sub); }
    .x:hover { color: var(--red); background: var(--hover); }
    .md-tabs { display: flex; align-items: center; gap: 30px; padding: 0 30px; margin-top: 14px; border-bottom: 1px solid var(--cardline); }
    .md-tabs button { position: relative; height: 44px; font-size: 15px; color: var(--sub); }
    .md-tabs button.on { color: var(--red); font-weight: 600; }
    .md-tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--red); }
    .md-tabs .sort { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: auto; font-size: 13px; color: var(--sub); }
    .md-tabs .sort:hover { color: var(--red); }
    .md-body { flex: 1; overflow-y: auto; padding: 8px 30px 24px; }
    .md-body .vol { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-size: 15px; font-weight: 700; }
    .md-body .vol::before { content: ""; width: 3px; height: 14px; background: var(--red); border-radius: 2px; }
    .md-body .vol small { font-weight: 400; font-size: 12px; color: var(--sub); }
    .chs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; margin: 0; padding: 0; list-style: none; }
    .chs a { display: flex; align-items: center; gap: 8px; height: 46px; border-bottom: 1px dashed var(--cardline); font-size: 14px; color: var(--cardfg); }
    .chs a .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chs a .w { font-size: 12px; color: var(--sub); opacity: .8; }
    .chs a:hover .t { color: var(--red); }
    .chs a.read .t { color: var(--sub); }
    .chs a.cur .t { color: var(--red); font-weight: 600; }
    .chs a.cur::after { content: "正在阅读"; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid var(--red); color: var(--red); border-radius: 3px; }
    .bms { margin: 0; padding: 0; list-style: none; }
    .bms li { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px dashed var(--cardline); }
    .bms .i { flex: 1; min-width: 0; cursor: pointer; }
    .bms b { display: block; font-size: 14px; color: var(--fg); }
    .bms b:hover { color: var(--red); }
    .bms p { margin: 6px 0 0; font-size: 13px; line-height: 1.7; color: var(--sub); }
    .bms small { font-size: 12px; color: var(--sub); white-space: nowrap; }
    .bms .del { font-size: 12px; color: var(--sub); }
    .bms .del:hover { color: var(--red); }
    .empty { padding: 90px 0; text-align: center; color: var(--sub); font-size: 14px; }

    .toast { position: fixed; z-index: 90; left: 50%; top: 22%; transform: translate(-50%, -8px); padding: 10px 20px; border-radius: 4px; background: rgba(0,0,0,.78); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 设计稿标识（非产品 UI） */
    .demo-tag { position: fixed; z-index: 40; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 4px; padding: 4px; background: rgba(38,38,38,.92); border-radius: 99px; font-size: 12px; color: #ddd; }
    .demo-tag span { padding: 0 10px 0 12px; opacity: .75; }
    .demo-tag a { padding: 5px 12px; border-radius: 99px; }
    .demo-tag a:hover { background: rgba(255,255,255,.12); color: #fff; }
    .demo-tag a.cur { background: var(--red); color: #fff; }

    @media (max-width: 1100px) {
      .tb { left: auto; right: 10px; }
      .wrap { padding-left: 36px; padding-right: 36px; }
      .pop-set { width: min(560px, calc(100vw - 100px)); }
      .chs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-theme="cream">

  <main class="wrap" id="wrap">
    <nav class="crumb" id="crumb"></nav>
    <button class="ribbon" id="ribbon" type="button" title="添加书签"><svg viewBox="0 0 24 40"><path d="M0 0h24v40l-12-9.5L0 40z"/></svg></button>

    <h1 class="title"><span id="ch-title"></span><span class="tag" id="ch-tag" title="本章笔记">笔记 2</span></h1>
    <div class="meta" id="meta"></div>

    <article class="prose" id="prose"></article>

    <section class="end" id="end">
      <div class="done" id="done">本章完</div>
      <div class="nav3">
        <a data-a="prev">上一章</a><a data-a="toc">目录</a><a data-a="next">下一章</a>
      </div>
      <p class="tip">可用键盘 <kbd>←</kbd> <kbd>→</kbd> 切换章节 · 阅读进度已同步到云端，换设备自动续读</p>
    </section>
  </main>

  <!-- 右侧悬浮工具条 -->
  <nav class="tb" id="tb">
    <button data-a="toc" type="button"><i data-ic="list"></i><span>目录</span></button>
    <button data-a="bmlist" type="button"><i data-ic="bookmark"></i><span>书签</span><b class="dot" id="bm-dot"></b></button>
    <button data-a="dl" type="button"><i data-ic="download"></i><span>下载</span></button>
    <button data-a="night" type="button" id="btn-night"><i data-ic="moon"></i><span>夜间</span></button>
    <button data-a="set" type="button" id="btn-set"><i data-ic="sliders"></i><span>设置</span></button>
    <button data-a="qr" type="button" id="btn-qr"><i data-ic="phone"></i><span>手机阅读</span></button>

    <div class="pop pop-set" id="pop-set">
      <div class="row"><label>阅读主题</label><div class="swatches" id="sws"></div></div>
      <div class="row"><label>正文字体</label><div class="opts" data-k="font">
        <button class="opt" type="button" data-v="yahei">雅黑</button><button class="opt" type="button" data-v="song">宋体</button>
        <button class="opt" type="button" data-v="kai">楷体</button><button class="opt" type="button" data-v="hei">黑体</button></div></div>
      <div class="row"><label>字体大小</label><div class="stepper"><button type="button" data-a="fs-">−</button><b id="fs-v">18</b><button type="button" data-a="fs+">+</button></div></div>
      <div class="row"><label>页面宽度</label><div class="opts" data-k="w">
        <button class="opt" type="button" data-v="640">640</button><button class="opt" type="button" data-v="800">800</button>
        <button class="opt" type="button" data-v="900">900</button><button class="opt" type="button" data-v="1000">1000</button>
        <button class="opt" type="button" data-v="1280">1280</button></div></div>
      <div class="row"><label>行间距</label><div class="opts" data-k="lh">
        <button class="opt" type="button" data-v="1.5">紧凑</button><button class="opt" type="button" data-v="1.75">标准</button><button class="opt" type="button" data-v="2.1">宽松</button></div></div>    </div>

    <div class="pop pop-qr" id="pop-qr">
      <div class="qr" id="qr"></div>
      <b>手机扫码继续阅读</b>
      <small>登录同一账号，进度自动同步<br />需先在手机浏览器打开领匣</small>
    </div>
  </nav>

  <!-- 目录弹窗 -->
  <div class="mask" id="mask">
    <div class="modal" role="dialog" aria-label="目录">
      <div class="md-head">
        <span class="cover">深</span>
        <div><h3>深夜维修工</h3><p id="md-sub"></p></div>
        <span class="grow"></span>
        <button class="x" data-a="close" type="button"><i data-ic="x" data-s="20"></i></button>
      </div>
      <div class="md-tabs">
        <button data-tab="toc" class="on" type="button">目录</button>
        <button data-tab="bm" type="button">书签</button>
        <button class="sort" data-a="sort" type="button"><i data-ic="sort" data-s="15"></i><span id="sort-l">倒序</span></button>
      </div>
      <div class="md-body" id="md-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="demo-tag"><span>设计稿 · 参考起点</span><a class="cur">PC 版</a><a href="reader-mobile.html">手机版</a></div>

  <script>
    /* ================= 示例内容（原创，仅供设计演示） ================= */
    const BOOK = { name: "深夜维修工", author: "佚名", fmt: "TXT" }
    const TOC = [
      "序章 最后一班扶梯", "第一章 凌晨三点的扶梯", "第二章 值班表上没有的名字", "第三章 十六号柜",
      "第四章 冷库的回声", "第五章 不肯下班的人", "第六章 夜班交接", "第七章 停电十七分钟",
      "第八章 监控里的第二个影子", "第九章 保安室的茶", "第十章 地下三层", "第十一章 旧图纸",
      "第十二章 一枚生锈的铭牌", "第十三章 他们为什么留下", "第十四章 凌晨四点的广播", "第十五章 失物招领处",
      "第十六章 最后一次巡检", "第十七章 天亮之前", "第十八章 开门营业",
      "番外一 便利店灯亮着", "番外二 值班日志", "番外三 沈既白的雨伞",
    ]
    const BODY = [
      [
        "夜里十一点四十，商场的最后一批顾客被保安客气地请了出去。卷帘门一扇接一扇落下，像有人在城市边缘缓缓合上了眼睛。",
        "沈既白把工具箱放在三楼扶梯口，蹲下身，用手电照进裙板的缝隙。履带上的齿牙磨得发亮，只有靠近楼梯口的第七级，沾着一小片说不清颜色的潮痕。",
        "他在这家商场做了六年维修工，早就习惯了深夜里那种被放大的安静——空调的低鸣、远处冷库压缩机的震颤，还有自己鞋底和地砖摩擦的声音。",
        "可今晚多了一样东西。扶梯没有通电，却在他背后，轻轻地、一级一级地，往上走了一格。",
      ],
      [
        "手电的光圈在裙板上晃了晃，沈既白屏住呼吸，慢慢直起腰。",
        "扶梯静止着，像一条被冻住的银色河。他伸手按了按急停按钮，红色的键帽完好地弹在原位——断电、锁闭、挂牌，三道工序都是他亲手做的，不会错。",
        "“大概是履带回弹。”他对自己说。声音在空荡的中庭里转了一圈，没有人回答。",
        "他重新蹲下，把螺丝刀探进第七级台阶的缝隙。金属碰着金属，声音很轻，却在夜里被放得很大。就在这时，对讲机沙沙响了两声，里面传来保安老周含混的嗓音：“小沈，你还在三楼？”",
        "“在，快收工了。”",
        "“哦。”老周顿了顿，“监控里……你旁边是不是还站着一位？”",
        "沈既白没有回头。他盯着手电照亮的那一小块地面，那里只有他自己的影子，一个，安安静静地趴在地上。",
        "凌晨三点整，整座商场的灯同时暗了一格。",
      ],
      [
        "第二天傍晚，沈既白在更衣室里翻开值班表。",
        "纸页被翻得起了毛边，最上面一行印着“夜班维修·沈既白”。往下数，保洁、保安、冷库巡检……三十一个名字，他都认得。",
        "只有最底下那一行，用铅笔轻轻写着一个他不认得的名字：陈守。",
        "没有工号，没有班次，字迹却很新，像是谁昨天夜里刚刚补上去的。",
        "“你问陈师傅啊？”隔壁柜的老赵嚼着包子，含糊地说，“早年管扶梯的，退休好些年了。怎么，他又回来排班了？”",
        "老赵笑得像开了个玩笑。沈既白也跟着笑了笑，笑意没能爬上眼角。",
        "他把值班表翻到背面，铅笔的压痕透过纸张，隐约现出另一行小字——“十六号柜，别开”。",
      ],
      [
        "更衣室一共二十四个铁皮柜，编号从一排到二十四。十六号在最里侧，门上落着一层薄灰，锁孔却很干净。",
        "沈既白在柜子前站了很久。",
        "走廊尽头的灯管闪了两下，嗡的一声，又稳住了。他把手掌贴在冰凉的柜门上，听见里面有极轻的节拍——不是心跳，更像是扶梯履带一格一格往上爬的声音。",
        "他想起老周在对讲机里没问完的那句话。",
        "“你旁边是不是还站着一位？”",
        "钥匙在他口袋里。那是入职第一天行政交给他的一串旧钥匙，其中有一把，齿纹和别的都不一样。",
        "他把它拿了出来。",
      ],
    ]
    const bodyOf = (i) => BODY[i % BODY.length]            // 设计稿：超出 4 章的用示例正文循环填充
    const words = (i) => 2100 + ((i * 733) % 1700)         // 设计稿：示例字数
    /* ================= 图标 ================= */
    const ICON = {
      list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      sliders: '<line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/><line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/><line x1="21" y1="20" x2="16" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/><line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>',
      phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      sort: '<path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>',
      user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      file: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
      home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    }
    const ic = (n, s = 22, w = 1.6) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`
    const hydrate = (root = document) => root.querySelectorAll("[data-ic]").forEach((el) => { el.outerHTML = ic(el.dataset.ic, +(el.dataset.s || 22)) })

    /* ================= 设置（localStorage 持久化） ================= */
    const FONTS = {
      yahei: '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif',
      song: 'SimSun, "Songti SC", "Noto Serif SC", serif',
      kai: 'KaiTi, STKaiti, "Noto Serif SC", serif',
      hei: 'SimHei, "Heiti SC", "Noto Sans SC", sans-serif',
    }
    const THEMES = [["cream", "#f5f1e6", "米黄"], ["white", "#ffffff", "白"], ["green", "#dfecd8", "护眼绿"], ["pink", "#f8e7e3", "淡粉"], ["night", "#232323", "夜间"]]
    let S = { theme: "cream", prev: "cream", font: "yahei", fs: 18, w: 800, lh: 1.75 }
    try { Object.assign(S, JSON.parse(localStorage.getItem("lx-reader-pc") || "{}")) } catch (e) {}
    const save = () => { try { localStorage.setItem("lx-reader-pc", JSON.stringify(S)) } catch (e) {} }
    const bookmarks = new Map([[1, { text: "他在这家商场做了六年维修工，早就习惯了深夜里那种被放大的安静……", at: "今天 22:41" }]])
    const READ = new Set([0])
    const st = { cur: 1, tab: "toc", desc: false }

    const $ = (s, r = document) => r.querySelector(s)
    const $$ = (s, r = document) => [...r.querySelectorAll(s)]
    const body = document.body

    function applySettings() {
      body.dataset.theme = S.theme
      body.style.setProperty("--fs", S.fs + "px")
      body.style.setProperty("--lh", S.lh)
      body.style.setProperty("--w", S.w + "px")
      body.style.setProperty("--ff", FONTS[S.font])
      $("#fs-v").textContent = S.fs
      $$(".swatches .sw").forEach((b) => b.classList.toggle("on", b.dataset.th === S.theme))
      $$("#pop-set .opts").forEach((g) => $$(".opt", g).forEach((b) => b.classList.toggle("on", b.dataset.v === String(S[g.dataset.k]))))
      const night = S.theme === "night"
      $("#btn-night").innerHTML = `${ic(night ? "sun" : "moon")}<span>${night ? "日间" : "夜间"}</span>`
      save()
    }

    /* ================= 章节渲染 ================= */
    function render(i, keepScroll) {
      st.cur = Math.max(0, Math.min(TOC.length - 1, i)); READ.add(st.cur)
      const t = TOC[st.cur]
      $("#crumb").innerHTML = `${ic("home", 13, 1.8)}<a>领匣</a><span class="sep">›</span><a>我的订单</a><span class="sep">›</span><a>《${BOOK.name}》</a><span class="sep">›</span><span>${t}</span>`
      $("#ch-title").textContent = t
      $("#ch-tag").textContent = `笔记 ${bodyOf(st.cur).length > 4 ? 2 : 1}`
      $("#meta").innerHTML = `<span>${ic("user", 13, 1.8)}<a>${BOOK.author}</a></span><span>${ic("book", 13, 1.8)}<a>${BOOK.fmt} 文件</a></span><span>${ic("file", 13, 1.8)}本章字数：${words(st.cur)}字</span><span>${ic("clock", 13, 1.8)}上传时间：2026-10-27 22:41</span>`
      $("#prose").innerHTML = bodyOf(st.cur).map((x, p) => `<p>${x}</p>`).join("")
      $("#done").textContent = st.cur === TOC.length - 1 ? "全书完" : "本章完"
      $$("#end [data-a=prev]").forEach((a) => a.classList.toggle("dis", st.cur === 0))
      $$("#end [data-a=next]").forEach((a) => a.classList.toggle("dis", st.cur === TOC.length - 1))
      $("#ribbon").classList.toggle("on", bookmarks.has(st.cur))
      $("#bm-dot").classList.toggle("hidden", !bookmarks.size)
      document.title = `${t} - ${BOOK.name} - 领匣阅读`
      if (!keepScroll) window.scrollTo({ top: 0 })
      renderModal()
    }

    /* ================= 目录 / 书签弹窗 ================= */
    function renderModal() {
      const pct = Math.round(((st.cur + 1) / TOC.length) * 100)
      $("#md-sub").textContent = `${BOOK.author} · ${BOOK.fmt} · 共 ${TOC.length} 章 · 已读 ${pct}%`
      $$(".md-tabs [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === st.tab))
      $(".md-tabs .sort").classList.toggle("hidden", st.tab !== "toc")
      $("#sort-l").textContent = st.desc ? "正序" : "倒序"
      const box = $("#md-body")
      if (st.tab === "toc") {
        const idx = TOC.map((_, i) => i); if (st.desc) idx.reverse()
        const mk = (i) => `<li><a data-ch="${i}" class="${i === st.cur ? "cur" : READ.has(i) ? "read" : ""}"><span class="t">${TOC[i]}</span><span class="w">${words(i)}字</span></a></li>`
        const main = idx.filter((i) => i < 19), extra = idx.filter((i) => i >= 19)
        const parts = [[`正文`, main], [`番外`, extra]].map(([n, l]) => `<div class="vol">${n}<small>共 ${l.length} 章</small></div><ul class="chs">${l.map(mk).join("")}</ul>`)
        box.innerHTML = (st.desc ? parts.reverse() : parts).join("")
        const c = $(".chs a.cur", box); if (c && $("#mask").classList.contains("open")) c.scrollIntoView({ block: "center" })
      } else {
        box.innerHTML = bookmarks.size
          ? `<ul class="bms">${[...bookmarks].map(([ch, b]) => `<li><div class="i" data-ch="${ch}"><b>${TOC[ch]}</b><p>${b.text}</p></div><small>${b.at}</small><button class="del" data-del="${ch}" type="button">删除</button></li>`).join("")}</ul>`
          : `<div class="empty">还没有书签<br /><small>点击正文右上角的书签丝带即可添加</small></div>`
      }
    }

    /* ================= 交互 ================= */
    const pops = { set: $("#pop-set"), qr: $("#pop-qr") }
    function closePops(except) {
      for (const k in pops) if (k !== except) pops[k].classList.remove("open")
      $("#btn-set").classList.toggle("on", pops.set.classList.contains("open"))
      $("#btn-qr").classList.toggle("on", pops.qr.classList.contains("open"))
    }
    function togglePop(k) { pops[k].classList.toggle("open"); closePops(k) }
    function openModal(tab) { st.tab = tab; closePops(); $("#mask").classList.add("open"); renderModal() }
    function closeModal() { $("#mask").classList.remove("open") }
    let tt = 0
    function toast(m) { const el = $("#toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1700) }
    function toggleBm() {
      if (bookmarks.has(st.cur)) { bookmarks.delete(st.cur); toast("已取消书签") }
      else { const ps = bodyOf(st.cur); bookmarks.set(st.cur, { text: ps[Math.min(1, ps.length - 1)].slice(0, 42) + "……", at: "刚刚" }); toast("已添加书签") }
      render(st.cur, true)
    }

    document.addEventListener("click", (e) => {
      const del = e.target.closest("[data-del]"); if (del) { bookmarks.delete(+del.dataset.del); render(st.cur, true); return }
      const ch = e.target.closest("[data-ch]"); if (ch) { render(+ch.dataset.ch); closeModal(); return }
      const tab = e.target.closest("[data-tab]"); if (tab) { st.tab = tab.dataset.tab; renderModal(); return }
      if (e.target === $("#mask")) return closeModal()
      const a = e.target.closest("[data-a]")?.dataset.a
      if (!a) { if (!e.target.closest(".tb")) closePops(); return }
      switch (a) {
        case "toc": openModal("toc"); break
        case "bmlist": openModal("bm"); break
        case "close": closeModal(); break
        case "sort": st.desc = !st.desc; renderModal(); break
        case "prev": render(st.cur - 1); break
        case "next": render(st.cur + 1); break
        case "dl": toast("Demo：下载原文件《深夜维修工.txt》"); break
        case "set": togglePop("set"); break
        case "qr": togglePop("qr"); break
        case "night": if (S.theme === "night") S.theme = S.prev || "cream"; else { S.prev = S.theme; S.theme = "night" } applySettings(); break
        case "fs-": S.fs = Math.max(12, S.fs - 1); applySettings(); break
        case "fs+": S.fs = Math.min(32, S.fs + 1); applySettings(); break
      }
    })
    $("#ribbon").addEventListener("click", toggleBm)
    $("#ch-tag").addEventListener("click", () => toast("Demo：打开本章笔记"))
    $("#pop-set").addEventListener("click", (e) => {
      const sw = e.target.closest("[data-th]"); if (sw) { S.theme = sw.dataset.th; applySettings(); return }
      const o = e.target.closest(".opt"); if (!o) return
      const k = o.parentElement.dataset.k, v = o.dataset.v
      S[k] = k === "w" ? +v : k === "lh" ? +v : v
      applySettings()
    })
    $("#sws").innerHTML = THEMES.map(([k, c, n]) => `<button class="sw" type="button" data-th="${k}" title="${n}" style="background:${c}">${ic("check", 18, 2.4)}</button>`).join("")

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeModal(); closePops() }
      if ($("#mask").classList.contains("open")) return
      if (e.key === "ArrowLeft") render(st.cur - 1)
      if (e.key === "ArrowRight") render(st.cur + 1)
    })

    /* 手机阅读二维码（装饰用伪二维码） */
    ;(function qr() {
      const n = 25; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280
      const finder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)
      let r = ""
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        let on
        if (finder(x, y)) {
          const ox = x < 8 ? x : x - (n - 7), oy = y < 8 ? y : y - (n - 7)
          on = ox >= 0 && ox < 7 && oy >= 0 && oy < 7 ? (ox === 0 || ox === 6 || oy === 0 || oy === 6 || (ox >= 2 && ox <= 4 && oy >= 2 && oy <= 4)) : false
        } else on = rnd() > 0.52
        if (on) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`
      }
      $("#qr").innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#222">${r}</svg>`
    })()

    /* 初始化：支持 #toc / #bm / #set / #qr / #night / #c3 预览各状态 */
    hydrate(); applySettings()
    const h = location.hash.slice(1).split(",")
    const cm = h.find((x) => /^c\d+$/.test(x)); render(cm ? +cm.slice(1) : 1)
    if (h.includes("night")) { S.prev = S.theme; S.theme = "night"; applySettings() }
    if (h.includes("set")) togglePop("set")
    if (h.includes("qr")) togglePop("qr")
    if (h.includes("toc")) openModal("toc")
    if (h.includes("bm")) openModal("bm")
  </script>
</body>
</html>
