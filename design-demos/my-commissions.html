<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 我的约稿 Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #14201c;
      --ink-soft: #3d4f48;
      --ink-mute: #6b7c74;
      --paper: #e8f1ee;
      --fog: #f4f8f6;
      --line: rgba(20, 32, 28, 0.09);
      --line-strong: rgba(20, 32, 28, 0.16);
      --teal: #0f6e5c;
      --teal-deep: #0a5245;
      --mint: #7fd4b8;
      --warn: #8a6a2f;
      --warn-dot: #c4a574;
      --danger: #b42318;
      --font-display: "Syne", "Noto Sans SC", sans-serif;
      --font-body: "Sora", "Noto Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", "Noto Sans SC", monospace;
      --ease: cubic-bezier(.22, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background-color: #eef5f2;
      background-image:
        radial-gradient(1200px 700px at 85% -10%, rgba(127, 212, 184, 0.35), transparent 55%),
        radial-gradient(900px 600px at -5% 20%, rgba(196, 165, 116, 0.18), transparent 50%),
        linear-gradient(180deg, #f7fbf9 0%, var(--fog) 42%, #eef5f2 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    .demo-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 80;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 48px; padding: 0 20px; background: #14201c; color: #eef8f4;
    }
    .demo-bar strong { font-family: var(--font-display); font-size: .95rem; letter-spacing: -.02em; }
    .demo-bar span { color: rgba(238,248,244,.55); font-size: .78rem; }
    .demo-bar .jump {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border: 1px solid rgba(238,248,244,.25); border-radius: 8px;
      background: transparent; color: rgba(238,248,244,.8); font-size: .78rem; font-weight: 600;
    }
    .demo-bar .jump:hover { border-color: var(--mint); color: #fff; }
    .seg { display: inline-flex; border: 1px solid rgba(238,248,244,.25); border-radius: 8px; overflow: hidden; }
    .seg button {
      height: 30px; padding: 0 12px; border: 0; background: transparent;
      color: rgba(238,248,244,.6); font-size: .78rem; font-weight: 600;
    }
    .seg button.on { background: var(--mint); color: #14201c; }

    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal) 0%, #1a9a7c 60%, var(--mint) 100%);
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 7px 7px 7px 11px;
      border: 2px solid rgba(255,255,255,.92); border-left: 0; border-radius: 0 4px 4px 0;
    }

    /* ---------- 前台顶栏 ---------- */
    .shop-top {
      position: fixed; top: 48px; left: 0; right: 0; z-index: 70;
      display: flex; align-items: center; gap: 30px;
      height: 60px; padding: 0 max(20px, calc((100% - 1120px) / 2));
      background: rgba(247,251,249,.82); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .shop-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; letter-spacing: -.02em;
    }
    .shop-brand small { font-family: var(--font-mono); font-size: .62rem; color: var(--ink-mute); letter-spacing: .18em; margin-top: 3px; }
    .shop-nav { display: flex; gap: 24px; }
    .shop-nav a {
      position: relative; height: 60px; display: inline-flex; align-items: center;
      color: var(--ink-mute); font-size: .86rem; font-weight: 600;
    }
    .shop-nav a:hover { color: var(--ink); }
    .shop-nav a.active { color: var(--ink); font-weight: 700; }
    .shop-nav a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--teal);
    }
    .shop-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .cart-btn {
      position: relative; width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft);
      display: grid; place-items: center; transition: .2s var(--ease);
    }
    .cart-btn:hover { border-color: var(--teal); color: var(--teal); }
    .cart-btn .dot-n {
      position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--teal); color: #fff;
      font-size: .62rem; font-weight: 800; display: grid; place-items: center;
      border: 2px solid #f7fbf9;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ink); color: #fff; font-size: .8rem; font-weight: 700; cursor: pointer;
    }

    /* ---------- 页面 ---------- */
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 140px 0 80px; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .page-head h1 {
      margin: 0 0 8px; font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.6rem); letter-spacing: -.045em; line-height: 1.05;
    }
    .page-head .lead { margin: 0; color: var(--ink-mute); font-size: .88rem; }
    .page-head .lead b { color: var(--teal); font-weight: 700; }
    .ghost-btn {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
      height: 38px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: rgba(255,255,255,.6); color: var(--ink); font-weight: 600; font-size: .84rem;
      transition: .2s var(--ease);
    }
    .ghost-btn:hover { border-color: var(--ink); background: #fff; }

    /* ---------- 收件箱面板 ---------- */
    .inbox {
      display: grid; grid-template-columns: 320px minmax(0, 1fr);
      height: 660px; overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 22px;
      animation: riseIn .5s var(--ease) both;
    }

    /* 左：会话列表 */
    .threads { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
    .threads-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 18px 18px 12px;
    }
    .threads-head h2 { margin: 0; font-size: .95rem; font-weight: 800; letter-spacing: -.01em; }
    .threads-head span { font-family: var(--font-mono); font-size: .68rem; color: var(--ink-mute); }
    .threads-list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 8px; }

    .th {
      position: relative; display: block; width: 100%; text-align: left;
      padding: 13px 16px 13px 20px; border: 0; background: none; border-top: 1px solid var(--line);
      transition: background .15s;
    }
    .th:hover { background: var(--fog); }
    .th.on { background: var(--fog); }
    .th.on::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--teal);
    }
    .th-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .th-top b {
      font-size: .88rem; letter-spacing: -.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .th-top time { flex-shrink: 0; font-family: var(--font-mono); font-size: .66rem; color: var(--ink-mute); }
    .th-order {
      display: block; margin-top: 3px;
      font-family: var(--font-mono); font-size: .68rem; color: var(--ink-mute); letter-spacing: -.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .th-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .th-bottom .pv {
      min-width: 0; color: var(--ink-mute); font-size: .76rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .st { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: .7rem; font-weight: 700; white-space: nowrap; }
    .st i { width: 6px; height: 6px; border-radius: 50%; }
    .st.teal { color: var(--teal); } .st.teal i { background: var(--teal); }
    .st.warn { color: var(--warn); } .st.warn i { background: var(--warn-dot); }
    .st.mute { color: var(--ink-mute); } .st.mute i { background: var(--line-strong); }
    .unread {
      flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 99px; background: var(--danger); color: #fff;
      font-size: .64rem; font-weight: 800; display: grid; place-items: center;
    }

    /* 右：对话区 */
    .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .chat-head {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
    }
    .chat-head .c-av {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--teal), #1a9a7c); color: #fff; font-size: .85rem; font-weight: 800;
    }
    .chat-head .c-meta { min-width: 0; }
    .chat-head .c-meta b { display: block; font-size: .95rem; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-head .c-meta small { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: .68rem; color: var(--ink-mute); }
    .chat-head .c-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .st-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 26px; padding: 0 11px; border-radius: 99px;
      font-size: .72rem; font-weight: 700;
    }
    .st-pill i { width: 6px; height: 6px; border-radius: 50%; }
    .st-pill.teal { background: rgba(15,110,92,.1); color: var(--teal); } .st-pill.teal i { background: var(--teal); }
    .st-pill.warn { background: rgba(196,165,116,.2); color: var(--warn); } .st-pill.warn i { background: var(--warn-dot); }
    .st-pill.mute { background: var(--paper); color: var(--ink-mute); } .st-pill.mute i { background: var(--ink-mute); }
    .order-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .78rem; font-weight: 700; color: var(--teal); cursor: pointer;
    }
    .order-link:hover { text-decoration: underline; }

    .chat-body {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 20px; display: flex; flex-direction: column; gap: 14px; background: var(--fog);
    }
    .msg { display: flex; gap: 9px; align-items: flex-end; max-width: 78%; }
    .msg .m-av {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      font-size: .72rem; font-weight: 800;
    }
    .msg.peer .m-av { background: linear-gradient(135deg, var(--teal), #1a9a7c); color: #fff; }
    .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg.mine .m-av { background: var(--ink); color: #fff; }
    .bubble {
      padding: 10px 13px; font-size: .85rem; line-height: 1.65; word-break: break-word;
      background: #fff; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; color: var(--ink);
    }
    .msg.mine .bubble { background: var(--teal); border-color: var(--teal); color: #fff; border-radius: 14px 4px 14px 14px; }
    .msg .m-time { display: block; margin-top: 5px; font-family: var(--font-mono); font-size: .62rem; color: var(--ink-mute); }
    .msg.mine .m-time { text-align: right; }
    .file-bubble {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: #fff; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; min-width: 220px;
    }
    .file-bubble .fb-ico {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      background: rgba(15,110,92,.1); color: var(--teal); display: grid; place-items: center;
    }
    .file-bubble b { display: block; font-size: .8rem; }
    .file-bubble small { display: block; margin-top: 2px; color: var(--ink-mute); font-size: .66rem; font-family: var(--font-mono); }
    .sys-line { align-self: center; font-size: .7rem; color: var(--ink-mute); display: flex; align-items: center; gap: 6px; }

    /* 发货卡：待付尾款 / 已解锁 */
    .dlv {
      align-self: center; width: min(320px, 100%); text-align: center;
      border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 16px 18px 14px;
    }
    .dlv .d-ico {
      width: 36px; height: 36px; margin: 0 auto 9px; border-radius: 11px;
      background: rgba(15,110,92,.1); color: var(--teal); display: grid; place-items: center;
    }
    .dlv b { display: block; font-size: .9rem; }
    .dlv p { margin: 6px 0 12px; color: var(--ink-mute); font-size: .76rem; line-height: 1.6; }
    .dlv .d-pay {
      width: 100%; height: 38px; border: 0; border-radius: 10px;
      background: var(--teal); color: #fff; font-size: .84rem; font-weight: 700; transition: .2s var(--ease);
    }
    .dlv .d-pay:hover { background: var(--teal-deep); }
    .dlv .d-open {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--teal); font-size: .8rem; font-weight: 700; cursor: pointer;
    }
    .dlv .d-open:hover { text-decoration: underline; }

    .chat-input {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: #fff;
    }
    .chat-input .tool {
      width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; flex-shrink: 0;
      color: var(--ink-mute); display: grid; place-items: center; transition: .15s;
    }
    .chat-input .tool:hover { color: var(--teal); background: var(--fog); }
    .chat-input input {
      flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line-strong); border-radius: 11px;
      padding: 0 14px; outline: none; font-size: .86rem; background: var(--fog); transition: .2s;
    }
    .chat-input input:focus { border-color: var(--teal); background: #fff; }
    .chat-input .send {
      height: 40px; padding: 0 18px; border: 0; border-radius: 11px; flex-shrink: 0;
      background: var(--teal); color: #fff; font-weight: 700; font-size: .84rem;
      display: inline-flex; align-items: center; gap: 6px; transition: .2s var(--ease);
    }
    .chat-input .send:hover { background: var(--teal-deep); }

    /* 移动端：列表抽屉 */
    .drawer-btn { display: none; }
    .drawer-mask {
      position: fixed; inset: 0; z-index: 90; background: rgba(20,32,28,.35);
      opacity: 0; pointer-events: none; transition: opacity .2s var(--ease);
    }
    .drawer-mask.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; inset: 0 auto 0 0; z-index: 95; width: min(320px, 86vw);
      background: #fff; display: flex; flex-direction: column;
      transform: translateX(-102%); transition: transform .25s var(--ease);
      box-shadow: 8px 0 28px -20px rgba(20,32,28,.45);
    }
    .drawer.open { transform: none; }
    .drawer .threads-head { padding-top: 20px; }
    .drawer .d-close {
      border: 0; background: none; color: var(--ink-mute); font-size: .8rem; font-weight: 600;
    }
    .drawer .d-close:hover { color: var(--ink); }

    /* ---------- 空状态 ---------- */
    .empty {
      padding: 72px 20px; text-align: center;
      background: #fff; border: 1px dashed var(--line-strong); border-radius: 22px; color: var(--ink-mute);
      animation: riseIn .5s var(--ease) both;
    }
    .empty .e-ico {
      width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px;
      background: rgba(232,241,238,.8); display: grid; place-items: center; color: var(--ink-mute);
    }
    .empty h2 { margin: 0 0 8px; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: -.02em; color: var(--ink); }
    .empty p { margin: 0 0 18px; font-size: .88rem; line-height: 1.7; }
    .teal-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
      background: var(--teal); color: #fff; font-weight: 700; font-size: .9rem;
      transition: .2s var(--ease);
    }
    .teal-btn:hover { background: var(--teal-deep); }

    /* ---------- 页脚 ---------- */
    footer { border-top: 1px solid var(--line); padding: 26px 0 30px; }
    .foot-inner {
      width: min(1120px, calc(100% - 40px)); margin-inline: auto;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      color: var(--ink-mute); font-size: .8rem;
    }
    .foot-inner .f-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink-soft); }
    .foot-inner .f-brand .brand-mark { width: 20px; height: 20px; border-radius: 6px; }
    .foot-links { display: flex; gap: 20px; }
    .foot-links a { cursor: pointer; }
    .foot-links a:hover { color: var(--teal); }
    .foot-inner .mono { font-family: var(--font-mono); font-size: .72rem; }

    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 100;
      padding: 10px 14px; background: var(--ink); color: #fff; font-size: .84rem; border-radius: 4px;
      opacity: 0; transform: translateY(8px); transition: .25s var(--ease); pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 860px) {
      .shop-nav { display: none; }
      .page { padding-top: 126px; }
      .page-head .lead { font-size: .8rem; }
      .inbox { grid-template-columns: 1fr; height: calc(100dvh - 300px); min-height: 480px; }
      .inbox .threads { display: none; }
      .drawer-btn {
        display: inline-flex; align-items: center; gap: 6px;
        width: 100%; order: -1; height: auto; padding: 0 0 10px;
        border: 0; background: none; color: var(--ink-soft); font-size: .8rem; font-weight: 600;
      }
      .drawer-btn:hover { color: var(--teal); }
      .msg { max-width: 92%; }
      .chat-head { padding: 12px 14px; }
      .chat-body { padding: 16px 14px; }
      .demo-bar span, .demo-bar .jump { display: none; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <strong>我的约稿 Demo</strong>
    <div style="display:flex;align-items:center;gap:12px">
      <span>前台 · 一单一会话收件箱 + 对话内尾款解锁</span>
      <div class="seg" id="view-seg">
        <button type="button" class="on" data-view="inbox">收件箱</button>
        <button type="button" data-view="empty">空状态</button>
      </div>
      <a class="jump" href="orders.html">我的订单 Demo <i data-lucide="arrow-up-right"></i></a>
    </div>
  </div>

  <header class="shop-top">
    <a class="shop-brand" href="shop.html"><span class="brand-mark"></span>领匣<small>LINGXIA</small></a>
    <nav class="shop-nav">
      <a href="shop.html">商城</a>
      <a href="commission.html">约稿</a>
      <a href="orders.html">我的订单</a>
      <a href="#" class="active">我的约稿</a>
    </nav>
    <div class="shop-right">
      <button class="cart-btn" type="button" data-act="打开购物车"><i data-lucide="shopping-bag"></i><span class="dot-n">2</span></button>
      <div class="avatar" data-act="打开个人中心">林</div>
    </div>
  </header>

  <main class="page">
    <header class="page-head">
      <div>
        <h1>我的约稿</h1>
        <p class="lead" id="lead">共 <b>4</b> 条对话 · <b>1</b> 笔进行中 · <b>1</b> 笔待付尾款</p>
      </div>
      <a class="ghost-btn" href="orders.html"><i data-lucide="receipt-text"></i>我的订单</a>
    </header>

    <!-- 收件箱 -->
    <section class="inbox" id="inbox">
      <aside class="threads">
        <div class="threads-head"><h2>约稿订单</h2><span id="th-count">4 条对话</span></div>
        <div class="threads-list" id="threads-list"></div>
      </aside>

      <section class="chat">
        <div class="chat-head" id="chat-head"></div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-input">
          <button class="tool" type="button" data-act="选择表情"><i data-lucide="smile" style="width:17px;height:17px"></i></button>
          <button class="tool" type="button" data-act="发送图片"><i data-lucide="image" style="width:17px;height:17px"></i></button>
          <button class="tool" type="button" data-act="发送文件"><i data-lucide="paperclip" style="width:17px;height:17px"></i></button>
          <input placeholder="写人设、尺度、禁触，或补充修改意见…" id="chat-in" autocomplete="off" />
          <button class="send" type="button" id="chat-send"><i data-lucide="send" style="width:14px;height:14px"></i>发送</button>
        </div>
      </section>
    </section>

    <!-- 空状态 -->
    <section class="empty hidden" id="empty">
      <div class="e-ico"><i data-lucide="message-square-dashed" style="width:24px;height:24px"></i></div>
      <h2>还没有约稿对话</h2>
      <p>下单约稿后，与作者的对话会出现在这里。<br />尾款支付与文件下载仍在「我的订单」。</p>
      <a class="teal-btn" href="commission.html"><i data-lucide="pen-line" style="width:15px;height:15px"></i>去看看定制约稿</a>
    </section>
  </main>

  <!-- 移动端抽屉 -->
  <div class="drawer-mask" id="drawer-mask"></div>
  <aside class="drawer" id="drawer">
    <div class="threads-head">
      <h2>约稿订单</h2>
      <button class="d-close" type="button" id="drawer-close">关闭</button>
    </div>
    <div class="threads-list" id="drawer-list"></div>
  </aside>

  <footer>
    <div class="foot-inner">
      <span class="f-brand"><span class="brand-mark"></span>© 2026 领匣 Lingxia</span>
      <div class="foot-links">
        <a href="shop.html">商品</a>
        <a href="commission.html">约稿</a>
        <a href="orders.html">我的订单</a>
        <a href="#" data-act="回到顶部">回到顶部</a>
      </div>
      <span class="mono">xinx.shop</span>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id)
    const toastEl = $("toast")
    let toastTimer = 0
    function toast(text) {
      toastEl.textContent = text
      toastEl.classList.add("show")
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200)
    }
    function refreshIcons() {
      if (window.lucide) lucide.createIcons({ attrs: { width: 15, height: 15, "stroke-width": 1.8 } })
    }

    /* ---------- 会话数据：覆盖 沟通中 / 进行中 / 待付尾款 / 已完成 ---------- */
    const THREADS = [
      {
        id: "t2", name: "校园补课番外 · 定制约稿", order: "LX260905-0098", words: "8,000 字",
        status: "awaiting_balance", stLabel: "待付尾款", tone: "warn",
        time: "21:45", preview: "稿件已就绪，支付尾款后解锁", unread: 2,
        msgs: [
          { k: "peer", t: "text", body: "番外初稿写完啦，比约定多了 500 字，不加价～", time: "21:02" },
          { k: "sys", body: "作者已发货，等待买家支付尾款", icon: "package-check" },
          { k: "dlv", state: "pay", title: "稿件已就绪", desc: "校园补课番外 · 初稿 8,500 字", btn: "支付尾款 ¥256.00" },
        ],
      },
      {
        id: "t1", name: "长篇定制《潮湿的信》", order: "LX260907-0118", words: "3 万字",
        status: "deposit_paid", stLabel: "已付定金", tone: "teal",
        time: "22:40", preview: "好的，第三章我改完发你", unread: 0,
        msgs: [
          { k: "peer", t: "text", body: "大纲确认收到，今天开始动笔。万字以上分三次交稿，每次你可以提一次免费修改。", time: "13:10" },
          { k: "mine", t: "text", body: "好，第一章节奏慢一点，多雨天的细节。", time: "13:14" },
          { k: "peer", t: "file", name: "潮湿的信-第1-2章.docx", size: "86 KB", time: "19:30" },
          { k: "sys", body: "第 1–2 章已交付，可在对话中反馈修改", icon: "pen-line" },
          { k: "mine", t: "text", body: "第二章结尾的独白再克制一点，别直接点破。", time: "22:18" },
          { k: "peer", t: "text", body: "好的，第三章我改完发你", time: "22:40" },
        ],
      },
      {
        id: "t3", name: "修仙短篇 · 点梗", order: "LX260831-0077", words: "1.5 万字",
        status: "completed", stLabel: "已完成", tone: "teal",
        time: "09/02", preview: "感谢约稿，欢迎下次再来～", unread: 0,
        msgs: [
          { k: "peer", t: "text", body: "全文交付！DOCX 可编辑版和 EPUB 阅读版都在订单里。", time: "18:03" },
          { k: "sys", body: "尾款已到账，稿件已解锁", icon: "lock-open" },
          { k: "dlv", state: "done", title: "稿件已解锁", desc: "修仙短篇 · 15,000 字 · 双格式", btn: "查看订单下载" },
          { k: "peer", t: "text", body: "感谢约稿，欢迎下次再来～", time: "18:20" },
        ],
      },
      {
        id: "t4", name: "定制约稿 · 你来点梗我来写", order: "", words: "",
        status: "", stLabel: "沟通中", tone: "mute",
        time: "周一", preview: "可以先发我人设和尺度", unread: 0,
        msgs: [
          { k: "peer", t: "text", body: "你好呀～想约什么题材？可以先把人设、尺度和雷点发我。", time: "20:12" },
          { k: "mine", t: "text", body: "在攒一个悬疑短篇的梗，晚点发你大纲思路。", time: "20:26" },
          { k: "peer", t: "text", body: "没问题，悬疑短篇我最熟。确认大纲和档期后再拍定金就行。", time: "20:31" },
        ],
      },
    ]

    let activeId = THREADS[0].id
    const replied = {}

    /* ---------- 列表渲染 ---------- */
    function threadItemHTML(t) {
      const right = t.unread > 0
        ? `<span class="unread">${t.unread}</span>`
        : `<span class="st ${t.tone}"><i></i>${t.stLabel}</span>`
      const orderLine = t.order
        ? `${t.order}${t.words ? " · " + t.words : ""}`
        : "未下单 · 商品页对话"
      return `
      <button class="th ${t.id === activeId ? "on" : ""}" type="button" data-th="${t.id}">
        <div class="th-top"><b>${t.name}</b><time>${t.time}</time></div>
        <span class="th-order">${orderLine}</span>
        <div class="th-bottom"><span class="pv">${t.preview}</span>${right}</div>
      </button>`
    }
    function renderLists() {
      const html = THREADS.map(threadItemHTML).join("")
      $("threads-list").innerHTML = html
      $("drawer-list").innerHTML = html
    }

    /* ---------- 对话渲染 ---------- */
    function msgHTML(m) {
      if (m.k === "sys") {
        return `<div class="sys-line"><i data-lucide="${m.icon || "info"}" style="width:11px;height:11px"></i>${m.body}</div>`
      }
      if (m.k === "dlv") {
        const act = m.state === "pay"
          ? `<button class="d-pay" type="button" data-act="${m.btn}">${m.btn}</button>`
          : `<a class="d-open" href="order-detail.html">${m.btn}<i data-lucide="arrow-right" style="width:13px;height:13px"></i></a>`
        return `
        <div class="dlv">
          <span class="d-ico"><i data-lucide="${m.state === "pay" ? "package-check" : "lock-open"}" style="width:17px;height:17px"></i></span>
          <b>${m.title}</b>
          <p>${m.desc}</p>
          ${act}
        </div>`
      }
      const inner = m.t === "file"
        ? `<div class="file-bubble">
             <span class="fb-ico"><i data-lucide="file-text" style="width:16px;height:16px"></i></span>
             <span><b>${m.name}</b><small>${m.size}</small></span>
           </div>`
        : `<div class="bubble"></div>`
      return `
      <div class="msg ${m.k}">
        <div class="m-av">${m.k === "mine" ? "林" : "匣"}</div>
        <div>${inner}<span class="m-time">${m.time}</span></div>
      </div>`
    }
    function renderChat() {
      const t = THREADS.find((x) => x.id === activeId)
      const orderLine = t.order ? `${t.order}${t.words ? " · " + t.words : ""}` : "商品页对话 · 未生成订单"
      const orderLink = t.order
        ? `<a class="order-link" href="order-detail.html">订单详情<i data-lucide="arrow-up-right" style="width:12px;height:12px"></i></a>` : ""
      $("chat-head").innerHTML = `
        <button class="drawer-btn" type="button" id="drawer-open"><i data-lucide="panel-left" style="width:14px;height:14px"></i>约稿订单</button>
        <div class="c-av">匣</div>
        <div class="c-meta"><b>${t.name}</b><small>${orderLine}</small></div>
        <div class="c-right">
          <span class="st-pill ${t.tone}"><i></i>${t.stLabel}</span>
          ${orderLink}
        </div>`
      $("chat-body").innerHTML = t.msgs.map(msgHTML).join("")
      // 文本气泡内容用 textContent 写入，避免转义问题
      const bubbles = $("chat-body").querySelectorAll(".msg .bubble")
      let bi = 0
      for (const m of t.msgs) {
        if ((m.k === "peer" || m.k === "mine") && m.t === "text") {
          bubbles[bi].textContent = m.body
          bi++
        }
      }
      $("chat-body").scrollTop = $("chat-body").scrollHeight
      refreshIcons()
      $("drawer-open").addEventListener("click", openDrawer)
    }

    function selectThread(id) {
      activeId = id
      const t = THREADS.find((x) => x.id === id)
      if (t) t.unread = 0
      renderLists()
      renderChat()
      closeDrawer()
    }
    document.addEventListener("click", (e) => {
      const th = e.target.closest("[data-th]")
      if (th) selectThread(th.dataset.th)
    })

    /* ---------- 抽屉 ---------- */
    function openDrawer() { $("drawer").classList.add("open"); $("drawer-mask").classList.add("open") }
    function closeDrawer() { $("drawer").classList.remove("open"); $("drawer-mask").classList.remove("open") }
    $("drawer-mask").addEventListener("click", closeDrawer)
    $("drawer-close").addEventListener("click", closeDrawer)

    /* ---------- 发送 ---------- */
    function nowTime() {
      const d = new Date()
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`
    }
    function sendChat() {
      const input = $("chat-in")
      const text = input.value.trim()
      if (!text) { toast("Demo：先输入消息"); return }
      input.value = ""
      const body = $("chat-body")
      const el = document.createElement("div")
      el.className = "msg mine"
      el.innerHTML = `<div class="m-av">林</div><div><div class="bubble"></div><span class="m-time">${nowTime()}</span></div>`
      el.querySelector(".bubble").textContent = text
      body.appendChild(el)
      body.scrollTop = body.scrollHeight
      if (!replied[activeId]) {
        replied[activeId] = true
        setTimeout(() => {
          const r = document.createElement("div")
          r.className = "msg peer"
          r.innerHTML = `<div class="m-av">匣</div><div><div class="bubble"></div><span class="m-time">${nowTime()}</span></div>`
          r.querySelector(".bubble").textContent = "收到～我整理一下，晚点回复你。"
          body.appendChild(r)
          body.scrollTop = body.scrollHeight
        }, 900)
      }
    }
    $("chat-send").addEventListener("click", sendChat)
    $("chat-in").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendChat() }
    })

    /* ---------- 视图切换：收件箱 / 空状态 ---------- */
    $("view-seg").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-view]")
      if (!btn) return
      document.querySelectorAll("#view-seg button").forEach((b) => b.classList.toggle("on", b === btn))
      const empty = btn.dataset.view === "empty"
      $("inbox").classList.toggle("hidden", empty)
      $("empty").classList.toggle("hidden", !empty)
      $("lead").style.visibility = empty ? "hidden" : "visible"
      refreshIcons()
    })

    /* ---------- 其他交互 ---------- */
    document.addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")
      if (act) {
        e.preventDefault()
        toast(`Demo：${act.dataset.act}`)
      }
    })

    /* ---------- hash 直达：#thread=t1 / #drawer=1 / #view=empty ---------- */
    const hash = new URLSearchParams(location.hash.slice(1))
    if (hash.get("thread") && THREADS.some((t) => t.id === hash.get("thread"))) activeId = hash.get("thread")
    if (hash.get("view") === "empty") {
      document.querySelectorAll("#view-seg button").forEach((b) => b.classList.toggle("on", b.dataset.view === "empty"))
      $("inbox").classList.add("hidden")
      $("empty").classList.remove("hidden")
      $("lead").style.visibility = "hidden"
    }
    renderLists()
    renderChat()
    if (hash.get("drawer") === "1") openDrawer()
    refreshIcons()
  </script>
</body>
</html>
