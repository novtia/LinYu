<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 后台订单 Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #14201c;
      --ink-soft: #3d4f48;
      --ink-mute: #6b7c74;
      --paper: #e8f1ee;
      --fog: #f4f8f6;
      --line: rgba(20, 32, 28, 0.09);
      --line-strong: rgba(20, 32, 28, 0.16);
      --teal: #0f6e5c;
      --teal-deep: #0a5245;
      --mint: #7fd4b8;
      --warn: #8a6a2f;
      --warn-dot: #c4a574;
      --danger: #b42318;
      --font-display: "Syne", "Noto Sans SC", sans-serif;
      --font-body: "Sora", "Noto Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", "Noto Sans SC", monospace;
      --ease: cubic-bezier(.22, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--fog);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .demo-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 80;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 48px; padding: 0 20px; background: #14201c; color: #eef8f4;
    }
    .demo-bar strong { font-family: var(--font-display); font-size: .95rem; letter-spacing: -.02em; }
    .demo-bar span { color: rgba(238,248,244,.55); font-size: .78rem; }
    .demo-bar .jump {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border: 1px solid rgba(238,248,244,.25); border-radius: 8px;
      background: transparent; color: rgba(238,248,244,.8); font-size: .78rem; font-weight: 600;
    }
    .demo-bar .jump:hover { border-color: var(--mint); color: #fff; }

    .brand-mark {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), #1a9a7c 70%);
      position: relative;
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 5px 5px 5px 8px;
      border: 1.6px solid #fff; border-left: 0; border-radius: 0 3px 3px 0;
    }

    /* ---------- 后台壳 ---------- */
    .admin { position: fixed; inset: 48px 0 0; display: grid; grid-template-columns: 232px 1fr; }
    .aside {
      background: var(--ink); color: #eef8f4;
      padding: 20px 14px; display: flex; flex-direction: column; min-height: 0;
    }
    .aside-brand {
      display: flex; align-items: center; gap: 9px; margin: 0 6px 22px;
      font-family: var(--font-display); font-weight: 800; font-size: 1.02rem; letter-spacing: -.02em;
    }
    .aside nav { display: grid; gap: 2px; overflow-y: auto; }
    .aside .nav-cap {
      margin: 16px 10px 6px; color: rgba(238,248,244,.38);
      font-size: .66rem; font-weight: 700; letter-spacing: .14em;
    }
    .aside a {
      display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px;
      color: rgba(238,248,244,.55); font-size: .86rem; border-radius: 8px;
    }
    .aside a:hover { color: #fff; background: rgba(255,255,255,.06); }
    .aside a.active { color: #fff; background: var(--teal); }
    .aside a .n {
      margin-left: auto; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px;
      background: var(--danger); color: #fff; font-size: .64rem; font-weight: 800;
      display: grid; place-items: center;
    }
    .aside a.active .n { background: rgba(255,255,255,.22); }
    .aside-foot {
      margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(238,248,244,.45); font-size: .72rem; line-height: 1.7;
    }

    .main { display: grid; grid-template-rows: 52px 1fr; min-width: 0; min-height: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 28px; border-bottom: 1px solid var(--line);
      background: rgba(244,248,246,.9); backdrop-filter: blur(10px);
      font-size: .86rem; color: var(--ink-mute);
    }
    .topbar .crumb b { color: var(--ink); font-weight: 700; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .topbar .date { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ink); color: #fff; font-size: .78rem; font-weight: 700;
    }

    /* ---------- 订单工作区 ---------- */
    .work { min-height: 0; overflow: hidden; padding: 30px 32px 0; display: flex; }
    .work-inner { width: min(1200px, 100%); margin-inline: auto; display: flex; flex-direction: column; min-height: 0; flex: 1; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-shrink: 0; }
    .page-head h1 {
      margin: 0 0 4px; font-family: var(--font-display);
      font-size: clamp(1.7rem, 2.6vw, 2.1rem); letter-spacing: -.04em; line-height: 1.1;
    }
    .page-head .lead { margin: 0; color: var(--ink-mute); font-size: .86rem; }
    .page-head .lead b { color: var(--teal); font-weight: 700; }
    .ghost-btn {
      display: inline-flex; align-items: center; gap: 7px;
      height: 36px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: transparent; color: var(--ink); font-weight: 600; font-size: .82rem;
      transition: .2s var(--ease); flex-shrink: 0;
    }
    .ghost-btn:hover { border-color: var(--ink); }

    /* 搜索 + 过滤 */
    .filter-bar {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
      margin-top: 24px; padding-bottom: 0; flex-shrink: 0;
    }
    .search {
      flex: 1; min-width: 220px; max-width: 380px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--line-strong); padding-bottom: 7px;
    }
    .search:focus-within { border-color: var(--teal); }
    .search i { color: var(--ink-mute); flex-shrink: 0; }
    .search input {
      flex: 1; border: 0; outline: none; background: transparent;
      font-size: .88rem; min-width: 0;
    }
    .search input::placeholder { color: var(--ink-mute); }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .chips button {
      height: 30px; padding: 0 12px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--ink-mute); font-size: .8rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chips button:hover { color: var(--ink); background: var(--paper); }
    .chips button.on { color: var(--ink); border-color: var(--line-strong); background: #fff; }
    .chips button .c { font-family: var(--font-mono); font-size: .7rem; opacity: .6; }

    /* 订单账本列表 */
    .split {
      display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 0;
      margin-top: 26px; border-top: 1px solid var(--line);
      flex: 1; min-height: 0; align-items: stretch;
    }
    .order-list {
      border-bottom: 1px solid var(--line);
      overflow-y: auto; min-height: 0;
      padding-bottom: 40px;
    }
    .o-row {
      width: 100%; text-align: left; border: 0; background: transparent;
      display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 18px;
      padding: 16px 12px 16px 4px; border-bottom: 1px solid var(--line);
      cursor: pointer; transition: background .15s var(--ease); position: relative;
    }
    .o-row:hover { background: rgba(232,241,238,.45); }
    .o-row.active { background: var(--paper); }
    .o-row.active::before {
      content: ""; position: absolute; left: -13px; top: 0; bottom: 0; width: 2px; background: var(--teal);
    }
    .o-main { min-width: 0; }
    .o-top { display: flex; align-items: baseline; gap: 10px; }
    .o-id { font-family: var(--font-mono); font-size: .74rem; color: var(--ink-mute); letter-spacing: -.01em; flex-shrink: 0; }
    .o-mode {
      font-size: .68rem; font-weight: 700; color: var(--teal); flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .o-name { margin-top: 5px; font-size: .92rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .o-sub { margin-top: 3px; color: var(--ink-mute); font-size: .76rem; display: flex; gap: 10px; flex-wrap: wrap; }
    .o-mid { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; align-self: center; }
    .o-amt { font-family: var(--font-mono); font-weight: 700; font-size: .95rem; letter-spacing: -.02em; }
    .o-time { font-family: var(--font-mono); font-size: .68rem; color: var(--ink-mute); }
    .st { display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600; white-space: nowrap; align-self: center; }
    .st i { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .st.teal { color: var(--teal); } .st.teal i { background: var(--teal); }
    .st.warn { color: var(--warn); } .st.warn i { background: var(--warn-dot); }
    .st.danger { color: var(--danger); } .st.danger i { background: var(--danger); }
    .st.mute { color: var(--ink-mute); } .st.mute i { background: var(--line-strong); }
    .list-foot { padding: 12px 4px; color: var(--ink-mute); font-size: .74rem; }
    .empty { padding: 48px 16px; text-align: center; color: var(--ink-mute); font-size: .86rem; }

    /* ---------- 详情栏：固定高度、悬停才滚动 ---------- */
    .detail {
      border-left: 1px solid var(--line);
      padding: 26px 26px 40px 28px;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color .25s var(--ease);
    }
    .detail:hover,
    .detail:focus-within {
      scrollbar-color: rgba(20,32,28,.28) transparent;
    }
    .detail::-webkit-scrollbar { width: 5px; }
    .detail::-webkit-scrollbar-track { background: transparent; }
    .detail::-webkit-scrollbar-thumb { background: transparent; border-radius: 99px; transition: background .25s var(--ease); }
    .detail:hover::-webkit-scrollbar-thumb,
    .detail:focus-within::-webkit-scrollbar-thumb { background: rgba(20,32,28,.28); }
    .d-empty { color: var(--ink-mute); font-size: .86rem; padding: 60px 8px; text-align: center; }

    .d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .d-head .mono { font-family: var(--font-mono); font-size: .78rem; color: var(--ink-mute); display: flex; align-items: center; gap: 7px; }
    .d-head .mono button {
      border: 0; background: none; padding: 2px; color: var(--ink-mute); display: grid; place-items: center;
    }
    .d-head .mono button:hover { color: var(--teal); }
    .d-head h2 {
      margin: 10px 0 0; font-family: var(--font-display); font-size: 1.5rem;
      letter-spacing: -.03em; line-height: 1.25; word-break: break-word;
    }
    .d-sub { margin-top: 6px; color: var(--ink-mute); font-size: .8rem; }
    .d-sub a { color: var(--teal); font-weight: 600; }
    .d-sub a:hover { text-decoration: underline; }

    .d-amount { margin-top: 18px; }
    .d-amount .big {
      font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; letter-spacing: -.05em; line-height: 1;
    }
    .d-amount .big small { font-size: 1rem; color: var(--ink-mute); letter-spacing: 0; margin-left: 2px; }
    .d-split {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
      margin-top: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    }
    .d-split > div { padding: 12px 0; }
    .d-split > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
    .d-split small { display: block; margin-bottom: 5px; color: var(--ink-mute); font-size: .7rem; letter-spacing: .05em; }
    .d-split b { font-family: var(--font-mono); font-size: .92rem; font-weight: 700; letter-spacing: -.01em; }
    .d-split b.ok { color: var(--teal); }
    .d-split b.wait { color: var(--warn); }

    /* 流程条（约稿） */
    .flow { display: grid; grid-template-columns: repeat(4, 1fr); margin: 20px 0 0; padding: 0; list-style: none; }
    .flow li { position: relative; padding-right: 12px; color: var(--ink-mute); font-size: .74rem; }
    .flow li::before {
      content: ""; display: block; width: 7px; height: 7px; margin-bottom: 8px;
      border-radius: 50%; background: var(--line-strong);
    }
    .flow li.on { color: var(--ink); font-weight: 700; }
    .flow li.on::before { background: var(--teal); }
    .flow li.now::before { box-shadow: 0 0 0 3px rgba(15,110,92,.18); }

    .d-sec { margin-top: 28px; }
    .d-sec > h3 {
      margin: 0; padding-bottom: 10px; border-bottom: 1px solid var(--line);
      font-size: .76rem; font-weight: 700; letter-spacing: .08em; color: var(--ink-soft);
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .d-sec > h3 small { color: var(--ink-mute); font-weight: 500; letter-spacing: 0; }

    .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; padding: 12px 0 0; }
    .kv dt { color: var(--ink-mute); font-size: .8rem; white-space: nowrap; }
    .kv dd { margin: 0; font-size: .84rem; font-weight: 600; text-align: right; word-break: break-all; }
    .kv dd.mono { font-family: var(--font-mono); font-size: .78rem; letter-spacing: -.01em; }

    .items { list-style: none; margin: 4px 0 0; padding: 0; }
    .items li { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .items li:last-child { border-bottom: 0; }
    .items .i-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .items b { font-size: .88rem; }
    .items .i-price { font-family: var(--font-mono); font-size: .84rem; font-weight: 700; white-space: nowrap; }
    .items .i-sub { margin-top: 3px; color: var(--ink-mute); font-size: .74rem; }

    .files { list-style: none; margin: 0; padding: 8px 0 0; }
    .files li {
      display: flex; align-items: center; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .files li:last-child { border-bottom: 0; }
    .file-ico {
      width: 30px; height: 30px; display: grid; place-items: center; flex-shrink: 0;
      background: rgba(15,110,92,.1); color: var(--teal); border-radius: 3px;
    }
    .files b { display: block; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .files small { color: var(--ink-mute); font-size: .7rem; }
    .files .f-act { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }
    .f-act button {
      border: 0; background: none; padding: 0; color: var(--teal); font-size: .74rem; font-weight: 700;
    }
    .f-act button.del { color: var(--danger); font-weight: 600; }
    .f-act button:hover { text-decoration: underline; }
    .upload {
      margin-top: 12px; border: 1px dashed var(--line-strong); border-radius: 4px;
      padding: 14px; text-align: center; color: var(--ink-mute); font-size: .78rem;
      cursor: pointer; transition: .2s var(--ease); display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .upload:hover { border-color: var(--teal); color: var(--teal); }
    .lock-note {
      margin-top: 10px; padding: 9px 12px; background: var(--paper);
      color: var(--ink-soft); font-size: .76rem; display: flex; gap: 8px; align-items: flex-start;
    }
    .lock-note i { flex-shrink: 0; margin-top: 1px; }

    .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
    .teal-btn {
      display: inline-flex; align-items: center; gap: 7px;
      height: 38px; padding: 0 16px; border: 0; border-radius: 10px;
      background: var(--teal); color: #fff; font-weight: 700; font-size: .84rem;
      transition: .2s var(--ease);
    }
    .teal-btn:hover { background: var(--teal-deep); }
    .line-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 38px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: transparent; color: var(--ink); font-weight: 600; font-size: .82rem;
    }
    .line-btn:hover { border-color: var(--ink); }
    .line-btn.danger { color: var(--danger); }
    .line-btn.danger:hover { border-color: var(--danger); }

    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 100;
      padding: 10px 14px; background: var(--ink); color: #fff; font-size: .84rem;
      opacity: 0; transform: translateY(8px); transition: .25s var(--ease); pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .admin { position: relative; inset: auto; grid-template-columns: 1fr; margin-top: 48px; }
      .aside { display: none; }
      .work { padding: 22px 18px 56px; overflow: visible; }
      .split { grid-template-columns: 1fr; }
      .order-list { overflow: visible; padding-bottom: 0; }
      .detail { border-left: 0; padding: 24px 4px 40px; overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <strong>后台订单 Demo</strong>
    <div style="display:flex;align-items:center;gap:12px">
      <span>订单管理 + 订单详情 · 发丝线风格</span>
      <a class="jump" href="admin-dashboard.html">概览 Demo <i data-lucide="arrow-up-right"></i></a>
    </div>
  </div>

  <div class="admin">
    <aside class="aside">
      <div class="aside-brand"><span class="brand-mark"></span>领匣控制台</div>
      <nav>
        <div class="nav-cap">工作台</div>
        <a href="#"><i data-lucide="layout-dashboard"></i>概览</a>
        <div class="nav-cap">运营管理</div>
        <a href="#"><i data-lucide="package"></i>商品管理</a>
        <a href="#"><i data-lucide="folder-tree"></i>分类管理</a>
        <a href="#"><i data-lucide="users"></i>用户管理</a>
        <div class="nav-cap">交易履约</div>
        <a href="#" class="active"><i data-lucide="clipboard-list"></i>订单管理<span class="n">5</span></a>
        <a href="#"><i data-lucide="message-square"></i>约稿对话<span class="n">4</span></a>
        <a href="#"><i data-lucide="send"></i>发放记录</a>
        <div class="nav-cap">站点配置</div>
        <a href="#"><i data-lucide="credit-card"></i>支付接入</a>
        <a href="#"><i data-lucide="settings-2"></i>系统设置</a>
        <a href="#"><i data-lucide="globe"></i>网站设置</a>
      </nav>
      <div class="aside-foot">v1.4.2 · SQLite<br />xingx.shop</div>
    </aside>

    <div class="main">
      <div class="topbar">
        <span class="crumb">控制台 / 交易履约 / <b>订单管理</b></span>
        <div class="topbar-right">
          <span class="date" id="today"></span>
          <div class="avatar">A</div>
        </div>
      </div>

      <main class="work">
        <div class="work-inner">
          <header class="page-head">
            <div>
              <h1>订单管理</h1>
              <p class="lead">当前筛选 <b id="total-n">19</b> 笔，<b>5</b> 笔待跟进。</p>
            </div>
            <button class="ghost-btn" type="button" data-act="导出订单 CSV"><i data-lucide="download"></i>导出 CSV</button>
          </header>

          <div class="filter-bar">
            <label class="search">
              <i data-lucide="search"></i>
              <input id="q" placeholder="搜索订单号、买家、邮箱或商品" autocomplete="off" />
            </label>
            <div class="chips" id="chips">
              <button type="button" class="on" data-f="all">全部</button>
              <button type="button" data-f="pending">待支付</button>
              <button type="button" data-f="deposit_paid">已付定金</button>
              <button type="button" data-f="awaiting_balance">待付尾款</button>
              <button type="button" data-f="completed">已完成</button>
              <button type="button" data-f="commission">仅约稿</button>
            </div>
          </div>

          <div class="split">
            <section class="order-list" id="order-list"></section>
            <aside class="detail" id="detail"></aside>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id)
    let toastTimer = 0
    function toast(text) {
      $("toast").textContent = text
      $("toast").classList.add("show")

    let filter = "all"

    function fmtListTime(ts) {
      const d = new Date(ts), n = new Date()
      const hm = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`
      if (d.toDateString() === n.toDateString()) return hm
      const y = new Date(n); y.setDate(n.getDate() - 1)
      if (d.toDateString() === y.toDateString()) return `昨天 ${hm}`
      return `${d.getMonth()+1}/${d.getDate()} ${hm}`
    }
    function yuan(n) { return `¥${(Math.round(n*100)/100).toLocaleString("zh-CN")}` }
    function esc(s) { return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])) }

    function matchFilter(o) {
      if (filter === "all") return true
      if (filter === "commission") return o.mode === "commission"
      return o.status === filter
    }
    function matchQuery(o) {
      if (!query) return true
      const q = query.toLowerCase()
      return [o.id, o.buyer, o.email, o.item].some(x => String(x).toLowerCase().includes(q))
    }

            </div>
            <div class="o-name">${esc(o.item)}</div>
            <div class="o-sub"><span>${esc(o.buyer)}</span><span>${esc(o.email)}</span></div>
          </div>
          <span class="st ${TONE[o.status] || "mute"}"><i></i>${o.statusLabel}</span>
          <div class="o-mid">
            <span class="o-amt">${yuan(o.total)}</span>
            <span class="o-time">${fmtListTime(o.at)}</span>
          </div>
        </button>
      `).join("") : `<div class="empty">没有匹配的订单</div>`

      return `<ol class="flow">${o.flows.map((s, i) => {

        return `<li class="${done || nowStep ? "on" : ""} ${nowStep ? "now" : ""}">${s}</li>`

                </div>
              </li>`).join("")}
          </ul>` : `<p style="padding:10px 0 2px;color:var(--ink-mute);font-size:.8rem;margin:0">${o.payload ? esc(o.payload) : commission ? "还未上传稿件" : "未发放"}</p>`}
          ${canUpload ? `<div class="upload" data-act="上传稿件"><i data-lucide="upload"></i>上传稿件（DOCX / TXT / 图片）</div>` : ""}
          ${o.files.some(f => f.locked) ? `<div class="lock-note"><i data-lucide="lock"></i><span>带锁文件对买家可见但不可下载，买家付清尾款后自动解锁。</span></div>` : ""}
        </section>

        <div class="acts">
          ${commission ? `<button class="teal-btn" type="button" data-act="打开约稿对话"><i data-lucide="message-square"></i>打开对话</button>` : ""}
          <button class="line-btn" type="button" data-act="复制订单号 ${o.id}"><i data-lucide="copy"></i>复制单号</button>
          <button class="line-btn" type="button" data-act="给 ${o.buyer} 发邮件"><i data-lucide="mail"></i>发邮件</button>
          ${o.status === "pending" ? `<button class="line-btn danger" type="button" data-act="取消订单 ${o.id}"><i data-lucide="x"></i>取消订单</button>` : ""}
        </div>
      `
      refreshIcons()
    }

    /* ---------- 交互 ---------- */
    document.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]")
      if (open) { activeId = open.dataset.open; renderList(); renderDetail(); return }
      const chip = e.target.closest("[data-f]")
      if (chip) {
        filter = chip.dataset.f
        document.querySelectorAll("[data-f]").forEach(b => b.classList.toggle("on", b === chip))
        renderList(); return
      }
      const copy = e.target.closest("[data-copy]")
      if (copy) {
        e.preventDefault(); e.stopPropagation()
        navigator.clipboard?.writeText(copy.dataset.copy).then(() => toast("已复制")).catch(() => toast("复制失败"))
        return
      }
      const act = e.target.closest("[data-act]")
      if (act) { e.preventDefault(); toast(`Demo：${act.dataset.act}`) }
    })
    $("q").addEventListener("input", (e) => { query = e.target.value.trim(); renderList() })

    renderList()
    renderDetail()
  </script>
</body>
</html>
