<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 我的书架 设计稿</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* 与线上前台完全一致的设计令牌（index.css / orders.html） */
    :root {
      --ink: #14201c; --ink-soft: #3d4f48; --ink-mute: #6b7c74;
      --paper: #e8f1ee; --fog: #f4f8f6;
      --line: rgba(20, 32, 28, 0.09); --line-strong: rgba(20, 32, 28, 0.16);
      --teal: #0f6e5c; --teal-deep: #0a5245; --mint: #7fd4b8;
      --warn: #8a6a2f; --warn-dot: #c4a574; --danger: #b42318;
      --font-display: "Syne", "Noto Sans SC", sans-serif;
      --font-body: "Sora", "Noto Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", "Noto Sans SC", monospace;
      --ease: cubic-bezier(.22, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased;
      background-color: #eef5f2;
      background-image:
        radial-gradient(1200px 700px at 85% -10%, rgba(127, 212, 184, 0.35), transparent 55%),
        radial-gradient(900px 600px at -5% 20%, rgba(196, 165, 116, 0.18), transparent 50%),
        linear-gradient(180deg, #f7fbf9 0%, var(--fog) 42%, #eef5f2 100%);
      background-repeat: no-repeat; background-attachment: fixed;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; cursor: pointer; }
    svg { flex-shrink: 0; }
    .hidden { display: none !important; }

    .brand-mark { position: relative; overflow: hidden; width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; background: linear-gradient(135deg, var(--teal) 0%, #1a9a7c 60%, var(--mint) 100%); }
    .brand-mark::after { content: ""; position: absolute; inset: 7px 7px 7px 11px; border: 2px solid rgba(255,255,255,.92); border-left: 0; border-radius: 0 4px 4px 0; }

    /* ---------- 前台顶栏（与线上 Topbar 一致，新增“我的书架”） ---------- */
    .shop-top { position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: rgba(247,251,249,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .shop-top-inner { display: flex; align-items: center; gap: 30px; height: 60px; padding: 0 max(20px, calc((100% - 1120px) / 2)); }
    .shop-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; letter-spacing: -.02em; }
    .shop-brand small { margin-top: 3px; font-family: var(--font-mono); font-size: .62rem; color: var(--ink-mute); letter-spacing: .18em; }
    .shop-nav { display: flex; gap: 24px; }
    .shop-nav a { position: relative; display: inline-flex; align-items: center; height: 60px; color: var(--ink-mute); font-size: .86rem; font-weight: 600; }
    .shop-nav a:hover { color: var(--ink); }
    .shop-nav a.active { color: var(--ink); font-weight: 700; }
    .shop-nav a.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--teal); }
    .shop-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .nav-compact { display: none; height: 36px; align-items: center; padding: 0 6px; font-size: .8rem; font-weight: 600; color: var(--ink-soft); }
    .nav-compact.active { color: var(--ink); }
    .cart-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft); transition: .2s var(--ease); }
    .cart-btn:hover { border-color: var(--teal); color: var(--teal); }
    .dot-n { position: absolute; top: -5px; right: -5px; display: grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; border: 2px solid #f7fbf9; background: var(--teal); color: #fff; font-size: .62rem; font-weight: 800; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .8rem; font-weight: 700; cursor: pointer; }

    /* ---------- 页面 ---------- */
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 100px 0 110px; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    .page-head h1 { margin: 0 0 8px; font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.6rem); letter-spacing: -.045em; line-height: 1.05; }
    .page-head .lead { margin: 0; color: var(--ink-mute); font-size: .88rem; }
    .page-head .lead b { color: var(--teal); font-weight: 700; }
    .ghost-btn { display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0; height: 38px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255,255,255,.6); color: var(--ink); font-weight: 600; font-size: .84rem; transition: .2s var(--ease); }
    .ghost-btn:hover { border-color: var(--ink); background: #fff; }

    /* ---------- 继续阅读 ---------- */
    .resume { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; margin-top: 28px; animation: riseIn .5s var(--ease) both; }
    .rs-main { position: relative; overflow: hidden; display: flex; align-items: center; gap: 24px; padding: 24px 28px; border-radius: 24px; background: #fff; border: 1px solid var(--line); cursor: pointer; transition: .25s var(--ease); }
    .rs-main::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(420px 220px at 100% 0%, hsl(var(--h) 55% 60% / .16), transparent 70%); }
    .rs-main:hover { border-color: rgba(15,110,92,.45); box-shadow: 0 22px 44px -34px rgba(20,32,28,.45); }
    .rs-cover { position: relative; z-index: 1; width: 104px; flex-shrink: 0; }
    .rs-info { position: relative; z-index: 1; flex: 1; min-width: 0; }
    .eyebrow { font-family: var(--font-mono); font-size: .64rem; letter-spacing: .18em; font-weight: 700; color: var(--teal); }
    .rs-info h2 { margin: 8px 0 6px; font-family: var(--font-display); font-size: 1.55rem; letter-spacing: -.035em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rs-info p { margin: 0; font-size: .8rem; color: var(--ink-mute); line-height: 1.7; }
    .rs-prog { display: flex; align-items: center; gap: 12px; margin: 16px 0 18px; }
    .rs-prog .pbar { flex: 1; margin: 0; }
    .rs-prog b { font-family: var(--font-mono); font-size: .76rem; color: var(--ink-soft); }
    .rs-side { padding: 18px 20px 8px; border-radius: 24px; background: rgba(255,255,255,.55); border: 1px solid var(--line); }
    .rs-side h3 { margin: 0 0 4px; font-family: var(--font-mono); font-size: .64rem; letter-spacing: .18em; color: var(--ink-mute); font-weight: 700; }
    .rs-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .rs-item:last-child { border-bottom: 0; }
    .rs-item .cvw { width: 38px; flex-shrink: 0; }
    .rs-item div:nth-child(2) { flex: 1; min-width: 0; }
    .rs-item b { display: block; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rs-item span { display: block; margin-top: 3px; font-size: .72rem; color: var(--ink-mute); }
    .rs-item:hover b { color: var(--teal); }
    .rs-item > i { color: var(--ink-mute); display: grid; transition: .2s var(--ease); }
    .rs-item:hover > i { color: var(--teal); transform: translateX(3px); }

    /* ---------- 页签 + 工具 ---------- */
    .toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: 34px; border-bottom: 1px solid var(--line); }
    .tabs { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { position: relative; flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 2px; border: 0; background: none; color: var(--ink-mute); font-size: .86rem; font-weight: 600; }
    .tabs button:hover, .tabs button.on { color: var(--ink); }
    .tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
    .tabs .c { font-family: var(--font-mono); font-size: .7rem; opacity: .55; }
    .tools { display: flex; align-items: center; gap: 10px; padding-bottom: 7px; }
    .field { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: rgba(255,255,255,.7); color: var(--ink-mute); transition: .2s var(--ease); }
    .field:focus-within { border-color: var(--teal); background: #fff; }
    .field input, .field select { border: 0; outline: none; background: transparent; font-size: .82rem; color: var(--ink); min-width: 0; }
    .field input { width: 150px; }
    .field input::placeholder { color: var(--ink-mute); }
    .field select { cursor: pointer; padding-right: 2px; }
    .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.7); }
    .seg button { display: grid; place-items: center; width: 38px; height: 34px; border: 0; background: none; color: var(--ink-mute); }
    .seg button + button { border-left: 1px solid var(--line-strong); }
    .seg button.on { background: var(--ink); color: #fff; }

    /* ---------- 封面（真实页面用商品封面图；无封面时回退到此样式） ---------- */
    .cvw { position: relative; border-radius: 10px; box-shadow: 0 10px 22px -12px rgba(20,32,28,.55); }
    .cover { position: relative; overflow: hidden; container-type: inline-size; aspect-ratio: 3 / 4; border-radius: 10px; color: #fff; background: linear-gradient(155deg, hsl(var(--h) 36% 38%), hsl(calc(var(--h) + 24) 42% 20%)); }
    .cover::before { content: ""; position: absolute; inset: 0; opacity: .3; background-image: radial-gradient(circle at 20% 30%, #fff 1.5px, transparent 2px), radial-gradient(circle at 70% 60%, #fff 1px, transparent 1.5px); background-size: 28px 28px, 18px 18px; }
    .cover::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6%; background: linear-gradient(90deg, rgba(0,0,0,.3), rgba(255,255,255,.1) 65%, transparent); }
    .cv-t { position: absolute; z-index: 1; top: 12%; right: 20%; max-height: 66%; writing-mode: vertical-rl; font-family: "Songti SC", "Noto Serif SC", SimSun, serif; font-weight: 700; font-size: 14cqw; line-height: 1.3; letter-spacing: .12em; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .cv-a { position: absolute; z-index: 1; left: 0; right: 0; bottom: 8%; text-align: center; font-family: var(--font-mono); font-size: 6.4cqw; letter-spacing: .08em; opacity: .75; }
    .cv-tag { position: absolute; z-index: 2; top: 7%; left: 8%; display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px 2px 5px; border-radius: 99px; background: rgba(255,255,255,.92); color: var(--teal); font-style: normal; font-size: 9.5px; line-height: 14px; font-weight: 700; }
    .cv-fmt { position: absolute; z-index: 2; top: 7%; right: 8%; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.34); font-style: normal; font-family: var(--font-mono); font-size: 8.5px; line-height: 13px; letter-spacing: .04em; }
    .rs-cover .cv-tag, .mini .cv-tag, .mini .cv-fmt, .rs-item .cv-tag, .rs-item .cv-fmt { display: none; }
    .ov { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; background: rgba(14,24,21,.62); color: #fff; font-size: .74rem; font-weight: 600; text-align: center; backdrop-filter: blur(1px); }
    .ov.making { background: repeating-linear-gradient(135deg, rgba(14,24,21,.55) 0 10px, rgba(14,24,21,.46) 10px 20px); }
    .ov .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); animation: pulse 1.6s var(--ease) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .mini .ov, .rs-item .ov { font-size: 0; gap: 0; }
    .mini .ov svg, .rs-item .ov svg { width: 16px; height: 16px; }

    /* ---------- 进度条 / 按钮 ---------- */
    .pbar { height: 4px; margin: 10px 0 7px; border-radius: 2px; background: rgba(20,32,28,.08); overflow: hidden; }
    .pbar i { display: block; height: 100%; border-radius: 2px; background: var(--teal); }
    .teal-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; font-weight: 700; font-size: .8rem; white-space: nowrap; transition: .2s var(--ease); }
    .teal-btn:hover { background: var(--teal-deep); }
    .teal-btn.lg { height: 42px; padding: 0 22px; border-radius: 12px; font-size: .88rem; }
    .soft-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); font-weight: 600; font-size: .8rem; white-space: nowrap; transition: .2s var(--ease); }
    .soft-btn:hover { border-color: var(--ink); }
    .warn-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(196,165,116,.65); background: rgba(196,165,116,.16); color: var(--warn); font-weight: 700; font-size: .8rem; white-space: nowrap; transition: .2s var(--ease); }
    .warn-btn:hover { background: rgba(196,165,116,.3); }
    .icon-btn { display: grid; place-items: center; flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink-mute); transition: .2s var(--ease); }
    .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
    .t-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; background: rgba(15,110,92,.1); color: var(--teal); font-size: .66rem; font-weight: 700; flex-shrink: 0; }
    .fmt { padding: 2px 6px; border-radius: 6px; background: rgba(20,32,28,.06); color: var(--ink-mute); font-family: var(--font-mono); font-size: .64rem; font-weight: 600; letter-spacing: .04em; }
    .st { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; line-height: 1.5; }
    .st i { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--line-strong); }
    .st.teal { color: var(--teal); } .st.teal i { background: var(--teal); }
    .st.warn { color: var(--warn); } .st.warn i { background: var(--warn-dot); }
    .st.mute { color: var(--ink-mute); }

    /* ---------- 网格视图 ---------- */
    .shelf { margin-top: 26px; }
    .shelf.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 20px; }
    .bk { position: relative; display: flex; flex-direction: column; padding: 14px 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 20px; animation: riseIn .5s var(--ease) backwards; transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease); }
    .bk:hover { transform: translateY(-3px); border-color: rgba(15,110,92,.45); box-shadow: 0 20px 42px -32px rgba(20,32,28,.4); }
    .bk .cvw { cursor: pointer; }
    .bi { flex: 1; margin-top: 14px; min-width: 0; }
    .bi h3 { margin: 0 0 5px; font-size: .96rem; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .bi h3:hover { color: var(--teal); }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: .72rem; color: var(--ink-mute); }
    .ba { display: flex; gap: 8px; margin-top: 14px; }
    .ba .teal-btn, .ba .soft-btn, .ba .warn-btn { flex: 1; padding: 0 10px; }

    /* ---------- 列表视图 ---------- */
    .shelf.list { overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 20px; animation: riseIn .5s var(--ease) backwards; }
    .lr { position: relative; display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1fr) 150px auto; align-items: center; gap: 20px; padding: 16px 22px; border-bottom: 1px solid var(--line); transition: background .2s; }
    .lr:last-child { border-bottom: 0; }
    .lr:hover { background: rgba(232,241,238,.5); }
    .lr .mini { cursor: pointer; }
    .lr h3 { margin: 0 0 6px; font-size: .96rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
    .lr h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lr h3:hover { color: var(--teal); }
    .lr .pg .pbar { margin: 0 0 7px; }
    .lr .when { font-size: .74rem; color: var(--ink-mute); line-height: 1.7; }
    .lr .when b { display: block; font-family: var(--font-mono); font-weight: 400; font-size: .7rem; letter-spacing: -.01em; }
    .lr .ba { margin: 0; }

    /* ---------- 更多菜单 ---------- */
    .menu { position: absolute; z-index: 60; right: 10px; bottom: 58px; width: 214px; padding: 6px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: 0 18px 40px -22px rgba(20,32,28,.4); }
    .lr .menu { right: 16px; bottom: auto; top: 56px; }
    .menu .mh { padding: 8px 12px 9px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
    .menu .mh b { display: block; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .menu .mh span { display: block; margin-top: 3px; font-family: var(--font-mono); font-size: .66rem; color: var(--ink-mute); }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: .84rem; color: var(--ink-soft); }
    .menu button:hover { background: var(--paper); color: var(--ink); }
    .menu button:disabled { opacity: .4; cursor: not-allowed; background: none; }
    .scrim { position: fixed; inset: 0; z-index: 55; background: rgba(14,24,21,.4); display: none; }

    /* ---------- 空状态 / 说明 ---------- */
    .empty { margin-top: 26px; padding: 64px 20px; text-align: center; border: 1px dashed var(--line-strong); border-radius: 24px; color: var(--ink-mute); }
    .empty .e-ico { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px; background: rgba(232,241,238,.8); }
    .empty p { margin: 0 0 14px; font-size: .9rem; }
    .empty a { color: var(--teal); font-weight: 700; }
    .empty a:hover { text-decoration: underline; }
    .note { display: flex; gap: 12px; margin-top: 34px; padding: 16px 20px; border-radius: 16px; background: rgba(255,255,255,.55); border: 1px solid var(--line); color: var(--ink-mute); font-size: .78rem; line-height: 1.85; }
    .note svg { margin-top: 3px; color: var(--teal); }
    .note b { color: var(--ink-soft); font-weight: 600; }

    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; max-width: calc(100% - 40px); padding: 10px 14px; border-radius: 4px; background: var(--ink); color: #fff; font-size: .84rem; opacity: 0; transform: translateY(8px); transition: .25s var(--ease); pointer-events: none; }
    .toast.show { opacity: 1; transform: none; }

    /* 设计稿切换条（非产品 UI，内嵌预览时隐藏） */
    .demo-tag { position: fixed; z-index: 90; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 99px; background: rgba(20,32,28,.92); color: rgba(238,248,244,.75); font-size: .74rem; }
    .demo-tag span { padding: 0 10px 0 12px; }
    .demo-tag a { padding: 6px 12px; border-radius: 99px; font-weight: 600; }
    .demo-tag a:hover { background: rgba(255,255,255,.12); color: #fff; }
    .demo-tag a.cur { background: var(--mint); color: var(--ink); }
    body.embed .demo-tag { display: none; }

    /* ================= 手机浏览器（同一页面响应式，无底部标签栏） ================= */
    @media (max-width: 900px) {
      .resume { grid-template-columns: minmax(0, 1fr); }
      .rs-side { display: none; }
      .lr { grid-template-columns: 54px minmax(0, 1fr) 150px auto; }
      .lr .when { display: none; }
    }
    @media (max-width: 760px) {
      .shop-nav { display: none; }
      .nav-compact { display: inline-flex; }
      .shop-top-inner { gap: 10px; padding: 0 14px; height: 56px; }
      .shop-brand small { display: none; }
      .shop-right { gap: 6px; }
      .page { width: calc(100% - 28px); padding: 80px 0 90px; }
      .page-head { align-items: flex-start; }
      .page-head h1 { font-size: 1.9rem; }
      .page-head .ghost-btn { display: none; }
      .resume { margin-top: 20px; }
      .rs-main { gap: 16px; padding: 18px; border-radius: 20px; }
      .rs-cover { width: 78px; }
      .rs-info h2 { font-size: 1.2rem; }
      .rs-info p { font-size: .74rem; }
      .rs-prog { margin: 12px 0 14px; }
      .toolbar { flex-direction: column; align-items: stretch; gap: 0; margin-top: 26px; border-bottom: 0; }
      .tabs { gap: 22px; border-bottom: 1px solid var(--line); }
      .tools { padding: 14px 0 0; }
      .tools .field:first-child { flex: 1; }
      .field input { width: 100%; }
      .tools .field.sort { display: none; }
      .shelf { margin-top: 18px; }
      .shelf.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .bk { padding: 10px 10px 12px; border-radius: 16px; }
      .bk:hover { transform: none; }
      .bi { margin-top: 10px; }
      .bi h3 { font-size: .88rem; }
      .meta { font-size: .68rem; }
      .ba { margin-top: 10px; gap: 6px; }
      .ba .teal-btn, .ba .soft-btn, .ba .warn-btn { min-width: 0; height: 34px; padding: 0 4px; font-size: .74rem; }
      .shelf.grid .ba .teal-btn svg, .shelf.grid .ba .soft-btn svg, .shelf.grid .ba .warn-btn svg { display: none; }
      .ba .icon-btn { width: 34px; height: 34px; }
      .lr { grid-template-columns: 54px minmax(0, 1fr); gap: 12px 14px; padding: 14px; }
      .lr .pg, .lr .ba { grid-column: 1 / -1; }
      .lr .pg { margin-top: -2px; }
      .lr:hover { background: none; }
      .note { margin-top: 26px; padding: 14px 16px; }
      .toast { left: 14px; right: 14px; bottom: 16px; max-width: none; text-align: center; }
      /* 菜单在手机浏览器里以底部弹层呈现（网页常见交互，不是 App 标签栏） */
      .menu, .lr .menu { position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; top: auto; width: auto; padding: 8px 14px 22px; border: 0; border-radius: 22px 22px 0 0; box-shadow: 0 -20px 50px -20px rgba(20,32,28,.5); }
      .menu .mh { padding: 10px 6px 12px; }
      .menu button { padding: 14px 8px; font-size: .92rem; }
      .scrim.on { display: block; }
      .demo-tag { display: none; }
    }
  </style>
</head>

      <nav class="shop-nav">

    <section class="resume" id="resume"></section>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button type="button" class="on" data-t="all">全部 <span class="c"></span></button>
        <button type="button" data-t="text">商城文本 <span class="c"></span></button>
        <button type="button" data-t="commission">我的约稿 <span class="c"></span></button>
      </div>
      <div class="tools">
        <label class="field"><span data-ic="search" data-s="15"></span><input id="q" type="search" placeholder="搜索书名 / 作者" autocomplete="off" /></label>
        <label class="field sort"><span data-ic="sort" data-s="15"></span>
          <select id="sort"><option value="recent">最近阅读</option><option value="bought">购买时间</option><option value="title">书名</option></select></label>
        <div class="seg" id="view"><button type="button" class="on" data-v="grid" title="封面视图"><span data-ic="grid" data-s="16"></span></button><button type="button" data-v="list" title="列表视图"><span data-ic="list" data-s="16"></span></button></div>
      </div>

    <div class="shelf grid" id="shelf"></div>

      <div><b>书架如何收录：</b>你购买过的文本商品（TXT / EPUB）与专属约稿，支付成功后自动上架。TXT / EPUB 可在线阅读，PDF 等格式仅提供下载；约稿交稿后需付清尾款才开放阅读，创作中的约稿会先占位显示进度。</div>
    </aside>
  </main>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
  <div class="demo-tag"><span>设计稿 · 我的书架</span><a class="cur">页面</a><a href="bookshelf-mobile.html">手机浏览器预览</a><a href="reader-pc.html">阅读器</a></div>

  <script>
    /* ================= 示例数据（原创，仅供设计演示） =================
       state：ready 可在线阅读 · download 仅下载（PDF 等） · locked 约稿已交稿待付尾款 · making 约稿创作中 */
    const BOOKS = [
      { id: 1, title: "深夜维修工", author: "佚名", kind: "text", fmt: "TXT", chapters: 22, words: 6.8, state: "ready", hue: 172, bought: "2026-10-12", order: "LX20261012013", ch: 2, pct: 9, last: 202610272241, lastLabel: "今天 22:41", chTitle: "第一章 凌晨三点的扶梯" },
      { id: 2, title: "潮汐图书馆", author: "林深雨", kind: "text", fmt: "EPUB", chapters: 36, words: 11.2, state: "ready", hue: 198, bought: "2026-10-03", order: "LX20261003007", ch: 12, pct: 33, last: 202610262105, lastLabel: "昨天 21:05", chTitle: "第十二章 退潮的钟声" },
      { id: 3, title: "雾港来信", author: "顾青岚", kind: "text", fmt: "TXT", chapters: 48, words: 15.6, state: "ready", hue: 14, bought: "2026-09-28", order: "LX20260928021", ch: 48, pct: 100, last: 202610201930, lastLabel: "10-20", chTitle: "终章 雾散" },
      { id: 4, title: "北纬三十度的夏天", author: "许知夏", kind: "text", fmt: "EPUB", chapters: 28, words: 8.9, state: "ready", hue: 38, bought: "2026-10-25", order: "LX20261025004", ch: 0, pct: 0, last: 0, lastLabel: "", chTitle: "" },
      { id: 5, title: "旧城电台", author: "周行", kind: "text", fmt: "TXT", chapters: 60, words: 19.4, state: "ready", hue: 268, bought: "2026-09-15", order: "LX20260915009", ch: 41, pct: 68, last: 202610182250, lastLabel: "10-18", chTitle: "第四十一章 午夜来电" },
      { id: 6, title: "设计模式速查手册", author: "陈默", kind: "text", fmt: "PDF", chapters: 0, words: 0, state: "download", hue: 214, bought: "2026-10-08", order: "LX20261008016", ch: 0, pct: 0, last: 0, lastLabel: "", chTitle: "" },
      { id: 7, title: "灯塔守夜人", author: "专属约稿", kind: "commission", fmt: "TXT", chapters: 12, words: 3.2, state: "ready", hue: 206, bought: "2026-10-08", order: "LX20261008002", ch: 3, pct: 22, last: 202610261612, lastLabel: "昨天 16:12", chTitle: "第三章 潮位表" },
      { id: 8, title: "春分之后", author: "专属约稿", kind: "commission", fmt: "EPUB", chapters: 0, words: 2.0, state: "locked", hue: 336, bought: "2026-10-22", order: "LX20261022011", due: 300, ch: 0, pct: 0, last: 0, lastLabel: "", chTitle: "" },
      { id: 9, title: "白鸟与列车", author: "专属约稿", kind: "commission", fmt: "TXT", chapters: 0, words: 3.0, state: "making", hue: 222, bought: "2026-10-24", order: "LX20261024005", eta: "11-05", ch: 0, pct: 0, last: 0, lastLabel: "", chTitle: "" },
      { id: 10, title: "无名岛来信", author: "专属约稿", kind: "commission", fmt: "EPUB", chapters: 16, words: 2.4, state: "ready", hue: 150, bought: "2026-09-30", order: "LX20260930018", ch: 0, pct: 0, last: 0, lastLabel: "", chTitle: "" },
    ]

    /* ================= 小工具 ================= */
    const ICON = {
      search: '<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
      grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      sort: '<path d="m3 16 4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>',
      bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
      book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
      lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
      pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
      dots: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
      chev: '<path d="m9 18 6-6-6-6"/>',
      receipt: '<path d="M4 2v20l3-2 3 2 2-2 2 2 3-2 3 2V2l-3 2-3-2-2 2-2-2-3 2z"/><path d="M8 9h8M8 13h6"/>',
      chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
      play: '<polygon points="6 3 20 12 6 21 6 3"/>',
      info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    }
    const ic = (n, s = 16, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`
    const hydrate = (root = document) => root.querySelectorAll("[data-ic]").forEach((el) => { el.outerHTML = ic(el.dataset.ic, +(el.dataset.s || 16)) })

    const $ = (id) => document.getElementById(id)
    const embed = window.self !== window.top || /embed/.test(location.hash)
    if (embed) document.body.classList.add("embed")
    const H = Object.fromEntries(new URLSearchParams(location.hash.slice(1)))
    const S = { tab: H.tab || "all", q: "", sort: H.sort || "recent", view: H.view || "grid", menu: H.menu ? +H.menu : 0 }

    let tt = 0
    function toast(m) { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2200) }
    function nav(url, msg) { if (embed) toast("Demo：" + msg); else location.href = url }
    const READER = () => (innerWidth <= 760 ? "reader-mobile.html" : "reader-pc.html")

    /* ================= 派生信息 ================= */
    const reading = (b) => b.state === "ready" && b.last && b.pct < 100
    const readLabel = (b) => {
      if (b.state === "making") return { t: `创作中 · 预计 ${b.eta} 交稿`, c: "teal", pulse: 1 }
      if (b.state === "locked") return { t: `已交稿 · 待付尾款 ¥${b.due}`, c: "warn" }
      if (b.state === "download") return { t: "仅下载 · 无在线阅读", c: "mute" }
      if (b.pct >= 100) return { t: "已读完", c: "teal" }
      if (!b.last) return { t: "未读", c: "mute" }
      return { t: `读至第 ${b.ch} 章 · ${b.pct}%`, c: "teal" }
    }
    const wordsLabel = (b) => (b.words ? `${b.words} 万字` : "—")
    const action = (b) => {
      if (b.state === "locked") return { cls: "warn-btn", ic: "lock", t: "支付尾款解锁", go: () => nav("order-detail.html", "前往订单详情支付尾款") }
      if (b.state === "making") return { cls: "soft-btn", ic: "chat", t: "查看进度", go: () => nav("my-commissions.html", "打开约稿沟通与进度") }
      if (b.state === "download") return { cls: "soft-btn", ic: "download", t: "下载文件", go: () => toast(`Demo：下载《${b.title}.${b.fmt.toLowerCase()}》`) }
      const t = !b.last ? "开始阅读" : b.pct >= 100 ? "再读一遍" : "继续阅读"
      return { cls: b.pct >= 100 ? "soft-btn" : "teal-btn", ic: "play", t, go: () => nav(READER(), `进入阅读器《${b.title}》`) }
    }
    const byId = (id) => BOOKS.find((b) => b.id === id)

    function coverHTML(b) {
      const tag = b.kind === "commission" ? `<em class="cv-tag">${ic("pen", 10, 2.2)}约稿</em>` : ""
      const fmt = b.fmt !== "TXT" ? `<em class="cv-fmt">${b.fmt}</em>` : ""
      const ov = b.state === "locked" ? `<div class="ov">${ic("lock", 22, 1.8)}待付尾款</div>`
        : b.state === "making" ? `<div class="ov making"><span class="pulse"></span>创作中</div>` : ""
      return `<div class="cvw" data-open="${b.id}"><div class="cover" style="--h:${b.hue}"><span class="cv-t">${b.title}</span><small class="cv-a">${b.author}</small>${tag}${fmt}</div>${ov}</div>`
    }
    function metaHTML(b) {
      return `${b.kind === "commission" ? `<span class="t-badge">${ic("pen", 11, 2)}约稿</span>` : ""}<span>${b.kind === "commission" ? wordsLabel(b) : b.author}</span><span class="fmt">${b.fmt}</span>${b.kind !== "commission" && b.words ? `<span>${wordsLabel(b)}</span>` : ""}`
    }
    function stHTML(b) { const l = readLabel(b); return `<span class="st ${l.c}"><i${l.pulse ? ' style="animation:pulse 1.6s infinite"' : ""}></i>${l.t}</span>` }
    function barHTML(b) { return b.state === "ready" ? `<div class="pbar"><i style="width:${b.pct}%"></i></div>` : "" }
    function menuHTML(b) {
      const canDl = b.state === "ready" || b.state === "download"
      return `<div class="menu" data-menu="${b.id}">
        <div class="mh"><b>${b.title}</b><span>订单 ${b.order}</span></div>
        <button type="button" data-m="order"><span>${ic("receipt", 16)}</span>查看订单详情</button>
        <button type="button" data-m="dl" ${canDl ? "" : "disabled"}><span>${ic("download", 16)}</span>${canDl ? "下载原文件" : "付清尾款后可下载"}</button>
        ${b.kind === "commission" ? `<button type="button" data-m="chat"><span>${ic("chat", 16)}</span>联系作者 / 约稿沟通</button>` : ""}
      </div>`
    }

    function cardHTML(b, i) {
      const a = action(b)
      return `<article class="bk" style="animation-delay:${i * 40}ms" data-id="${b.id}">
        ${coverHTML(b)}
        <div class="bi"><h3 data-open="${b.id}" title="${b.title}">${b.title}</h3><div class="meta">${metaHTML(b)}</div>${barHTML(b)}${b.state === "ready" ? "" : '<div style="height:10px"></div>'}${stHTML(b)}</div>
        <div class="ba"><button type="button" class="${a.cls}" data-open="${b.id}">${ic(a.ic, 14)}${a.t}</button><button type="button" class="icon-btn" data-more="${b.id}" aria-label="更多">${ic("dots", 16)}</button></div>
        ${S.menu === b.id ? menuHTML(b) : ""}
      </article>`
    }
    function rowHTML(b, i) {
      const a = action(b)
      return `<article class="lr" style="animation-delay:${i * 30}ms" data-id="${b.id}">
        <div class="mini">${coverHTML(b)}</div>
        <div><h3 data-open="${b.id}"><span>${b.title}</span></h3><div class="meta">${metaHTML(b)}</div></div>
        <div class="pg">${barHTML(b)}${stHTML(b)}</div>
        <div class="when">${b.last ? `最近阅读<b>${b.lastLabel}</b>` : `购买于<b>${b.bought.slice(5).replace("-", "/")}</b>`}</div>
        <div class="ba"><button type="button" class="${a.cls}" data-open="${b.id}">${ic(a.ic, 14)}${a.t}</button><button type="button" class="icon-btn" data-more="${b.id}" aria-label="更多">${ic("dots", 16)}</button></div>
        ${S.menu === b.id ? menuHTML(b) : ""}
      </article>`
    }

    /* ================= 渲染 ================= */
    function visible() {
      let l = BOOKS.filter((b) => S.tab === "all" || (S.tab === "text" ? b.kind === "text" : b.kind === "commission"))
      const q = S.q.trim().toLowerCase()
      if (q) l = l.filter((b) => (b.title + b.author).toLowerCase().includes(q))
      const cmp = { recent: (a, b) => b.last - a.last || b.bought.localeCompare(a.bought), bought: (a, b) => b.bought.localeCompare(a.bought), title: (a, b) => a.title.localeCompare(b.title, "zh") }[S.sort]
      return l.sort(cmp)
    }
    function renderResume() {
      const rec = BOOKS.filter(reading).sort((a, b) => b.last - a.last)
      if (!rec.length) return ($("resume").innerHTML = "")
      const b = rec[0], side = rec.slice(1, 3), a = action(b)
      $("resume").innerHTML = `
        <div class="rs-main" data-open="${b.id}" style="--h:${b.hue}">
          <div class="rs-cover">${coverHTML(b)}</div>
          <div class="rs-info">
            <div class="eyebrow">CONTINUE READING</div>
            <h2>${b.title}</h2>
            <p>读至 ${b.chTitle}<br />${b.lastLabel} · 共 ${b.chapters} 章 · ${b.fmt}${b.kind === "commission" ? " · 专属约稿" : ""}</p>
            <div class="rs-prog"><div class="pbar"><i style="width:${b.pct}%"></i></div><b>${b.pct}%</b></div>
            <button type="button" class="teal-btn lg">${ic("play", 14)}继续阅读</button>
          </div>
        </div>
        <div class="rs-side"><h3>RECENTLY READ</h3>${side.map((x) => `<div class="rs-item" data-open="${x.id}"><div class="cvw" style="width:38px">${coverHTML(x).replace(/<div class="cvw"[^>]*>/, "").replace(/<\/div>$/, "")}</div><div><b>${x.title}</b><span>${x.chTitle} · ${x.pct}%</span></div><i>${ic("chev", 16)}</i></div>`).join("")}</div>`
    }
    function render() {
      const cnt = { all: BOOKS.length, text: BOOKS.filter((b) => b.kind === "text").length, commission: BOOKS.filter((b) => b.kind === "commission").length }
      document.querySelectorAll("#tabs [data-t]").forEach((b) => { b.classList.toggle("on", b.dataset.t === S.tab); b.querySelector(".c").textContent = cnt[b.dataset.t] })
      document.querySelectorAll("#view [data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === S.view))
      $("sort").value = S.sort
      const l = visible()
      const shelf = $("shelf")
      shelf.className = "shelf " + S.view
      shelf.innerHTML = l.map(S.view === "grid" ? cardHTML : rowHTML).join("")
      $("empty").classList.toggle("hidden", l.length > 0)
      $("empty-text").textContent = S.q ? `没有找到“${S.q}”相关的书籍` : "这里还没有书，去商城挑一本吧"
      $("lead").innerHTML = `共 <b>${BOOKS.length}</b> 本 · <b>${BOOKS.filter(reading).length}</b> 本在读 · <b>${BOOKS.filter((b) => b.state === "locked").length}</b> 本待付尾款 · <b>${BOOKS.filter((b) => b.state === "making").length}</b> 本创作中`
      $("scrim").classList.toggle("on", !!S.menu)
      hydrate()
    }

    /* ================= 交互 ================= */
    document.addEventListener("click", (e) => {
      const more = e.target.closest("[data-more]")
      if (more) { const id = +more.dataset.more; S.menu = S.menu === id ? 0 : id; render(); return }
      const m = e.target.closest("[data-m]")
      if (m) {
        const b = byId(S.menu); S.menu = 0; render()
        if (m.dataset.m === "order") nav("order-detail.html", `打开订单 ${b.order}`)
        if (m.dataset.m === "dl") toast(`Demo：下载《${b.title}.${b.fmt.toLowerCase()}》`)
        if (m.dataset.m === "chat") nav("my-commissions.html", "打开约稿沟通")
        return
      }
      if (S.menu && !e.target.closest(".menu")) { S.menu = 0; render() }
      const open = e.target.closest("[data-open]")
      if (open) { action(byId(+open.dataset.open)).go(); return }
      const act = e.target.closest("[data-act]")
      if (act) toast("Demo：" + act.dataset.act)
    })
    $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-t]"); if (b) { S.tab = b.dataset.t; render() } })
    $("view").addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) { S.view = b.dataset.v; render() } })
    $("sort").addEventListener("change", (e) => { S.sort = e.target.value; render() })
    $("q").addEventListener("input", (e) => { S.q = e.target.value; S.menu = 0; renderKeepFocus() })
    function renderKeepFocus() { const l = visible(); $("shelf").innerHTML = l.map(S.view === "grid" ? cardHTML : rowHTML).join(""); $("empty").classList.toggle("hidden", l.length > 0); $("empty-text").textContent = S.q ? `没有找到“${S.q}”相关的书籍` : "这里还没有书，去商城挑一本吧"; hydrate() }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.menu) { S.menu = 0; render() } })

    hydrate(); renderResume(); render()
  </script>
</body>
</html>
