<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 约稿对话</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="admin.css" />
  <style>
    .stage { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* 顶部紧致 SLA 调度带 */
    .studio-top {
      padding: 16px 26px 14px; flex-shrink: 0;
      background: #fff; border-bottom: 1px solid var(--line-strong);
      display: flex; flex-direction: column; gap: 12px;
    }
    .studio-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .studio-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .studio-title h1 {
      margin: 0; font-family: var(--font-display); font-size: 1.55rem; letter-spacing: -.035em; line-height: 1.05;
    }
    .studio-title .lead { margin: 0; color: var(--ink-mute); font-size: .82rem; }
    .studio-title .lead b { color: var(--teal); font-weight: 700; }

    .sla-strip {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .sla-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 11px; border-radius: 99px;
      background: var(--fog); border: 1px solid var(--line);
      font-size: .74rem; font-weight: 650; color: var(--ink-soft);
    }
    .sla-pill b { font-family: var(--font-mono); color: var(--ink); }
    .sla-pill.alert { background: #fff5f4; border-color: rgba(180,35,24,.25); color: var(--danger); }
    .sla-pill.alert b { color: var(--danger); }
    .sla-pill i.pulse {
      width: 6px; height: 6px; border-radius: 50%; background: var(--danger);
      box-shadow: 0 0 0 3px rgba(180, 35, 24, .18);
    }

    .studio-filter {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    }
    .studio-filter .search { min-width: 210px; max-width: 300px; padding-bottom: 4px; }

    /* 三栏收件箱舞台 */
    .inbox {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: 312px minmax(0, 1fr) 304px;
      background: var(--fog);
    }
    .col { min-height: 0; min-width: 0; overflow: auto; }
    .col-list { background: #fff; border-right: 1px solid var(--line-strong); padding: 10px; display: flex; flex-direction: column; gap: 6px; }

    .thread {
      width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; padding: 12px 13px; transition: .15s var(--ease); display: block;
    }
    .thread:hover { border-color: var(--teal); background: #f9fcfa; }
    .thread.on { border-color: var(--ink); background: var(--paper); box-shadow: inset 3px 0 0 var(--teal); }
    .thread.late { border-left: 3px solid var(--danger); }
    .thread .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .thread .who { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .thread .u-dot {
      width: 24px; height: 24px; border-radius: 99px; flex-shrink: 0; display: grid; place-items: center;
      font-size: .7rem; font-weight: 800; background: var(--ink); color: #fff;
    }
    .thread b { font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread time { color: var(--ink-mute); font-family: var(--font-mono); font-size: .68rem; flex-shrink: 0; }
    .thread .prod-line {
      margin-top: 5px; font-size: .72rem; font-weight: 700; color: var(--teal-deep);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .thread p {
      margin: 4px 0 0; color: var(--ink-mute); font-size: .76rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread .meta { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
      background: var(--danger); color: #fff; font-size: .64rem; font-weight: 800; display: inline-grid; place-items: center;
    }

    /* 中栏：对话流 + 快捷短语 + 输入框 */
    .chat { display: flex; flex-direction: column; min-height: 0; background: #f6f9f7; }
    .chat-head {
      padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0;
    }
    .chat-head h3 { margin: 0; font-family: var(--font-display); font-size: 1.02rem; letter-spacing: -.02em; }
    .chat-head small { display: block; margin-top: 2px; font-size: .74rem; color: var(--ink-mute); font-family: var(--font-mono); }

    .chat-log {
      flex: 1; overflow: auto; padding: 18px 22px 12px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .bubble {
      max-width: 74%; padding: 10px 13px; border-radius: 12px; font-size: .85rem; line-height: 1.55;
      box-shadow: 0 1px 2px rgba(20, 32, 28, .04);
    }
    .bubble.them {
      background: #fff; border: 1px solid var(--line); align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .bubble.me {
      background: var(--ink); color: #eef8f4; align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bubble time {
      display: block; margin-top: 5px; font-size: .65rem; font-family: var(--font-mono);
      opacity: .62;
    }

    .composer-wrap {
      background: #fff; border-top: 1px solid var(--line-strong); padding: 10px 16px 14px; flex-shrink: 0;
    }
    .quick-replies {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
    }
    .quick-replies button {
      height: 24px; padding: 0 9px; border-radius: 99px;
      border: 1px solid var(--line-strong); background: var(--fog);
      font-size: .71rem; color: var(--ink-soft); font-weight: 600;
    }
    .quick-replies button:hover { border-color: var(--teal); color: var(--teal); background: #fff; }
    .composer { display: flex; gap: 10px; align-items: center; }
    .composer input {
      flex: 1; height: 36px; border: 1px solid var(--line-strong); border-radius: 9px;
      background: var(--fog); padding: 0 12px; outline: none; font-size: .85rem;
    }
    .composer input:focus { border-color: var(--teal); background: #fff; }

    /* 右栏：履约进度与交付卡 */
    .ctx {
      background: #fff; border-left: 1px solid var(--line-strong);
      padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 16px;
    }
    .ctx-card {
      padding: 14px; border-radius: 10px; background: var(--fog); border: 1px solid var(--line);
    }
    .ctx h2 { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.18rem; letter-spacing: -.03em; line-height: 1.25; }
    .ctx .sub-meta { margin-top: 4px; font-size: .75rem; color: var(--ink-mute); }

    .flow-steps {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px dashed var(--line-strong);
    }
    .flow-steps li { font-size: .68rem; color: var(--ink-mute); }
    .flow-steps li.on { color: var(--ink); font-weight: 700; }
    .flow-steps i { display: block; height: 4px; border-radius: 99px; background: var(--line-strong); margin-bottom: 5px; }
    .flow-steps li.on i { background: var(--teal); }
    .flow-steps li.now i { background: var(--gold); }

    .ctx-drop {
      border: 1px dashed var(--line-strong); border-radius: 10px; padding: 14px 12px;
      text-align: center; font-size: .78rem; color: var(--ink-mute); background: transparent; width: 100%;
    }
    .ctx-drop:hover { border-color: var(--teal); color: var(--teal); background: rgba(232,241,238,.35); }
    .ctx-acts { display: grid; gap: 8px; }
    .ctx-acts a, .ctx-acts button { justify-content: center; width: 100%; }

    @media (max-width: 1120px) {
      .inbox { grid-template-columns: 260px minmax(0, 1fr); }
      .ctx { display: none; }
    }
    @media (max-width: 720px) {
      .inbox { grid-template-columns: 1fr; }
      .col-list { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line-strong); }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <strong>领匣后台设计稿</strong>
    <nav class="demo-links">
      <a href="admin-dashboard.html">概览</a>
      <a href="admin-revenue.html">营收</a>
      <a href="admin-products.html">商品</a>

    </nav>
  </div>

  <div class="admin">
    <aside class="aside">
      <div class="aside-brand"><span class="brand-mark"></span>领匣控制台</div>
      <nav>
        <div class="nav-cap">工作台</div>
        <a href="admin-dashboard.html"><i data-lucide="layout-dashboard"></i>概览</a>
        <div class="nav-cap">运营管理</div>
        <a href="admin-products.html"><i data-lucide="package"></i>商品与分类</a>
        <a href="admin-users.html"><i data-lucide="users"></i>用户管理</a>
        <div class="nav-cap">交易履约</div>
        <a href="admin-revenue.html"><i data-lucide="wallet"></i>营收<span class="n">5</span></a>
        <a class="active" href="admin-conversations.html"><i data-lucide="message-square"></i>约稿对话<span class="n" id="nav-unread">4</span></a>
        <div class="nav-cap">站点配置</div>
        <a href="admin-settings.html"><i data-lucide="credit-card"></i>支付接入</a>
        <a href="admin-settings.html#system"><i data-lucide="settings-2"></i>系统设置</a>
        <a href="admin-settings.html#website"><i data-lucide="globe"></i>网站设置</a>
      </nav>
      <div class="aside-foot">设计稿 · 不接真实数据<br />xinx.shop</div>
    </aside>

    <div class="main">
      <div class="topbar">
        <span class="crumb">控制台 / 交易履约 / <b>约稿对话</b></span>
        <div class="topbar-right"><span class="date" id="today"></span><div class="avatar">店</div></div>
      </div>

      <div class="stage">
        <div class="studio-top">
          <div class="studio-head">
            <div class="studio-title">
              <h1>约稿收件箱</h1>
              <p class="lead">先回已付定金且等待最久的单，再接新问价</p>
            </div>
            <div class="sla-strip" id="sla-strip"></div>
          </div>

          <div class="studio-filter">
            <div class="chips" id="chips">
              <button type="button" class="on" data-f="all">全部会话</button>
              <button type="button" data-f="unread">未读消息</button>
              <button type="button" data-f="deposit">已付定金</button>
              <button type="button" data-f="late">超过 4 小时</button>
            </div>
            <label class="search">
              <i data-lucide="search" style="width:15px;height:15px;color:var(--ink-mute)"></i>
              <input id="q" placeholder="搜索买家、商品名或订单号…" />
            </label>
          </div>
        </div>

        <div class="inbox">
          <div class="col col-list" id="list"></div>

          <div class="col chat">
            <div class="chat-head" id="chat-head"></div>
            <div class="chat-log" id="log"></div>
            <div class="composer-wrap">
              <div class="quick-replies" id="quick-replies">
                <button type="button" data-quick="收到设定，今晚按这版先写前两章。">大纲已确认</button>
                <button type="button" data-quick="终稿已传到订单附件里，付清尾款即可解锁下载。">提醒付尾款取稿</button>
                <button type="button" data-quick="定金到账就可以排期，字数按约定单价计。">报价与排期</button>
              </div>
              <form class="composer" id="composer">
                <input id="draft" placeholder="回复买家，回车发送…" autocomplete="off" />
                <button class="teal-btn" type="submit"><i data-lucide="send" style="width:14px;height:14px"></i>发送</button>
              </form>
            </div>
          </div>

          <aside class="col ctx" id="ctx"></aside>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="admin.js"></script>
  <script>
    const $ = (id) => document.getElementById(id)
    lxDate()

    const threads = [
      {
        id: "t1", user: "林晚", product: "长篇定制小说", order: "LX260907-0118",
        unread: 1, deposit: true, late: false, step: 2, time: "12:40", wait: "20 分钟",
        preview: "大纲丢这里，第一章我想先看试床那场。",
        status: "待付尾款", money: "定金 ¥640 已收 · 尾款 ¥640",
        messages: [
          { who: "them", t: "昨天 21:02", text: "人设我改了一版，女主别再主动解释。" },
          { who: "me", t: "昨天 21:40", text: "收到。前三章按这个性格往下，今晚交。" },
          { who: "them", t: "12:40", text: "大纲丢这里，第一章我想先看试床那场。" },
        ],
      },
      {
        id: "t2", user: "苏澄", product: "修仙短篇约稿", order: "LX260907-0117",
        unread: 2, deposit: false, late: false, step: 0, time: "11:05", wait: "5 小时",
        preview: "1.5 万。冷面自打脸，事后还说自己干净。",
        status: "待支付", money: "定金 ¥480 还没付",
        messages: [
          { who: "them", t: "10:12", text: "1.5 万字做得到本周吗？" },
          { who: "me", t: "10:40", text: "定金到了就可以排。字数按 1.5 万，单价 64。" },
          { who: "them", t: "11:05", text: "冷面自打脸，事后还说自己干净。我先去付定金。" },
        ],
      },
      {
        id: "t3", user: "顾里", product: "校园补课番外", order: "LX260907-0115",
        unread: 1, deposit: true, late: true, step: 3, time: "昨天", wait: "26 小时",
        preview: "番外按 8 千字算，尾款我走支付宝。",
        status: "待付尾款", money: "定金 ¥256 已收 · 尾款 ¥256 · 稿已传",
        messages: [
          { who: "me", t: "昨天 09:10", text: "终章传好了，付尾款后就能下。" },
          { who: "them", t: "昨天 18:22", text: "番外按 8 千字算，尾款我走支付宝。" },
        ],
      },
      {
        id: "t4", user: "老周", product: "西幻长篇", order: "LX260906-0106",
        unread: 0, deposit: true, late: false, step: 1, time: "昨天", wait: "已回",
        preview: "地图我晚上补，先按第三章写。",
        status: "已付定金", money: "定金 ¥720 已收 · 创作中",
        messages: [
          { who: "them", t: "昨天 18:20", text: "地图我晚上补，先按第三章写。" },
          { who: "me", t: "昨天 19:02", text: "行。第三章先不写结局，留给你确认。" },
        ],
      },
      {
        id: "t5", user: "白鹿", product: "都市职场 3万字", order: "LX260904-0093",
        unread: 0, deposit: true, late: true, step: 3, time: "3 天前", wait: "已回",
        preview: "终稿我看过了，尾款这周内付。",
        status: "待付尾款", money: "尾款 ¥960 未付 · 全文已锁",
        messages: [
          { who: "them", t: "3 天前", text: "终稿我看过了，尾款这周内付。" },
          { who: "me", t: "3 天前", text: "好。付清之前下载还是锁着的。" },
        ],
      },
    ]

    let filter = new URLSearchParams(location.search).get("filter") || "all"
    let query = ""
    let active = threads[0].id
    if (filter !== "all") {
      const b = document.querySelector(`#chips [data-f="${filter}"]`)
      if (b) document.querySelectorAll("#chips button").forEach((x) => x.classList.toggle("on", x === b))
      else filter = "all"
    }

    function match(t) {
      if (filter === "unread" && !t.unread) return false
      if (filter === "deposit" && !t.deposit) return false
      if (filter === "late" && !t.late) return false
      if (query) {
        const q = query.toLowerCase()
        if (![t.user, t.product, t.order, t.preview].some((s) => s.toLowerCase().includes(q))) return false
      }
      return true
    }

    function render() {
      const totalUnread = threads.reduce((a, t) => a + t.unread, 0)
      const lateN = threads.filter((t) => t.late && t.unread > 0).length
      const depN = threads.filter((t) => t.deposit).length
      $("nav-unread").textContent = String(totalUnread)
      $("sla-strip").innerHTML = `
        <span class="sla-pill ${totalUnread ? "alert" : ""}">${totalUnread ? `<i class="pulse"></i>` : ""}未读 <b>${totalUnread}</b> 条</span>
        <span class="sla-pill ${lateN ? "alert" : ""}">超 4h 未回 <b>${lateN}</b></span>
        <span class="sla-pill">已付定金在聊 <b>${depN}</b></span>
      `

      const list = threads.filter(match)
      if (!list.some((t) => t.id === active) && list[0]) active = list[0].id
      $("list").innerHTML = list.map((t) => `
        <button type="button" class="thread ${t.id === active ? "on" : ""} ${t.late ? "late" : ""}" data-id="${t.id}">
          <div class="top">
            <span class="who"><span class="u-dot">${t.user.slice(0, 1)}</span><b>${t.user}</b></span>
            <time>${t.time}</time>
          </div>
          <div class="prod-line">${t.product} · ${t.order}</div>
          <p>${t.preview}</p>
          <div class="meta">
            <span class="tag ${t.deposit ? "gold" : "mute"}">${t.deposit ? "已付定金" : "未付定金"}</span>
            ${t.late ? `<span class="tag danger">超时 ${t.wait}</span>` : ""}
            ${t.unread ? `<span class="badge">${t.unread}</span>` : ""}
          </div>
        </button>
      `).join("") || `<p class="empty">没有符合条件的对话</p>`

      const t = threads.find((x) => x.id === active)
      $("chat-head").innerHTML = t ? `
        <div>
          <h3>${t.user} · ${t.product}</h3>
          <small>${t.order} · ${t.money}</small>
        </div>
        <span class="tag ${t.deposit ? "gold" : "mute"}">${t.status}</span>
      ` : `<div><h3>未选中会话</h3></div>`

      $("log").innerHTML = t ? t.messages.map((m) => `
        <div class="bubble ${m.who}"><div>${m.text}</div><time>${m.t}</time></div>
      `).join("") : ""

      const flowLabels = ["付定金", "沟通设定", "按章交稿", "付尾款"]
      $("ctx").innerHTML = t ? `
        <div class="ctx-card">
          <div style="color:var(--ink-mute);font-size:.7rem;font-weight:700;letter-spacing:.06em">这笔约稿</div>
          <h2>${t.product}</h2>
          <div class="sub-meta">${t.user} · 当前等待 ${t.wait}</div>
          <ol class="flow-steps">${flowLabels.map((lbl, i) => `
            <li class="${i <= t.step ? "on" : ""} ${i === t.step ? "now" : ""}"><i></i>${lbl}</li>
          `).join("")}</ol>
        </div>

        <dl class="kv" style="margin-top:0">
          <dt>关联订单</dt><dd class="mono"><a href="admin-revenue.html?id=${t.order}" style="color:var(--teal)">${t.order}</a></dd>
          <dt>履约状态</dt><dd>${t.status}</dd>
          <dt>款项进度</dt><dd>${t.money}</dd>
        </dl>

        <button class="ctx-drop" type="button" id="upload">
          <i data-lucide="upload" style="width:15px;height:15px;vertical-align:-2px;margin-right:4px"></i>
          上传交稿文件（DOCX / TXT / 图）
        </button>

        <div class="ctx-acts">
          <a class="teal-btn" href="admin-revenue.html?id=${t.order}">打开订单与交付明细</a>
        </div>
        <p class="funnel-note" style="margin-top:0">点击发送后未读数会自动清零。设计稿模式消息仅留在当前页演示。</p>
      ` : ""

      const log = $("log")
      log.scrollTop = log.scrollHeight
      const up = $("upload")
      if (up) up.onclick = () => lxToast("Demo：选择稿件上传至订单 " + t.order)
      lxIcons()
    }

    $("list").onclick = (e) => {
      const b = e.target.closest("[data-id]")
      if (!b) return
      const t = threads.find((x) => x.id === b.dataset.id)
      t.unread = 0
      active = t.id
      render()
    }
    $("chips").onclick = (e) => {
      const b = e.target.closest("[data-f]")
      if (!b) return
      filter = b.dataset.f
      document.querySelectorAll("#chips button").forEach((x) => x.classList.toggle("on", x === b))
      render()
    }
    $("q").oninput = (e) => { query = e.target.value.trim(); render() }
    $("quick-replies").onclick = (e) => {
      const btn = e.target.closest("[data-quick]")
      if (!btn) return
      $("draft").value = btn.dataset.quick
      $("draft").focus()
    }
    $("composer").onsubmit = (e) => {
      e.preventDefault()
      const input = $("draft")
      const text = input.value.trim()
      if (!text) return
      const t = threads.find((x) => x.id === active)
      t.messages.push({ who: "me", t: "刚刚", text })
      t.preview = text
      t.unread = 0
      t.time = "刚刚"
      input.value = ""
      lxToast("Demo：回复已上屏")
      render()
    }
    render()
  </script>
</body>
</html>
