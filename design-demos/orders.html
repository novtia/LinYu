<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>领匣 · 我的订单 Demo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f6e5c'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --ink: #14201c;
      --ink-soft: #3d4f48;
      --ink-mute: #6b7c74;
      --paper: #e8f1ee;
      --fog: #f4f8f6;
      --line: rgba(20, 32, 28, 0.09);
      --line-strong: rgba(20, 32, 28, 0.16);
      --teal: #0f6e5c;
      --teal-deep: #0a5245;
      --mint: #7fd4b8;
      --warn: #8a6a2f;
      --warn-dot: #c4a574;
      --danger: #b42318;
      --font-display: "Syne", "Noto Sans SC", sans-serif;
      --font-body: "Sora", "Noto Sans SC", sans-serif;
      --font-mono: "JetBrains Mono", "Noto Sans SC", monospace;
      --ease: cubic-bezier(.22, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background-color: #eef5f2;
      background-image:
        radial-gradient(1200px 700px at 85% -10%, rgba(127, 212, 184, 0.35), transparent 55%),
        radial-gradient(900px 600px at -5% 20%, rgba(196, 165, 116, 0.18), transparent 50%),
        linear-gradient(180deg, #f7fbf9 0%, var(--fog) 42%, #eef5f2 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .demo-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 80;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      height: 48px; padding: 0 20px; background: #14201c; color: #eef8f4;
    }
    .demo-bar strong { font-family: var(--font-display); font-size: .95rem; letter-spacing: -.02em; }
    .demo-bar span { color: rgba(238,248,244,.55); font-size: .78rem; }
    .demo-bar .jump {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border: 1px solid rgba(238,248,244,.25); border-radius: 8px;
      background: transparent; color: rgba(238,248,244,.8); font-size: .78rem; font-weight: 600;
    }
    .demo-bar .jump:hover { border-color: var(--mint); color: #fff; }
    .seg { display: inline-flex; border: 1px solid rgba(238,248,244,.25); border-radius: 8px; overflow: hidden; }
    .seg button {
      height: 30px; padding: 0 12px; border: 0; background: transparent;
      color: rgba(238,248,244,.6); font-size: .78rem; font-weight: 600;
    }
    .seg button.on { background: var(--mint); color: #14201c; }

    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal) 0%, #1a9a7c 60%, var(--mint) 100%);
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 7px 7px 7px 11px;
      border: 2px solid rgba(255,255,255,.92); border-left: 0; border-radius: 0 4px 4px 0;
    }

    /* ---------- 前台顶栏 ---------- */
    .shop-top {
      position: fixed; top: 48px; left: 0; right: 0; z-index: 70;
      display: flex; align-items: center; gap: 30px;
      height: 60px; padding: 0 max(20px, calc((100% - 1120px) / 2));
      background: rgba(247,251,249,.82); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .shop-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display); font-weight: 800; font-size: 1.08rem; letter-spacing: -.02em;
    }
    .shop-brand small { font-family: var(--font-mono); font-size: .62rem; color: var(--ink-mute); letter-spacing: .18em; margin-top: 3px; }
    .shop-nav { display: flex; gap: 24px; }
    .shop-nav a {
      position: relative; height: 60px; display: inline-flex; align-items: center;
      color: var(--ink-mute); font-size: .86rem; font-weight: 600;
    }
    .shop-nav a:hover { color: var(--ink); }
    .shop-nav a.active { color: var(--ink); font-weight: 700; }
    .shop-nav a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--teal);
    }
    .shop-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .cart-btn {
      position: relative; width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft);
      display: grid; place-items: center; transition: .2s var(--ease);
    }
    .cart-btn:hover { border-color: var(--teal); color: var(--teal); }
    .cart-btn .dot-n {
      position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 99px; background: var(--teal); color: #fff;
      font-size: .62rem; font-weight: 800; display: grid; place-items: center;
      border: 2px solid #f7fbf9;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: var(--ink); color: #fff; font-size: .8rem; font-weight: 700; cursor: pointer;
    }

    /* ---------- 页面 ---------- */
    .page { width: min(980px, calc(100% - 40px)); margin: 0 auto; padding: 144px 0 90px; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
    .page-head h1 {
      margin: 0 0 8px; font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.6rem); letter-spacing: -.045em; line-height: 1.05;
    }
    .page-head .lead { margin: 0; color: var(--ink-mute); font-size: .88rem; }
    .page-head .lead b { color: var(--teal); font-weight: 700; }
    .ghost-btn {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
      height: 38px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 10px;
      background: rgba(255,255,255,.6); color: var(--ink); font-weight: 600; font-size: .84rem;
      transition: .2s var(--ease);
    }
    .ghost-btn:hover { border-color: var(--ink); background: #fff; }

    /* ---------- 状态页签：下划线式 ---------- */
    .tabs { display: flex; gap: 26px; margin-top: 30px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .tabs button {
      position: relative; height: 44px; padding: 0 2px; border: 0; background: none; flex-shrink: 0;
      color: var(--ink-mute); font-size: .86rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .tabs button:hover { color: var(--ink); }
    .tabs button.on { color: var(--ink); }
    .tabs button.on::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink);
    }
    .tabs .c { font-family: var(--font-mono); font-size: .7rem; opacity: .55; }

    /* ---------- 订单票据 ---------- */
    .tickets { display: grid; gap: 18px; margin-top: 26px; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

    .ticket {
      display: block; background: #fff; border: 1px solid var(--line); border-radius: 20px;
      transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
      animation: riseIn .5s var(--ease) both;
    }
    .ticket:hover {
      transform: translateY(-3px);
      border-color: rgba(15,110,92,.45);
      box-shadow: 0 20px 42px -32px rgba(20,32,28,.4);
    }
    .ticket.dead { opacity: .72; }

    .t-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 22px 0;
    }
    .t-idrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .t-id { font-family: var(--font-mono); font-size: .78rem; color: var(--ink-mute); letter-spacing: -.01em; }
    .t-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 99px; background: rgba(15,110,92,.1);
      color: var(--teal); font-size: .68rem; font-weight: 700; flex-shrink: 0;
    }
    .t-time { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-mute); flex-shrink: 0; }

    .t-body { display: flex; align-items: center; gap: 16px; padding: 13px 22px 17px; min-width: 0; }
    .t-covers { display: flex; flex-shrink: 0; }
    .cov {
      width: 46px; height: 60px; border-radius: 10px; display: grid; place-items: center;
      position: relative; overflow: hidden; box-shadow: 0 6px 14px -8px rgba(20,32,28,.45);
    }
    .cov + .cov { margin-left: -14px; box-shadow: 0 0 0 2.5px #fff, 0 6px 14px -8px rgba(20,32,28,.45); }
    .cov::after {
      content: ""; position: absolute; inset: 0; opacity: .28;
      background-image:
        radial-gradient(circle at 20% 30%, #fff 1.5px, transparent 2px),
        radial-gradient(circle at 70% 60%, #fff 1px, transparent 1.5px);
      background-size: 28px 28px, 18px 18px;
    }
    .cov s {
      position: relative; z-index: 1; text-decoration: none;
      font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: rgba(255,255,255,.95);
    }
    .p1 { background: linear-gradient(145deg, #0f6e5c, #1a9a7c 45%, #c4a574); }
    .p2 { background: linear-gradient(145deg, #14201c, #2a4a40 50%, #7fd4b8); }
    .p3 { background: linear-gradient(145deg, #8b6b3d, #c4a574 40%, #e8f1ee); }
    .p4 { background: linear-gradient(145deg, #1d4f46, #0f6e5c, #56b896); }
    .p5 { background: linear-gradient(145deg, #234038, #4d6b5f 55%, #d3e6df); }
    .p6 { background: linear-gradient(145deg, #0a5245, #14201c 60%, #7fd4b8); }

    .t-info { min-width: 0; }
    .t-info b {
      display: block; font-size: .98rem; letter-spacing: -.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .t-info > span { display: block; margin-top: 4px; color: var(--ink-mute); font-size: .76rem; }

    /* 撕裂线 */
    .tear { position: relative; margin: 0 20px; border-top: 1.5px dashed var(--line-strong); }
    .tear::before, .tear::after {
      content: ""; position: absolute; top: -8.5px; width: 15px; height: 15px; border-radius: 50%;
      background: #eef5f2; border: 1px solid var(--line);
    }
    .tear::before { left: -28px; }
    .tear::after { right: -28px; }

    .t-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 22px 15px; }
    .t-status { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .st { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
    .st i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .st.teal { color: var(--teal); } .st.teal i { background: var(--teal); }
    .st.warn { color: var(--warn); } .st.warn i { background: var(--warn-dot); }
    .st.danger { color: var(--danger); } .st.danger i { background: var(--danger); }
    .st.mute { color: var(--ink-mute); } .st.mute i { background: var(--line-strong); }

    /* 约稿迷你流程条 */
    .mini-flow { display: inline-flex; gap: 3px; align-items: center; }
    .mini-flow i { width: 18px; height: 3px; border-radius: 2px; background: var(--line-strong); }
    .mini-flow i.on { background: var(--teal); }
    .mini-flow i.now { background: var(--teal); animation: flowPulse 1.6s var(--ease) infinite; }
    @keyframes flowPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .t-amt { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .t-amt b { font-family: var(--font-display); font-weight: 800; font-size: 1.28rem; letter-spacing: -.035em; }
    .t-amt > i { color: var(--ink-mute); transition: .2s var(--ease); display: grid; place-items: center; }
    .ticket:hover .t-amt > i { color: var(--teal); transform: translateX(3px); }

    /* ---------- 游客查询 ---------- */
    .guest { margin-top: 34px; }
    .g-card {
      max-width: 560px; margin: 0 auto; background: #fff;
      border: 1px solid var(--line); border-radius: 24px; padding: 42px 44px 36px; text-align: center;
    }
    .g-ico {
      width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 16px;
      background: var(--paper); color: var(--teal); display: grid; place-items: center;
    }
    .g-card h2 { margin: 0 0 10px; font-family: var(--font-display); font-size: 1.5rem; letter-spacing: -.03em; }
    .g-card > p { margin: 0; color: var(--ink-mute); font-size: .86rem; line-height: 1.8; }
    .g-form { display: flex; gap: 12px; margin-top: 26px; text-align: left; }
    .g-field {
      flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0;
      border-bottom: 1.5px solid var(--line-strong); padding-bottom: 9px; transition: border-color .2s;
    }
    .g-field:focus-within { border-color: var(--teal); }
    .g-field i { color: var(--ink-mute); flex-shrink: 0; }
    .g-field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: .95rem; }
    .g-field input::placeholder { color: var(--ink-mute); }
    .teal-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 44px; padding: 0 22px; border: 0; border-radius: 12px; flex-shrink: 0;
      background: var(--teal); color: #fff; font-weight: 700; font-size: .9rem;
      transition: .2s var(--ease);
    }
    .teal-btn:hover { background: var(--teal-deep); }
    .g-alt { margin-top: 20px; color: var(--ink-mute); font-size: .8rem; }
    .g-alt a { color: var(--teal); font-weight: 700; cursor: pointer; }
    .g-alt a:hover { text-decoration: underline; }

    .g-result {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      max-width: 560px; margin: 30px auto 0; color: var(--ink-mute); font-size: .78rem;
    }
    .g-result b { font-family: var(--font-mono); color: var(--ink-soft); font-weight: 700; }

    /* ---------- 空状态 ---------- */
    .empty {
      margin-top: 26px; padding: 64px 20px; text-align: center;
      border: 1px dashed var(--line-strong); border-radius: 24px; color: var(--ink-mute);
    }
    .empty .e-ico {
      width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 16px;
      background: rgba(232,241,238,.8); display: grid; place-items: center; color: var(--ink-mute);
    }
    .empty p { margin: 0 0 14px; font-size: .9rem; }
    .empty a { color: var(--teal); font-weight: 700; cursor: pointer; }
    .empty a:hover { text-decoration: underline; }

    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 100;
      padding: 10px 14px; background: var(--ink); color: #fff; font-size: .84rem; border-radius: 4px;
      opacity: 0; transform: translateY(8px); transition: .25s var(--ease); pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }

    @media (max-width: 760px) {
      .shop-nav { display: none; }
      .page { padding-top: 128px; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .t-body { padding-bottom: 14px; }
      .t-info b { white-space: normal; }
      .mini-flow { display: none; }
      .g-form { flex-direction: column; }
      .g-field { padding-bottom: 7px; }
      .g-card { padding: 32px 24px 28px; }
      .demo-bar span, .demo-bar .jump { display: none; }
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <strong>我的订单 Demo</strong>
    <div style="display:flex;align-items:center;gap:12px">
      <span>前台 · 订单列表 · 票据式卡片 + 游客邮箱查询</span>
      <div class="seg" id="view-seg">
        <button type="button" class="on" data-view="member">会员视图</button>
        <button type="button" data-view="guest">游客视图</button>
      </div>
      <a class="jump" href="order-detail.html">订单详情 Demo <i data-lucide="arrow-up-right"></i></a>
    </div>
  </div>

  <header class="shop-top">
    <a class="shop-brand" href="#" data-act="返回商城首页"><span class="brand-mark"></span>领匣<small>LINGXIA</small></a>
    <nav class="shop-nav">
      <a href="#" data-act="返回商城">商城</a>
      <a href="#" data-act="打开约稿">约稿</a>
      <a href="#" class="active">我的订单</a>
    </nav>
    <div class="shop-right">
      <button class="cart-btn" type="button" data-act="打开购物车"><i data-lucide="shopping-bag"></i><span class="dot-n">2</span></button>
      <div class="avatar" data-act="打开个人中心">林</div>
    </div>
  </header>

  <main class="page">
    <header class="page-head">
      <div>
        <h1>我的订单</h1>
        <p class="lead" id="lead">共 <b>8</b> 笔订单 · <b>2</b> 笔进行中 · <b>1</b> 笔待支付</p>
      </div>
      <a class="ghost-btn" href="#" data-act="返回商城"><i data-lucide="arrow-left"></i>返回商城</a>
    </header>

    <div class="tabs" id="tabs">
      <button type="button" class="on" data-f="all">全部 <span class="c">8</span></button>
      <button type="button" data-f="pending">待支付 <span class="c">1</span></button>
      <button type="button" data-f="doing">进行中 <span class="c">2</span></button>
      <button type="button" data-f="done">已完成 <span class="c">3</span></button>
    </div>

    <section class="guest hidden" id="guest">
      <div class="g-card">
        <div class="g-ico"><i data-lucide="mail-search" style="width:24px;height:24px"></i></div>
        <h2>查找我的订单</h2>
        <p>输入购买时填写的邮箱，即可查看订单与发放内容。<br />支付成功后查询链接也会发送到该邮箱，请留意收件箱。</p>
        <form class="g-form" id="g-form">
          <label class="g-field">
            <i data-lucide="mail"></i>
            <input type="email" placeholder="you@example.com" autocomplete="off" required />
          </label>
          <button class="teal-btn" type="submit">查询订单</button>
        </form>
        <div class="g-alt">已有账号？<a data-act="打开登录">登录后查看全部订单</a></div>
      </div>
      <div class="g-result hidden" id="g-result">
        <span><b>lin***@gmail.com</b> 的订单</span>
        <span>共 8 笔</span>
      </div>
    </section>

    <div class="tickets" id="tickets"></div>

    <div class="empty hidden" id="empty">
      <div class="e-ico"><i data-lucide="inbox" style="width:24px;height:24px"></i></div>
      <p id="empty-text">该状态下暂无订单</p>
      <a data-act="去选购商品">去商城逛逛</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id)
    const toastEl = $("toast")
    let toastTimer = 0
    function toast(text) {
      toastEl.textContent = text
      toastEl.classList.add("show")
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200)
    }
    function refreshIcons() {
      if (window.lucide) lucide.createIcons({ attrs: { width: 15, height: 15, "stroke-width": 1.8 } })
    }

    /* ---------- 数据 ---------- */
    const ORDERS = [
      { id: "LX260907-0118", mode: "commission", title: "长篇定制小说《潮湿的信》", sub: "30,000 字 · 分三期交付", time: "09/07 12:40", amount: "¥1,280.00", status: "deposit_paid", tone: "teal", label: "已付定金", flow: ["on", "now", "", ""], covers: [{ c: "p2", ch: "潮" }] },
      { id: "LX260905-0098", mode: "commission", title: "校园补课番外 · 定制约稿", sub: "8,000 字 · 作者已交稿", time: "09/05 21:14", amount: "¥512.00", status: "awaiting_balance", tone: "warn", label: "待付尾款", flow: ["on", "on", "now", ""], covers: [{ c: "p3", ch: "补" }] },
      { id: "LX260904-0091", mode: "normal", title: "《雨夜租客》EPUB", sub: "共 1 件", time: "09/04 08:02", amount: "¥28.00", status: "pending", tone: "warn", label: "待支付", covers: [{ c: "p5", ch: "雨" }] },
      { id: "LX260906-0104", mode: "normal", title: "《深夜维修工》全文 + 番外", sub: "共 2 个文件", time: "09/06 08:17", amount: "¥38.00", status: "paid", tone: "teal", label: "已完成", covers: [{ c: "p1", ch: "深" }, { c: "p4", ch: "番" }] },
      { id: "LX260902-0083", mode: "normal", title: "「都市人妻」合集包", sub: "共 3 件", time: "09/02 22:31", amount: "¥128.00", status: "completed", tone: "teal", label: "已完成", covers: [{ c: "p6", ch: "都" }, { c: "p2", ch: "集" }] },
      { id: "LX260831-0077", mode: "commission", title: "修仙短篇 · 1.5 万字", sub: "15,000 字 · 已交付", time: "08/31 18:03", amount: "¥960.00", status: "completed", tone: "teal", label: "已完成", flow: ["on", "on", "on", "on"], covers: [{ c: "p4", ch: "修" }] },
      { id: "LX260828-0069", mode: "normal", title: "《午夜便利店》TXT", sub: "共 1 件", time: "08/28 21:14", amount: "¥22.00", status: "failed", tone: "danger", label: "支付失败", covers: [{ c: "p5", ch: "午" }] },
      { id: "LX260825-0061", mode: "normal", title: "《纸船》短篇合集", sub: "共 2 件", time: "08/25 09:40", amount: "¥45.00", status: "cancelled", tone: "mute", label: "已取消", covers: [{ c: "p3", ch: "纸" }] },
    ]

    const FILTERS = {
      all: () => true,
      pending: (o) => o.status === "pending",
      doing: (o) => o.status === "deposit_paid" || o.status === "awaiting_balance",
      done: (o) => o.status === "paid" || o.status === "completed",
    }

    function ticketHTML(o, i) {
      const dead = o.status === "failed" || o.status === "cancelled"
      const badge = o.mode === "commission"
        ? `<span class="t-badge"><i data-lucide="pen-line" style="width:11px;height:11px"></i>约稿</span>` : ""
      const flow = o.mode === "commission"
        ? `<span class="mini-flow" title="定金 · 交稿 · 尾款 · 完成">${o.flow.map((f) => `<i class="${f}"></i>`).join("")}</span>` : ""
      return `
      <a class="ticket ${dead ? "dead" : ""}" href="order-detail.html" style="animation-delay:${i * 45}ms">
        <div class="t-top">
          <div class="t-idrow"><span class="t-id">${o.id}</span>${badge}</div>
          <span class="t-time">${o.time}</span>
        </div>
        <div class="t-body">
          <div class="t-covers">${o.covers.map((c) => `<i class="cov ${c.c}"><s>${c.ch}</s></i>`).join("")}</div>
          <div class="t-info"><b>${o.title}</b><span>${o.sub}</span></div>
        </div>
        <div class="tear"></div>
        <div class="t-foot">
          <div class="t-status"><span class="st ${o.tone}"><i></i>${o.label}</span>${flow}</div>
          <div class="t-amt"><b>${o.amount}</b><i data-lucide="chevron-right" style="width:17px;height:17px"></i></div>
        </div>
      </a>`
    }

    function renderList(filter) {
      const list = ORDERS.filter(FILTERS[filter])
      $("tickets").innerHTML = list.map(ticketHTML).join("")
      $("empty").classList.toggle("hidden", list.length > 0)
      refreshIcons()
    }

    /* ---------- 页签 ---------- */
    $("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-f]")
      if (!btn) return
      document.querySelectorAll("#tabs [data-f]").forEach((b) => b.classList.toggle("on", b === btn))
      renderList(btn.dataset.f)
    })

    /* ---------- 会员 / 游客视图 ---------- */
    let view = "member"
    let guestSearched = false
    function applyView() {
      const guest = view === "guest"
      $("guest").classList.toggle("hidden", !guest)
      $("tabs").classList.toggle("hidden", guest)
      $("lead").style.visibility = guest ? "hidden" : "visible"
      $("g-result").classList.toggle("hidden", !guest || !guestSearched)
      $("tickets").classList.toggle("hidden", guest && !guestSearched)
      $("empty").classList.add("hidden")
      if (!guest) renderList(document.querySelector("#tabs .on").dataset.f)
      if (guest && guestSearched) renderList("all")
    }
    $("view-seg").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-view]")
      if (!btn) return
      view = btn.dataset.view
      document.querySelectorAll("#view-seg button").forEach((b) => b.classList.toggle("on", b === btn))
      applyView()
    })
    $("g-form").addEventListener("submit", (e) => {
      e.preventDefault()
      guestSearched = true
      applyView()
      toast("Demo：查询成功，共 8 笔订单")
    })

    /* ---------- 其他交互 ---------- */
    document.addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")
      if (act) {
        e.preventDefault()
        toast(`Demo：${act.dataset.act}`)
      }
    })

    if (location.hash === "#view=guest") {
      view = "guest"
      document.querySelectorAll("#view-seg button").forEach((b) => b.classList.toggle("on", b.dataset.view === "guest"))
      applyView()
    }
    renderList("all")
    refreshIcons()
  </script>
</body>
</html>
